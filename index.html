<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C# 学习笔记 · 测试</title>
<style>
:root{--bg:#fff;--bg2:#f5f7fa;--text:#1a1a2e;--text2:#555;--border:#e2e8f0;--accent:#68217a;--accent2:#9b4dca;--code-bg:#1e1e2e;--code-text:#cdd6f4;--sidebar-bg:#1a1a2e;--sidebar-text:#cdd6f4;--sidebar-hover:#2a2a4e;--card-bg:#fff;--card-shadow:0 2px 12px rgba(0,0,0,.08);--tag-bg:#f0e6f6;--tag-text:#68217a;--badge-bg:#68217a;--badge-text:#fff;--highlight:#fff3cd;--warn:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;display:flex;min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:3px}
.sidebar{width:280px;min-width:280px;height:100vh;position:fixed;top:0;left:0;background:var(--sidebar-bg);color:var(--sidebar-text);overflow-y:auto;z-index:100;display:flex;flex-direction:column}
.sidebar-header{padding:1.5rem 1.25rem;border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:0;background:var(--sidebar-bg);z-index:2}
.sidebar-header h1{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:.5rem}
.sidebar-header p{font-size:.78rem;opacity:.6;margin-top:.25rem}
.sidebar-nav{flex:1;padding:.75rem 0;overflow-y:auto}
.nav-section{margin-bottom:.25rem}
.nav-section-title{padding:.5rem 1.25rem;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;opacity:.45;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.nav-section-title:hover{opacity:.7}
.nav-section.collapsed .nav-lessons{display:none}
.nav-section .arr{font-size:.6rem;transition:transform .2s}
.nav-section.collapsed .arr{transform:rotate(-90deg)}
.nav-lessons{list-style:none}
.nav-lessons li a{display:block;padding:.35rem 1.25rem .35rem 1.75rem;font-size:.82rem;color:var(--sidebar-text);text-decoration:none;opacity:.7;transition:all .15s;border-left:2px solid transparent}
.nav-lessons li a:hover,.nav-lessons li a.active{opacity:1;background:var(--sidebar-hover);border-left-color:var(--accent2)}
.sidebar-footer{padding:.75rem 1.25rem;border-top:1px solid rgba(255,255,255,.1);font-size:.72rem;opacity:.4}
.main{margin-left:280px;flex:1;min-width:0}
.topbar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:.6rem 1.5rem;display:flex;align-items:center;gap:1rem;z-index:50;flex-wrap:wrap}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap input{width:100%;padding:.5rem .75rem .5rem 2.25rem;border:1px solid var(--border);border-radius:8px;font-size:.88rem;background:var(--bg2);color:var(--text);outline:none;transition:all .2s}
.search-wrap input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(155,77,202,.15)}
.search-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);opacity:.4}
.topbar-actions{display:flex;gap:.5rem;align-items:center}
.topbar-actions button{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:.45rem .75rem;border-radius:6px;cursor:pointer;font-size:.82rem;transition:all .15s;white-space:nowrap}
.topbar-actions button:hover{background:var(--border)}
.menu-toggle{display:none;font-size:1.1rem;padding:.4rem .5rem;line-height:1}
.content{padding:1.5rem 2rem 4rem;max-width:960px}
.module-header{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:2px solid var(--border)}
.module-badge{display:inline-block;background:var(--badge-bg);color:var(--badge-text);padding:.2rem .75rem;border-radius:20px;font-size:.75rem;font-weight:600;margin-bottom:.5rem}
.module-title{font-size:1.8rem;font-weight:800;margin-bottom:.25rem}
.module-desc{color:var(--text2);font-size:.95rem}
.lesson{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;margin-bottom:1.25rem;overflow:hidden;box-shadow:var(--card-shadow);scroll-margin-top:80px}
.lesson-header{padding:1rem 1.25rem;display:flex;align-items:center;gap:.75rem;cursor:pointer;user-select:none}
.lesson-header:hover{background:var(--bg2)}
.lesson.expanded .lesson-header{border-bottom:1px solid var(--border)}
.lesson-number{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.lesson-info{flex:1}.lesson-info h3{font-size:1.02rem;font-weight:700}
.tags{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.2rem}
.tag{display:inline-block;background:var(--tag-bg);color:var(--tag-text);padding:.1rem .5rem;border-radius:4px;font-size:.7rem;font-weight:600}
.lesson-toggle{font-size:.8rem;opacity:.4;transition:transform .3s}
.lesson.expanded .lesson-toggle{transform:rotate(180deg)}
.lesson-body{display:none;padding:1.25rem}
.lesson.expanded .lesson-body{display:block}
.lesson-body h4{font-size:.95rem;font-weight:700;color:var(--accent);margin:1rem 0 .5rem}
.lesson-body h4:first-child{margin-top:0}
.lesson-body p{margin-bottom:.6rem;font-size:.9rem}
.lesson-body ul,.lesson-body ol{margin:.5rem 0 .5rem 1.5rem;font-size:.9rem}
.lesson-body li{margin-bottom:.2rem}
.lesson-body table{width:100%;border-collapse:collapse;margin:.75rem 0;font-size:.85rem}
.lesson-body table th,.lesson-body table td{border:1px solid var(--border);padding:.4rem .6rem;text-align:left}
.lesson-body table th{background:var(--bg2);font-weight:700}
.lesson-body table tr:nth-child(even){background:var(--bg2)}
.highlight-box{background:var(--highlight);border-left:4px solid var(--warn);padding:.6rem 1rem;margin:.75rem 0;border-radius:0 6px 6px 0;font-size:.88rem}
.code-block{background:var(--code-bg);color:var(--code-text);border-radius:8px;margin:.75rem 0;overflow:hidden}
.code-header{display:flex;justify-content:space-between;align-items:center;padding:.4rem .75rem;background:rgba(255,255,255,.05);font-size:.75rem}
.code-lang{opacity:.5;text-transform:uppercase;letter-spacing:1px}
.code-copy{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);padding:.15rem .5rem;border-radius:4px;cursor:pointer;font-size:.7rem}
.code-copy:hover{background:rgba(255,255,255,.1)}
.code-block pre{padding:.75rem 1rem;margin:0;overflow-x:auto;font-size:.82rem;font-family:Consolas,monospace;line-height:1.55}
.kw{color:#c792ea}.str{color:#c3e88d}.cm{color:#676e95;font-style:italic}.num{color:#f78c6c}.fn{color:#82aaff}.type{color:#ffcb6b}
@media(max-width:768px){
.sidebar{transform:translateX(-100%);transition:transform .3s}
.sidebar.open{transform:translateX(0)}
.menu-toggle{display:inline-flex}
.main{margin-left:0}
.topbar{padding:.5rem .75rem}
.content{padding:.75rem 1rem 2rem}
}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
<div class="sidebar-header"><h1>📘 C# 学习笔记</h1><p>从入门到进阶</p></div>
<nav class="sidebar-nav" id="sidebarNav"></nav>
<div class="sidebar-footer">Test v1</div>
</aside>
<div class="main">
<div class="topbar">
<button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div class="search-wrap"><span class="search-icon">🔍</span><input type="text" id="searchInput" placeholder="搜索知识点…" oninput="doSearch()"></div>
<div class="topbar-actions">
<button onclick="expandAll()">📖 展开</button>
<button onclick="collapseAll()">📕 折叠</button>
</div>
</div>
<div class="content" id="content"></div>
</div>
<div id="diag" style="position:fixed;top:0;right:0;z-index:99999;padding:4px 10px;font:12px monospace;background:yellow;color:#000;">JS NOT RUN</div>
<script>
document.getElementById('diag').textContent='JS OK';
document.getElementById('diag').style.background='lime';
var modules=[{id:'m1',title:'一、C# 入门教程',desc:'从零开始掌握C#基本语法',badge:'入门',lessons:[
{id:'l1',title:'第一个应用程序',tags:['Hello World','Console'],content:'<h4>第一个C#程序</h4><div class="code-block"><div class="code-header"><span class="code-lang">C#</span></div><pre><span class="kw">using</span> <span class="type">System</span>;\n<span class="kw">class</span> <span class="type">Program</span>{\n  <span class="kw">static void</span> <span class="fn">Main</span>(){\n    Console.WriteLine(<span class="str">"Hello World!"</span>);\n  }\n}</pre></div><p>这是每个程序员的第一行代码。C# 程序从 <code>Main</code> 方法开始执行。</p>'},
{id:'l2',title:'变量',tags:['int','float','string','bool'],content:'<h4>常用变量类型</h4><table><tr><th>类型</th><th>说明</th><th>示例</th></tr><tr><td><code>int</code></td><td>整数(-21亿~21亿)</td><td><code>int age=18;</code></td></tr><tr><td><code>float</code></td><td>单精度浮点数</td><td><code>float h=1.75f;</code></td></tr><tr><td><code>double</code></td><td>双精度浮点数</td><td><code>double d=3.14;</code></td></tr><tr><td><code>bool</code></td><td>布尔值</td><td><code>bool ok=true;</code></td></tr><tr><td><code>string</code></td><td>字符串</td><td><code>string s="Hello";</code></td></tr><tr><td><code>char</code></td><td>单个字符</td><td><code>char c=\'A\';</code></td></tr></table><div class="highlight-box">💡 <strong>口诀：</strong>数字用int，小数用float，字符串用string，真假用bool。</div>'}
]}];
function build(){
var sn=document.getElementById('sidebarNav'),ct=document.getElementById('content');
sn.innerHTML='';ct.innerHTML='';
modules.forEach(function(mod,mi){
var sec=document.createElement('div');sec.className='nav-section';
sec.innerHTML='<div class="nav-section-title" onclick="this.parentElement.classList.toggle(\'collapsed\')"><span>'+(mod.badge?'▾ ':'')+mod.title+'</span><span class="arr">▼</span></div><ul class="nav-lessons">'+mod.lessons.map(function(l,li){return '<li><a href="#l-'+mi+'-'+li+'" onclick="var e=document.getElementById(\'l-'+mi+'-'+li+'\');if(e){e.scrollIntoView({behavior:\'smooth\'});e.classList.add(\'expanded\');}">'+l.title+'</a></li>';}).join('')+'</ul>';
sn.appendChild(sec);
var md=document.createElement('div');md.innerHTML='<div class="module-header"><span class="module-badge">'+mod.badge+'</span><h2 class="module-title">'+mod.title+'</h2><p class="module-desc">'+mod.desc+'</p></div>';
mod.lessons.forEach(function(l,li){
var ld=document.createElement('div');ld.className='lesson';ld.id='l-'+mi+'-'+li;
ld.innerHTML='<div class="lesson-header" onclick="this.parentElement.classList.toggle(\'expanded\')"><span class="lesson-number">'+(li+1)+'</span><div class="lesson-info"><h3>'+l.title+'</h3><div class="tags">'+l.tags.map(function(t){return '<span class="tag">'+t+'</span>';}).join('')+'</div></div><span class="lesson-toggle">▼</span></div><div class="lesson-body">'+l.content+'</div>';
md.appendChild(ld);
});
ct.appendChild(md);
});
document.querySelector('.lesson').classList.add('expanded');
}
function expandAll(){var all=document.querySelectorAll('.lesson');for(var i=0;i<all.length;i++)all[i].classList.add('expanded');}
function collapseAll(){var all=document.querySelectorAll('.lesson');for(var i=0;i<all.length;i++)all[i].classList.remove('expanded');}
function doSearch(){
var q=document.getElementById('searchInput').value.toLowerCase();
var all=document.querySelectorAll('.lesson');
for(var i=0;i<all.length;i++){
var t=all[i].querySelector('h3').textContent.toLowerCase();
all[i].style.display=t.indexOf(q)>=0?'':'none';
}
}
build();
document.getElementById('diag').textContent='ALL OK - '+modules.length+' modules';
</script>
</body>
</html>
