arr.Insert(<span class="num">0</span>, <span class="str">"first"</span>);    <span class="cm">// 指定位置插入</span>

<span class="cm">// 删</span>
arr.Remove(<span class="num">1</span>);              <span class="cm">// 移除指定元素（从头找）</span>
arr.RemoveAt(<span class="num">2</span>);            <span class="cm">// 移除指定位置</span>
arr.Clear();               <span class="cm">// 清空</span>

<span class="cm">// 查</span>
Console.WriteLine(arr[<span class="num">0</span>]);      <span class="cm">// 索引访问</span>
<span class="kw">bool</span> has = arr.Contains(<span class="str">"hello"</span>); <span class="cm">// 是否存在</span>
<span class="kw">int</span> idx = arr.IndexOf(<span class="kw">true</span>);    <span class="cm">// 正向查找</span>
idx = arr.LastIndexOf(<span class="kw">true</span>);    <span class="cm">// 反向查找</span>

<span class="cm">// 改</span>
arr[<span class="num">0</span>] = <span class="str">"new value"</span>;</pre></div>

<h4>关键属性</h4>
<table><tr><th>属性</th><th>说明</th></tr>
<tr><td><code>Count</code></td><td>实际元素个数</td></tr>
<tr><td><code>Capacity</code></td><td>当前容量（自动扩容）</td></tr></table>

<div class="highlight-box">⚠️ <strong>注意：</strong>ArrayList 存放值类型时发生装箱，取出时发生拆箱。后续用泛型 <code>List&lt;T&gt;</code> 替代可以避免此问题。</div>`},

  {id:'adv-2', title:'Stack（栈）', tags:['栈','先进后出','Push','Pop'], content:`
<h4>核心概念</h4>
<p>Stack 是<strong>先进后出（FILO）</strong>的数据结构——先存入的数据后获取，后存入的数据先获取。像一摞盘子。</p>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="type">Stack</span> stack = <span class="kw">new</span> <span class="type">Stack</span>();
stack.Push(<span class="num">1</span>);        <span class="cm">// 压栈（添加）</span>
stack.Push(<span class="str">"hello"</span>);
<span class="kw">object</span> v = stack.Pop();  <span class="cm">// 弹栈（取出并移除栈顶）</span>
v = stack.Peek();         <span class="cm">// 查看栈顶（不移除）</span>
<span class="kw">bool</span> has = stack.Contains(<span class="str">"hello"</span>);
stack.Clear();</pre></div>

<h4>遍历方式</h4>
<ul><li><code>foreach</code> 遍历——从栈顶到栈底</li>
<li><code>stack.ToArray()</code>——转换为 object 数组</li>
<li>循环 <code>Pop()</code>——取出所有元素（会清空栈）</li></ul>

<div class="highlight-box">💡 <strong>使用场景：</strong>撤销/重做功能、括号匹配、表达式求值、深度优先搜索。</div>`},

  {id:'adv-3', title:'Queue（队列）', tags:['队列','先进先出','Enqueue','Dequeue'], content:`
<h4>核心概念</h4>
<p>Queue 是<strong>先进先出（FIFO）</strong>的数据结构——先存入的数据先获取。像排队。</p>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="type">Queue</span> queue = <span class="kw">new</span> <span class="type">Queue</span>();
queue.Enqueue(<span class="num">1</span>);       <span class="cm">// 入队</span>
queue.Enqueue(<span class="str">"hello"</span>);
<span class="kw">object</span> v = queue.Dequeue(); <span class="cm">// 出队（取出最先加入的）</span>
v = queue.Peek();           <span class="cm">// 查看队首（不移除）</span>
<span class="kw">bool</span> has = queue.Contains(<span class="str">"hello"</span>);
queue.Clear();</pre></div>

<div class="highlight-box">💡 <strong>使用场景：</strong>消息队列、任务调度、广度优先搜索、缓冲处理。</div>`},

  {id:'adv-4', title:'Hashtable（哈希表）', tags:['哈希表','键值对','散列表'], content:`
<h4>核心概念</h4>
<p>Hashtable 基于<strong>键的哈希代码</strong>组织键值对，主要作用是<strong>提高数据查询效率</strong>。通过键来访问集合中的元素。</p>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="type">Hashtable</span> ht = <span class="kw">new</span> <span class="type">Hashtable</span>();
ht.Add(<span class="num">1</span>, <span class="str">"one"</span>);        <span class="cm">// 增（键不能重复）</span>
ht.Add(<span class="str">"two"</span>, <span class="num">2</span>);
ht[<span class="num">1</span>] = <span class="str">"updated"</span>;      <span class="cm">// 改（通过键）</span>
ht.Remove(<span class="num">1</span>);            <span class="cm">// 删（通过键）</span>

<span class="cm">// 查</span>
Console.WriteLine(ht[<span class="num">1</span>]);  <span class="cm">// 键不存在返回 null</span>
ht.Contains(<span class="num">1</span>);            <span class="cm">// 是否有此键</span>
ht.ContainsKey(<span class="num">1</span>);
ht.ContainsValue(<span class="str">"one"</span>);</pre></div>

<h4>遍历方式</h4>
<ul><li><code>foreach</code> 遍历 <code>ht.Keys</code>（所有键）</li>
<li><code>foreach</code> 遍历 <code>ht.Values</code>（所有值）</li>
<li><code>foreach (DictionaryEntry item in ht)</code>——同时获取 Key 和 Value</li></ul>`},

  {id:'adv-5', title:'泛型', tags:['泛型','类型参数','代码复用','<>'], content:`
<h4>核心概念</h4>
<p>泛型实现了<strong>类型参数化</strong>——定义时用占位符替代具体类型，使用时再指定。相当于"类型占位符"。作用：不同类型对象的相同逻辑处理 + 避免装箱拆箱。</p>

<h4>泛型分类</h4>
<table><tr><th>分类</th><th>语法</th><th>示例</th></tr>
<tr><td>泛型类</td><td><code>class MyList&lt;T&gt; { }</code></td><td><code>MyList&lt;int&gt;</code></td></tr>
<tr><td>泛型接口</td><td><code>interface IFoo&lt;T&gt; { }</code></td><td><code>IFoo&lt;string&gt;</code></td></tr>
<tr><td>泛型方法</td><td><code>void Foo&lt;T&gt;(T val) { }</code></td><td><code>Foo(10)</code></td></tr>
</table>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 泛型类</span>
<span class="kw">class</span> <span class="type">MyList</span>&lt;T&gt; { <span class="kw">private</span> T[] arr; <span class="kw">public void</span> Add(T v){} }

<span class="cm">// 泛型方法（普通类中）</span>
<span class="kw">public void</span> Test&lt;T&gt;(T val) { Console.WriteLine(val); }

<span class="cm">// 使用</span>
MyList&lt;<span class="kw">int</span>&gt; list = <span class="kw">new</span> MyList&lt;<span class="kw">int</span>&gt;();
<span class="kw">int</span> def = <span class="kw">default</span>(T);  <span class="cm">// 不确定类型时的默认值</span></pre></div>

<div class="highlight-box">💡 <strong>核心优势：</strong>类型安全（编译时检查）+ 避免装箱拆箱（性能）+ 代码复用。泛型是 C# 最重要的特性之一。</div>`},

  {id:'adv-6', title:'泛型约束', tags:['where','struct','class','new()'], content:`
<h4>6 种约束</h4>
<table><tr><th>约束</th><th>语法</th><th>含义</th></tr>
<tr><td>值类型</td><td><code>where T : struct</code></td><td>T 必须是值类型</td></tr>
<tr><td>引用类型</td><td><code>where T : class</code></td><td>T 必须是引用类型</td></tr>
<tr><td>无参构造</td><td><code>where T : new()</code></td><td>T 必须有 public 无参构造函数</td></tr>
<tr><td>类约束</td><td><code>where T : 类名</code></td><td>T 必须是指定类或其派生类</td></tr>
<tr><td>接口约束</td><td><code>where T : 接口名</code></td><td>T 必须实现指定接口</td></tr>
<tr><td>泛型约束</td><td><code>where T : U</code></td><td>T 必须是 U 或其派生类</td></tr>
</table>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 组合使用</span>
<span class="kw">class</span> <span class="type">Test</span>&lt;T&gt; <span class="kw">where</span> T : <span class="kw">class</span>, <span class="kw">new</span>() { }

<span class="cm">// 多个泛型各有约束</span>
<span class="kw">class</span> <span class="type">Test</span>&lt;T, K&gt; <span class="kw">where</span> T : <span class="kw">class</span>, <span class="kw">new</span>() <span class="kw">where</span> K : <span class="kw">struct</span> { }</pre></div>`},

  {id:'adv-7', title:'List（泛型列表）', tags:['List<T>','泛型数组','类型安全'], content:`
<h4>核心概念</h4>
<p>List&lt;T&gt; 是可变类型的<strong>泛型数组</strong>。替代 ArrayList，避免装箱拆箱，类型安全。</p>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 需要 using System.Collections.Generic;</span>
<span class="type">List</span>&lt;<span class="kw">int</span>&gt; list = <span class="kw">new</span> <span class="type">List</span>&lt;<span class="kw">int</span>&gt;();

<span class="cm">// 增</span>
list.Add(<span class="num">1</span>); list.AddRange(anotherList); list.Insert(<span class="num">0</span>, <span class="num">99</span>);
<span class="cm">// 删</span>
list.Remove(<span class="num">1</span>); list.RemoveAt(<span class="num">0</span>); list.Clear();
<span class="cm">// 查</span>
list[<span class="num">0</span>]; list.Contains(<span class="num">1</span>); list.IndexOf(<span class="num">1</span>); list.LastIndexOf(<span class="num">1</span>);
<span class="cm">// 属性</span>
list.Count; list.Capacity;<span class="cm">// 容量自动扩容</span></pre></div>

<div class="highlight-box">💡 <strong>最佳实践：</strong>绝大多数场景下，<code>List&lt;T&gt;</code> 是首选集合类型。只有在需要特殊数据结构（栈、队列、链表）时才选择其他集合。</div>`},

  {id:'adv-8', title:'Dictionary（泛型字典）', tags:['Dictionary<K,V>','键值对','类型安全'], content:`
<h4>核心概念</h4>
<p>Dictionary&lt;K,V&gt; 是<strong>拥有泛型的 Hashtable</strong>。类型安全，键值对类型可自定义。</p>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="type">Dictionary</span>&lt;<span class="kw">int</span>, <span class="kw">string</span>&gt; dic = <span class="kw">new</span> <span class="type">Dictionary</span>&lt;<span class="kw">int</span>, <span class="kw">string</span>&gt;();

<span class="cm">// 增——键不能重复</span>
dic.Add(<span class="num">1</span>, <span class="str">"one"</span>);  dic[<span class="num">2</span>] = <span class="str">"two"</span>;
<span class="cm">// 删</span>
dic.Remove(<span class="num">1</span>);  dic.Clear();
<span class="cm">// 查——键不存在会报错（用 ContainsKey 先判断！）</span>
<span class="kw">if</span> (dic.ContainsKey(<span class="num">1</span>)) Console.WriteLine(dic[<span class="num">1</span>]);
dic.ContainsValue(<span class="str">"one"</span>);
<span class="cm">// 改</span>
dic[<span class="num">1</span>] = <span class="str">"updated"</span>;

<span class="cm">// 遍历</span>
<span class="kw">foreach</span> (<span class="type">KeyValuePair</span>&lt;<span class="kw">int</span>, <span class="kw">string</span>&gt; kvp <span class="kw">in</span> dic)
    Console.WriteLine(<span class="str">$"键:{kvp.Key} 值:{kvp.Value}"</span>);</pre></div>`},

  {id:'adv-9', title:'顺序存储和链式存储', tags:['数据结构','顺序表','链表','性能对比'], content:`
<h4>两种存储结构</h4>
<table><tr><th>特性</th><th>顺序存储</th><th>链式存储</th></tr>
<tr><td>存储方式</td><td>连续内存单元</td><td>任意存储单元 + 指针</td></tr>
<tr><td>代表</td><td>数组、List、Stack、Queue</td><td>链表（单向/双向/循环）</td></tr>
<tr><td>增（中间）</td><td>❌ 慢（需移动）</td><td>✅ 快（只改指针）</td></tr>
<tr><td>删（中间）</td><td>❌ 慢（需移动）</td><td>✅ 快（只改指针）</td></tr>
<tr><td>查（随机）</td><td>✅ 快 O(1)</td><td>❌ 慢 O(n)</td></tr>
<tr><td>改（随机）</td><td>✅ 快 O(1)</td><td>❌ 慢 O(n)</td></tr>
</table>

<h4>自定义单向链表</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">class</span> <span class="type">LinkedNode</span>&lt;T&gt; { <span class="kw">public</span> T value; <span class="kw">public</span> LinkedNode&lt;T&gt; nextNode; }
<span class="kw">class</span> <span class="type">LinkedList</span>&lt;T&gt; {
    <span class="kw">public</span> LinkedNode&lt;T&gt; head, last;
    <span class="kw">public void</span> Add(T v) { <span class="cm">/* 追加节点 */</span> }
    <span class="kw">public void</span> Remove(T v) { <span class="cm">/* 重新链接 */</span> }
}</pre></div>

<div class="highlight-box">💡 <strong>选择原则：</strong>需要频繁随机访问→顺序存储。需要频繁插入/删除→链式存储。实际开发中 <code>List&lt;T&gt;</code> 能满足大部分需求。</div>`},

  {id:'adv-10', title:'LinkedList（双向链表）', tags:['LinkedList<T>','双向链表','LinkedListNode'], content:`
<h4>核心概念</h4>
<p>LinkedList&lt;T&gt; 是 C# 内置的<strong>泛型双向链表</strong>。每个节点有 Previous 和 Next 两个指针。</p>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="type">LinkedList</span>&lt;<span class="kw">int</span>&gt; ll = <span class="kw">new</span> <span class="type">LinkedList</span>&lt;<span class="kw">int</span>&gt;();
ll.AddLast(<span class="num">10</span>);           <span class="cm">// 尾部添加</span>
ll.AddFirst(<span class="num">20</span>);          <span class="cm">// 头部添加</span>
<span class="type">LinkedListNode</span>&lt;<span class="kw">int</span>&gt; n = ll.Find(<span class="num">20</span>);
ll.AddAfter(n, <span class="num">15</span>);       <span class="cm">// 节点后添加</span>
ll.AddBefore(n, <span class="num">11</span>);      <span class="cm">// 节点前添加</span>

ll.RemoveFirst(); ll.RemoveLast(); ll.Remove(<span class="num">20</span>);

<span class="cm">// 节点遍历（从尾到头）</span>
<span class="kw">var</span> node = ll.Last;
<span class="kw">while</span> (node != <span class="kw">null</span>) { Console.WriteLine(node.Value); node = node.Previous; }</pre></div>

<div class="highlight-box">💡 不能通过下标直接访问！必须通过 Find() 或遍历定位。增删节点不涉及元素移动，性能优于 List。</div>`},

  {id:'adv-11', title:'泛型栈和队列', tags:['Stack<T>','Queue<T>','类型安全'], content:`
<h4>对比非泛型和泛型</h4>
<table><tr><th>非泛型（旧）</th><th>泛型（推荐）</th><th>命名空间</th></tr>
<tr><td><code>Stack</code></td><td><code>Stack&lt;T&gt;</code></td><td>System.Collections.Generic</td></tr>
<tr><td><code>Queue</code></td><td><code>Queue&lt;T&gt;</code></td><td>System.Collections.Generic</td></tr>
</table>

<p>使用方式和非泛型版本<strong>完全一致</strong>（Push/Pop/Peek, Enqueue/Dequeue/Peek），区别在于：</p>
<ul><li>存储的元素<strong>类型安全</strong>（编译时检查）</li><li><strong>不产生装箱拆箱</strong>（性能更好）</li><li>取出时<strong>不需要类型转换</strong></li></ul>

<div class="highlight-box">💡 <strong>原则：</strong>始终优先使用泛型集合（<code>List&lt;T&gt;</code>, <code>Dictionary&lt;K,V&gt;</code>, <code>Stack&lt;T&gt;</code>, <code>Queue&lt;T&gt;</code>）。非泛型集合（ArrayList, Hashtable, Stack, Queue）仅在与旧代码兼容时使用。</div>`},

  {id:'adv-12', title:'委托（Delegate）', tags:['delegate','函数容器','Action','Func'], content:`
<h4>核心概念</h4>
<p>委托是<strong>函数（方法）的容器</strong>——可以存储、传递函数。本质是一个<strong>类</strong>，定义了函数的签名（返回值和参数类型）。</p>

<h4>自定义委托</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 声明：函数声明前加 delegate</span>
<span class="kw">delegate void</span> <span class="type">MyDelegate</span>(<span class="kw">int</span> a);
<span class="kw">delegate</span> T <span class="type">MyGenericDelegate</span>&lt;T, K&gt;(T v, K k);

<span class="cm">// 使用</span>
<span class="type">MyDelegate</span> d = <span class="kw">new</span> <span class="type">MyDelegate</span>(SomeMethod);
d = SomeMethod;  <span class="cm">// 简写</span>
d(<span class="num">10</span>);  d.Invoke(<span class="num">10</span>);  <span class="cm">// 两种调用方式

// 多播委托——一个容器存储多个函数</span>
d += AnotherMethod;  d -= SomeMethod;
d = <span class="kw">null</span>;  <span class="cm">// 清空</span></pre></div>

<h4>系统内置委托（Action / Func）</h4>
<table><tr><th>委托</th><th>说明</th></tr>
<tr><td><code>Action</code></td><td>无返回值，0~16 个参数</td></tr>
<tr><td><code>Action&lt;T&gt;</code></td><td>无返回值，1 个参数</td></tr>
<tr><td><code>Func&lt;TResult&gt;</code></td><td>有返回值，0 个参数</td></tr>
<tr><td><code>Func&lt;T, TResult&gt;</code></td><td>有返回值，1~16 个参数（最后一个泛型是返回类型）</td></tr>
</table>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="type">Action</span>&lt;<span class="kw">int</span>, <span class="kw">string</span>&gt; a = (x, s) => Console.WriteLine(<span class="str">$"{x}:{s}"</span>);
<span class="type">Func</span>&lt;<span class="kw">int</span>, <span class="kw">int</span>, <span class="kw">int</span>&gt; f = (x, y) => x + y;
Console.WriteLine(f(<span class="num">3</span>, <span class="num">5</span>));  <span class="cm">// 8</span></pre></div>

<div class="highlight-box">💡 <strong>核心思想：</strong>委托让函数可以作为参数传递，是实现<strong>回调机制</strong>、<strong>事件驱动</strong>和 <strong>LINQ</strong> 的基础。</div>`},

  {id:'adv-13', title:'事件（Event）', tags:['event','委托安全','观察者模式'], content:`
<h4>核心概念</h4>
<p>事件是<strong>委托的安全包裹</strong>——让委托使用更安全。事件是对委托的封装，防止外部随意置空或调用。</p>

<h4>委托 vs 事件（关键区别）</h4>
<table><tr><th>操作</th><th>委托</th><th>事件</th></tr>
<tr><td>在类外部赋值（=）</td><td>✅ 允许</td><td>❌ 不允许（只能 += / -=）</td></tr>
<tr><td>在类外部调用</td><td>✅ 允许</td><td>❌ 不允许（只能在类内部调用）</td></tr>
<tr><td>作为临时变量</td><td>✅ 允许</td><td>❌ 不允许</td></tr>
</table>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">class</span> <span class="type">Player</span> {
    <span class="kw">public event</span> <span class="type">Action</span> OnDie;  <span class="cm">// 事件声明</span>
    <span class="kw">public void</span> Die() {
        Console.WriteLine(<span class="str">"玩家死亡"</span>);
        OnDie?.Invoke();  <span class="cm">// 安全调用（?. 检测 null）</span>
    }
}
<span class="cm">// 外部使用</span>
<span class="kw">var</span> p = <span class="kw">new</span> Player();
p.OnDie += () => Console.WriteLine(<span class="str">"游戏结束"</span>);  <span class="cm">// 订阅</span>
<span class="cm">// p.OnDie = null;  // ❌ 编译错误！事件不允许外部赋值</span></pre></div>

<div class="highlight-box">💡 <strong>设计模式：</strong>事件是<strong>观察者模式</strong>（发布-订阅模式）在 C# 中的核心实现。解耦发送者和接收者。</div>`},

  {id:'adv-14', title:'匿名函数', tags:['delegate{}','匿名委托','闭包'], content:`
<h4>核心概念</h4>
<p>匿名函数就是<strong>没有名字的函数</strong>，必须配合委托或事件使用。用 <code>delegate</code> 关键字直接定义函数体。</p>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 无参无返回</span>
<span class="type">Action</span> a = <span class="kw">delegate</span> () { Console.WriteLine(<span class="str">"匿名"</span>); };

<span class="cm">// 有参</span>
<span class="type">Action</span>&lt;<span class="kw">int</span>, <span class="kw">string</span>&gt; b = <span class="kw">delegate</span> (<span class="kw">int</span> x, <span class="kw">string</span> s) { Console.WriteLine(x + s); };

<span class="cm">// 有返回值</span>
<span class="type">Func</span>&lt;<span class="kw">string</span>&gt; c = <span class="kw">delegate</span> () { <span class="kw">return</span> <span class="str">"hello"</span>; };

<span class="cm">// 作为函数参数传入</span>
SomeMethod(<span class="num">100</span>, <span class="kw">delegate</span> () { Console.WriteLine(<span class="str">"回调逻辑"</span>); });</pre></div>

<h4>缺点</h4>
<p>匿名函数<strong>无法单独移除</strong>——因为函数没有名字，添加到委托容器后不能指定移除某一个匿名函数。要移除只能置空整个委托。</p>`},

  {id:'adv-15', title:'Lambda 表达式', tags:['=>','表达式树','简化语法'], content:`
<h4>核心概念</h4>
<p>Lambda 表达式是<strong>匿名函数的简写</strong>。语法更简洁：(参数) => { 函数体 }。</p>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 匿名函数 vs Lambda</span>
<span class="type">Action</span> a1 = <span class="kw">delegate</span> () { Console.WriteLine(<span class="str">"匿名"</span>); };
<span class="type">Action</span> a2 = () => { Console.WriteLine(<span class="str">"Lambda"</span>); };

<span class="cm">// 参数类型可省略</span>
<span class="type">Action</span>&lt;<span class="kw">int</span>&gt; b = (x) => { Console.WriteLine(x); };

<span class="cm">// 有返回值——单行可省略 {} 和 return</span>
<span class="type">Func</span>&lt;<span class="kw">int</span>, <span class="kw">int</span>, <span class="kw">int</span>&gt; sum = (a, b) => a + b;

<span class="cm">// 无参数</span>
<span class="type">Func</span>&lt;<span class="kw">string</span>&gt; greet = () => <span class="str">"Hello"</span>;</pre></div>

<h4>闭包（Closure）</h4>
<p>内层函数引用外层函数的变量，<strong>即使外层函数已执行完毕</strong>，变量生命周期被改变。注意：捕获的是<strong>变量的引用</strong>，不是创建时的值。</p>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span> value = <span class="num">10</span>;
<span class="type">Action</span> act = () => Console.WriteLine(value);
value = <span class="num">20</span>;
act();  <span class="cm">// 输出 20（不是10！捕获的是变量引用）</span>

<span class="cm">// for 循环闭包陷阱——必须用局部变量捕获</span>
<span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i < <span class="num">5</span>; i++) {
    <span class="kw">int</span> index = i;  <span class="cm">// ← 关键！捕获当前值</span>
    actions.Add(() => Console.WriteLine(index));
}</pre></div>`},

  {id:'adv-16', title:'List 排序', tags:['Sort','IComparable','委托排序'], content:`
<h4>三种排序方式</h4>
<table><tr><th>方式</th><th>适用场景</th><th>示例</th></tr>
<tr><td>默认 Sort()</td><td>系统类型（int, float, string 等）</td><td><code>list.Sort();</code></td></tr>
<tr><td>实现 IComparable&lt;T&gt;</td><td>自定义类有固定排序规则</td><td><code>class Item : IComparable&lt;Item&gt;</code></td></tr>
<tr><td>传入委托函数</td><td>灵活排序，不需要改类</td><td><code>list.Sort((a,b) => a.id - b.id)</code></td></tr>
</table>

<h4>IComparable 实现</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">class</span> <span class="type">Item</span> : <span class="type">IComparable</span>&lt;Item&gt; {
    <span class="kw">public int</span> money;
    <span class="kw">public int</span> CompareTo(Item other) {
        <span class="cm">// &lt;0：放前面  =0：位置不变  &gt;0：放后面</span>
        <span class="kw">return</span> other.money - <span class="kw">this</span>.money;  <span class="cm">// 降序</span>
    }
}

<span class="cm">// 委托函数排序（最灵活）</span>
shopItems.Sort((a, b) => a.id > b.id ? <span class="num">1</span> : -<span class="num">1</span>);</pre></div>`},

  {id:'adv-17', title:'协变逆变', tags:['out','in','泛型变体'], content:`
<h4>核心概念</h4>
<table><tr><th>关键字</th><th>含义</th><th>只能用作</th><th>示例</th></tr>
<tr><td><code>out</code>（协变）</td><td>子类→父类，和谐变化</td><td>返回值</td><td><code>IEnumerable&lt;out T&gt;</code></td></tr>
<tr><td><code>in</code>（逆变）</td><td>父类→子类，逆常规</td><td>参数</td><td><code>Action&lt;in T&gt;</code></td></tr>
</table>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 协变 out —— 返回值用</span>
<span class="kw">delegate</span> T <span class="type">TestOut</span>&lt;<span class="kw">out</span> T&gt;();
<span class="type">TestOut</span>&lt;Son&gt; os = () => <span class="kw">new</span> Son();
<span class="type">TestOut</span>&lt;Father&gt; of = os;  <span class="cm">// 协变：父类泛型装子类</span>

<span class="cm">// 逆变 in —— 参数用</span>
<span class="kw">delegate void</span> <span class="type">TestIn</span>&lt;<span class="kw">in</span> T&gt;(T t);
<span class="type">TestIn</span>&lt;Father&gt; iF = (f) => {};
<span class="type">TestIn</span>&lt;Son&gt; iS = iF;         <span class="cm">// 逆变：子类泛型装父类</span></pre></div>

<div class="highlight-box">💡 协变逆变<strong>只能用于泛型接口和泛型委托</strong>。out 和 in 不仅影响类型兼容，还约束了泛型类型的使用位置（返回值/参数）。</div>`},

  {id:'adv-18', title:'多线程', tags:['Thread','异步','lock','后台线程'], content:`
<h4>核心概念</h4>
<p>线程是操作系统运算调度的<strong>最小单位</strong>。多线程可以同时运行代码的<strong>多条"管道"</strong>，用于处理复杂耗时的逻辑（寻路、网络通信等）。</p>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 需要 using System.Threading;</span>
<span class="type">Thread</span> t = <span class="kw">new</span> <span class="type">Thread</span>(MyThreadFunc);
t.IsBackground = <span class="kw">true</span>;  <span class="cm">// 后台线程：主线程结束后自动终止</span>
t.Start();

<span class="cm">// 线程休眠（在哪个线程调用就休眠哪个线程）</span>
<span class="type">Thread</span>.Sleep(<span class="num">1000</span>);  <span class="cm">// 毫秒</span>

<span class="cm">// 锁——防止多线程同时操作共享数据</span>
<span class="kw">static object</span> lockObj = <span class="kw">new object</span>();
<span class="kw">lock</span> (lockObj) { <span class="cm">/* 临界区代码 */</span> }</pre></div>

<h4>线程安全要点</h4>
<ul><li>多个线程共享同一进程的内存空间</li><li>同时操作同一片内存可能出<strong>竞态条件</strong>问题</li><li>用 <code>lock</code> 语句对共享资源加锁保护</li><li>后台线程不会阻止进程终止</li></ul>

<div class="highlight-box">⚠️ <strong>注意：</strong>在 .NET Core 中 <code>Thread.Abort()</code> 不支持，应使用 bool 标识控制死循环退出。现代开发中更多使用 <code>Task</code> 和 <code>async/await</code>。</div>`},

  {id:'adv-19', title:'预处理器指令', tags:['#define','#if','条件编译'], content:`
<h4>常用预处理器指令</h4>
<table><tr><th>指令</th><th>作用</th></tr>
<tr><td><code>#define SYMBOL</code></td><td>定义一个符号</td></tr>
<tr><td><code>#undef SYMBOL</code></td><td>取消定义符号</td></tr>
<tr><td><code>#if / #elif / #else / #endif</code></td><td>条件编译</td></tr>
<tr><td><code>#warning "msg"</code></td><td>产生编译警告</td></tr>
<tr><td><code>#error "msg"</code></td><td>产生编译错误</td></tr>
<tr><td><code>#region / #endregion</code></td><td>代码折叠</td></tr>
</table>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="pp">#define</span> UNITY_ANDROID
<span class="pp">#define</span> UNITY_IOS

<span class="pp">#if</span> UNITY_ANDROID
    Console.WriteLine(<span class="str">"安卓平台代码"</span>);
<span class="pp">#elif</span> UNITY_IOS
    Console.WriteLine(<span class="str">"iOS平台代码"</span>);
<span class="pp">#else</span>
    Console.WriteLine(<span class="str">"其他平台"</span>);
<span class="pp">#endif</span></pre></div>

<div class="highlight-box">💡 <strong>使用场景：</strong>Unity 开发中用于区分平台（Android/iOS/PC），调试代码的条件编译，以及版本特性开关。</div>`},

  {id:'adv-20', title:'反射（Reflection）', tags:['Type','Assembly','Activator','元数据'], content:`
<h4>核心概念</h4>
<p>反射：程序<strong>运行时</strong>查看自身或其他程序集的<strong>元数据</strong>（类、函数、变量等），并可以实例化对象、调用方法、操作成员。</p>

<h4>三大核心类</h4>
<table><tr><th>类</th><th>作用</th></tr>
<tr><td><code>Type</code></td><td>类的信息类——反射功能的基础</td></tr>
<tr><td><code>Assembly</code></td><td>程序集类——加载 dll/exe</td></tr>
<tr><td><code>Activator</code></td><td>快速实例化对象</td></tr>
</table>

<h4>获取 Type 的三种方式</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="type">Type</span> t1 = obj.GetType();                <span class="cm">// 通过对象</span>
<span class="type">Type</span> t2 = <span class="kw">typeof</span>(MyClass);               <span class="cm">// 通过类名</span>
<span class="type">Type</span> t3 = <span class="type">Type</span>.GetType(<span class="str">"命名空间.类名"</span>); <span class="cm">// 通过字符串</span>

<span class="cm">// 获取并调用构造函数</span>
<span class="kw">var</span> ctor = t.GetConstructor(<span class="kw">new</span> <span class="type">Type</span>[] { <span class="kw">typeof</span>(<span class="kw">int</span>) });
<span class="kw">var</span> obj = ctor.Invoke(<span class="kw">new object</span>[] { <span class="num">42</span> });

<span class="cm">// 获取并调用方法</span>
<span class="kw">var</span> method = t.GetMethod(<span class="str">"MyMethod"</span>);
method.Invoke(obj, <span class="kw">new object</span>[] { param1, param2 });</pre></div>

<div class="highlight-box">💡 <strong>为什么要学：</strong>Unity 引擎的基本工作原理建立在反射之上。理解反射是理解 Unity 组件系统的关键。</div>`},

  {id:'adv-21', title:'特性（Attribute）', tags:['Attribute','元数据扩展','Obsolete'], content:`
<h4>核心概念</h4>
<p>特性本质是一个<strong>类</strong>，用于为代码的元数据添加<strong>额外信息</strong>。可以通过反射获取这些信息做特殊处理。</p>

<h4>自定义特性</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 1. 定义特性类（继承 Attribute）</span>
[<span class="type">AttributeUsage</span>(AttributeTargets.Class | AttributeTargets.Method, AllowMultiple = <span class="kw">true</span>)]
<span class="kw">class</span> <span class="type">MyAttribute</span> : <span class="type">Attribute</span> {
    <span class="kw">public string</span> info;
    <span class="kw">public</span> MyAttribute(<span class="kw">string</span> info) { <span class="kw">this</span>.info = info; }
}

<span class="cm">// 2. 使用特性</span>
[<span class="type">My</span>(<span class="str">"这是描述信息"</span>)]
<span class="kw">class</span> <span class="type">MyClass</span> { }

<span class="cm">// 3. 反射获取特性</span>
<span class="kw">var</span> attrs = <span class="kw">typeof</span>(MyClass).GetCustomAttributes(<span class="kw">true</span>);</pre></div>

<h4>系统常用特性</h4>
<table><tr><th>特性</th><th>作用</th></tr>
<tr><td><code>[Obsolete]</code></td><td>标记方法已过时</td></tr>
<tr><td><code>[Conditional]</code></td><td>条件编译</td></tr>
<tr><td><code>[DllImport]</code></td><td>调用外部 DLL 函数</td></tr>
</table>

<div class="highlight-box">💡 Unity 中大量使用特性：<code>[SerializeField]</code>、<code>[Range]</code>、<code>[RequireComponent]</code> 等。理解特性是理解 Unity 编辑器扩展的基础。</div>`},

  {id:'adv-22', title:'迭代器（Iterator）', tags:['IEnumerable','yield return','foreach'], content:`
<h4>核心概念</h4>
<p>迭代器是一种设计模式，让对象可以<strong>通过 foreach 遍历</strong>，而不暴露内部结构。</p>

<h4>两种实现方式</h4>
<table><tr><th>方式</th><th>接口</th><th>复杂度</th></tr>
<tr><td>传统方式</td><td>IEnumerable + IEnumerator</td><td>高（需实现 MoveNext, Current, Reset）</td></tr>
<tr><td>yield return（推荐）</td><td>IEnumerable</td><td>低（只需实现 GetEnumerator）</td></tr>
</table>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// yield return 语法糖（推荐）</span>
<span class="kw">class</span> <span class="type">MyList</span>&lt;T&gt; : <span class="type">IEnumerable</span> {
    <span class="kw">private</span> T[] arr;
    <span class="kw">public</span> IEnumerator GetEnumerator() {
        <span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i < arr.Length; i++)
            <span class="kw">yield return</span> arr[i];  <span class="cm">// 暂时返回，保留状态</span>
    }
}
<span class="cm">// 现在可以用 foreach 遍历了！</span></pre></div>

<h4>foreach 本质</h4>
<ol><li>调用对象的 <code>GetEnumerator()</code> 获取迭代器</li><li>反复调用 <code>MoveNext()</code> 判断是否有下一个</li><li>每次通过 <code>Current</code> 获取当前元素并赋值给循环变量</li></ol>`},

  {id:'adv-23', title:'特殊语法', tags:['var','可空类型','??','$','=>'], content:`
<h4>C# 便捷语法速查</h4>
<table><tr><th>语法</th><th>说明</th><th>示例</th></tr>
<tr><td><code>var</code></td><td>隐式类型（必须初始化，只能做临时变量）</td><td><code>var x = 10;</code></td></tr>
<tr><td>对象初始化器</td><td>大括号直接初始化公共成员</td><td><code>new Person{Name="Tom",Age=18}</code></td></tr>
<tr><td>集合初始化器</td><td>大括号直接初始化集合</td><td><code>new List&lt;int&gt;{1,2,3}</code></td></tr>
<tr><td>匿名类型</td><td>var + new {} 创建临时对象</td><td><code>var v = new {name="Bob",age=20}</code></td></tr>
<tr><td><code>T?</code></td><td>可空类型（值类型可为 null）</td><td><code>int? x = null;</code></td></tr>
<tr><td><code>??</code></td><td>空合并操作符（null 则取右边）</td><td><code>int y = x ?? 100;</code></td></tr>
<tr><td><code>?.</code></td><td>空条件操作符（null 则不执行）</td><td><code>obj?.Method();</code></td></tr>
<tr><td><code>$""</code></td><td>字符串内插</td><td><code>$"Hello, {name}!"</code></td></tr>
<tr><td><code>=></code></td><td>表达式体成员</td><td><code>int Add(int a,int b) => a+b;</code></td></tr>
</table>

<div class="highlight-box">💡 这些语法糖让代码更<strong>简洁可读</strong>，是现代 C#（6.0+）的重要特性。</div>`},

  {id:'adv-24', title:'值和引用（深度理解）', tags:['存储规则','生命周期','语句块'], content:`
<h4>七大核心问题总结</h4>
<ol>
<li><strong>如何判断值/引用类型？</strong>F12 查看定义：class→引用，struct→值</li>
<li><strong>语句块层级：</strong>命名空间→类/接口/结构体→函数→条件分支/循环</li>
<li><strong>变量生命周期：</strong>临时变量在语句块结束时回收（值类型自动回收，引用类型堆内容变垃圾待 GC）</li>
<li><strong>结构体中的值和引用：</strong>结构体本身是值类型（栈），但其内部的引用类型成员仍在堆中</li>
<li><strong>类中的值和引用：</strong>类本身在堆中，所有成员（值+引用）都在堆中</li>
<li><strong>数组存储：</strong>数组本身是引用类型。值类型数组→堆中存具体内容；引用类型数组→堆中存地址</li>
<li><strong>结构体继承接口：</strong>用接口容器装结构体存在装箱拆箱</li>
</ol>

<div class="highlight-box">💡 <strong>口诀：</strong>值类型跟着大哥走，引用类型一根筋。（"大哥"指外层的存储位置）</div>`},

  {id:'adv-25', title:'插入排序', tags:['插入排序','分治','O(n²)'], content:`
<h4>基本原理</h4>
<p>将数组分为<strong>排序区</strong>和<strong>未排序区</strong>。每次从未排序区取第一个元素，在排序区中找到合适位置插入。默认第一个元素在排序区。</p>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">1</span>; i < arr.Length; i++) {
    <span class="kw">int</span> noSortNum = arr[i];
    <span class="kw">int</span> sortIndex = i - <span class="num">1</span>;
    <span class="kw">while</span> (sortIndex >= <span class="num">0</span> && arr[sortIndex] > noSortNum) {
        arr[sortIndex + <span class="num">1</span>] = arr[sortIndex];
        --sortIndex;
    }
    arr[sortIndex + <span class="num">1</span>] = noSortNum;
}</pre></div>
<p>时间复杂度：O(n²)，最好 O(n)。稳定排序。适用于小规模数据或基本有序的数据。</p>`},

  {id:'adv-26', title:'希尔排序', tags:['步长','分组排序','优化插入'], content:`
<h4>基本原理</h4>
<p>希尔排序是<strong>插入排序的升级版</strong>——引入<strong>步长</strong>概念。通过步长将序列分为多个子序列分别进行插入排序，步长逐步缩小（每次/2），最终步长为 1 时就是普通插入排序。</p>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">for</span> (<span class="kw">int</span> step = arr.Length / <span class="num">2</span>; step > <span class="num">0</span>; step /= <span class="num">2</span>) {
    <span class="kw">for</span> (<span class="kw">int</span> i = step; i < arr.Length; i++) {
        <span class="kw">int</span> noSortNum = arr[i];
        <span class="kw">int</span> sortIndex = i - step;
        <span class="kw">while</span> (sortIndex >= <span class="num">0</span> && arr[sortIndex] > noSortNum) {
            arr[sortIndex + step] = arr[sortIndex];
            sortIndex -= step;
        }
        arr[sortIndex + step] = noSortNum;
    }
}</pre></div>
<p>时间复杂度：O(n¹·³)~O(n²)，不稳定排序。在极限情况下有效降低插入排序的时间复杂度。</p>`},

  {id:'adv-27', title:'归并排序', tags:['分治','递归','合并','O(n log n)'], content:`
<h4>基本原理 —— 归并 = 递归 + 合并</h4>
<ol><li><strong>递归平分数组：</strong>不停对半分割直到长度为 1</li><li><strong>排序合并：</strong>左右元素比较，依次放入新数组，一侧用完直接放对面</li></ol>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">static int</span>[] Merge(<span class="kw">int</span>[] arr) {
    <span class="kw">if</span> (arr.Length < <span class="num">2</span>) <span class="kw">return</span> arr;
    <span class="kw">int</span> mid = arr.Length / <span class="num">2</span>;
    <span class="kw">int</span>[] left = arr[..mid], right = arr[mid..];
    <span class="kw">return</span> Sort(Merge(left), Merge(right));  <span class="cm">// 递归分+合并</span>
}</pre></div>
<p>时间复杂度：<strong>O(n log n)</strong>，稳定排序。需要 O(n) 额外空间。适合大数据量排序。</p>

<h4>归并 vs 快速排序</h4>
<table><tr><th>特性</th><th>归并</th><th>快速</th></tr><tr><td>额外空间</td><td>O(n)</td><td>O(log n)</td></tr>
<tr><td>稳定性</td><td>稳定</td><td>不稳定</td></tr>
<tr><td>最坏情况</td><td>O(n log n)</td><td>O(n²)</td></tr></table>`},

  {id:'adv-28', title:'快速排序', tags:['基准','递归','交换','O(n log n)'], content:`
<h4>基本原理</h4>
<p><strong>选取基准→左右游标→比较交换→基准定位→递归左右</strong>。快速排序是边排序边拆分。</p>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">static void</span> QuickSort(<span class="kw">int</span>[] arr, <span class="kw">int</span> left, <span class="kw">int</span> right) {
    <span class="kw">if</span> (left >= right) <span class="kw">return</span>;
    <span class="kw">int</span> pivot = arr[left], l = left, r = right;
    <span class="kw">while</span> (l != r) {
        <span class="kw">while</span> (l < r && arr[r] > pivot) r--;
        arr[l] = arr[r];
        <span class="kw">while</span> (l < r && arr[l] < pivot) l++;
        arr[r] = arr[l];
    }
    arr[l] = pivot;  <span class="cm">// 基准归位</span>
    QuickSort(arr, left, l - <span class="num">1</span>);   <span class="cm">// 递归左</span>
    QuickSort(arr, l + <span class="num">1</span>, right);  <span class="cm">// 递归右</span>
}</pre></div>
<p>时间复杂度：平均 O(n log n)，最坏 O(n²)。不稳定排序。<strong>实际应用中常作为系统排序的默认实现</strong>（如 <code>Array.Sort()</code>）。</p>

<h4>排序算法总结</h4>
<table><tr><th>算法</th><th>平均时间</th><th>空间</th><th>稳定性</th></tr>
<tr><td>冒泡</td><td>O(n²)</td><td>O(1)</td><td>稳定</td></tr>
<tr><td>选择</td><td>O(n²)</td><td>O(1)</td><td>不稳定</td></tr>
<tr><td>插入</td><td>O(n²)</td><td>O(1)</td><td>稳定</td></tr>
<tr><td>希尔</td><td>O(n¹·³)</td><td>O(1)</td><td>不稳定</td></tr>
<tr><td>归并</td><td>O(n log n)</td><td>O(n)</td><td>稳定</td></tr>
<tr><td>快速</td><td>O(n log n)</td><td>O(log n)</td><td>不稳定</td></tr></table>`}
]},

<h4>控制台基础回顾</h4>
<p>在入门阶段，我们学习了 <code>Console.WriteLine()</code>、<code>Console.ReadLine()</code>、<code>Console.ReadKey()</code> 这三个最基本的控制台方法。本课将深入控制台的更多高级操作，让你能写出更专业的控制台程序。</p>

<h4>清空控制台 —— Console.Clear()</h4>

<h4>设置窗口与缓冲区大小</h4>
<table><tr><th>方法</th><th>说明</th></tr>
<tr><td><code>Console.SetWindowSize(width, height)</code></td><td>设置控制台窗口的可见宽度和高度</td></tr>
<tr><td><code>Console.SetBufferSize(width, height)</code></td><td>设置控制台缓冲区（可滚动区域）的宽度和高度</td></tr></table>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 设置窗口为 80列 x 25行</span>
Console.SetWindowSize(<span class="num">80</span>, <span class="num">25</span>);
<span class="cm">// 设置缓冲区为 100列 x 50行（比窗口大，会出现滚动条）</span>
Console.SetBufferSize(<span class="num">100</span>, <span class="num">50</span>);</pre></div>

<div class="highlight-box">注意：缓冲区大小必须大于或等于窗口大小！通常先设置缓冲区再设置窗口，否则可能抛出异常。</div>

<h4>光标控制 —— SetCursorPosition</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 将光标移动到第 5 列、第 3 行（从0开始计数）</span>
Console.SetCursorPosition(<span class="num">5</span>, <span class="num">3</span>);
Console.Write(<span class="str">"Hello"</span>);  <span class="cm">// 在指定位置输出</span></pre></div>

<p>这是实现贪食蛇、俄罗斯方块等控制台游戏的核心方法——先移动光标到目标位置，再绘制内容，而非顺序输出。</p>

<h4>控制台颜色</h4>

<tr><td><code>Console.ForegroundColor</code></td><td>前景色（文字颜色）</td><td rowspan="2">Black, DarkBlue, DarkGreen, DarkCyan, DarkRed, DarkMagenta, DarkYellow, Gray, DarkGray, Blue, Green, Cyan, Red, Magenta, Yellow, White</td></tr>
<tr><td><code>Console.BackgroundColor</code></td><td>背景色</td></tr></table>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 设置红色文字 + 白色背景</span>
Console.ForegroundColor = ConsoleColor.Red;
Console.BackgroundColor = ConsoleColor.White;
Console.Clear();  <span class="cm">// Clear() 后新背景色才会铺满</span>

<span class="cm">// 恢复默认颜色</span>

<div class="highlight-box">设置背景色后必须调用 <code>Console.Clear()</code> 才能让新背景色铺满整个控制台，否则只有新输出行的背景变色。</div>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 游戏中隐藏光标，避免闪烁干扰画面</span>

<div class="highlight-box">这些控制台高级操作是实现控制台小游戏（贪食蛇、俄罗斯方块、弹球等）的基础。掌握光标控制和颜色设置，你就能写出视觉效果丰富的控制台程序。</div>`

<h4>为什么需要随机数？</h4>
<p>在游戏开发中，随机数无处不在：敌人随机生成位置、开宝箱随机掉落装备、随机地图生成……掌握随机数是游戏开发的必备技能。</p>

<h4>创建随机数对象</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 创建随机数生成器对象（一个程序只需要一个 Random 对象）</span>
Random r = <span class="kw">new</span> Random();</pre></div>

<h4>生成随机数的三种方式</h4>
<table><tr><th>方法</th><th>说明</th><th>范围</th></tr>
<tr><td><code>r.Next()</code></td><td>生成非负随机整数</td><td>0 ~ 21亿+（int.MaxValue）</td></tr>
<tr><td><code>r.Next(max)</code></td><td>生成 0 到 max-1 的随机整数</td><td>[0, max) 左包含右不包含</td></tr>
<tr><td><code>r.Next(min, max)</code></td><td>生成 min 到 max-1 的随机整数</td><td>[min, max) 左包含右不包含</td></tr>
</table>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre>Random r = <span class="kw">new</span> Random();

<span class="kw">int</span> a = r.Next();         <span class="cm">// 0 ~ 2147483647 之间的随机数</span>
<span class="kw">int</span> b = r.Next(<span class="num">100</span>);      <span class="cm">// 0 ~ 99 之间的随机数（不含100）</span>
<span class="kw">int</span> c = r.Next(<span class="num">10</span>, <span class="num">20</span>);   <span class="cm">// 10 ~ 19 之间的随机数（含10不含20）</span></pre></div>

<h4>核心原则：左包含右不包含</h4>
<div class="highlight-box"><strong>口诀：</strong>左包含，右不包含。即 <code>r.Next(min, max)</code> 的结果 <strong>大于等于 min</strong>，但 <strong>严格小于 max</strong>。这和数组索引的习惯一致。</div>

<h4>常见随机数需求及写法</h4>
<table><tr><th>需求</th><th>写法</th><th>说明</th></tr>
<tr><td>1~6 骰子点数</td><td><code>r.Next(1, 7)</code></td><td>含1含6</td></tr>
<tr><td>0~100 百分比</td><td><code>r.Next(0, 101)</code></td><td>含0含100</td></tr>
<tr><td>数组随机索引</td><td><code>r.Next(arr.Length)</code></td><td>0 ~ Length-1</td></tr>
<tr><td>随机布尔值</td><td><code>r.Next(2) == 0</code></td><td>0或1，50%概率</td></tr>
</table>

<h4>Random 是伪随机</h4>
<p>计算机生成的随机数是"伪随机"——通过数学公式计算出来的。如果使用相同的种子（seed）初始化 Random，每次运行得到的"随机数序列"完全相同。</p>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 指定种子的 Random —— 每次运行结果相同（调试用）</span>
Random r1 = <span class="kw">new</span> Random(<span class="num">12345</span>);

<span class="cm">// 无参构造 —— 使用系统时间作为种子（每次运行结果不同）</span>
Random r2 = <span class="kw">new</span> Random();</pre></div>

<h4>常见错误：短时间内创建多个 Random</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">//  错误写法 —— 循环中反复 new Random()</span>
<span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i < <span class="num">10</span>; i++)
{
    Random r = <span class="kw">new</span> Random();  <span class="cm">// 每次 new 种子可能相同</span>
    Console.WriteLine(r.Next(<span class="num">100</span>)); <span class="cm">// 可能输出10个相同的数！</span>
}

<span class="cm">//  正确写法 —— 共用一个 Random 对象</span>
Random r = <span class="kw">new</span> Random();
<span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i < <span class="num">10</span>; i++)
{
    Console.WriteLine(r.Next(<span class="num">100</span>)); <span class="cm">// 每次结果不同</span>
}</pre></div>

<div class="highlight-box"><strong>记忆规则：</strong>一个程序只 <code>new</code> 一个 Random 对象，全局共用。不要在循环中反复创建。</div>

<h4>扩展：生成随机浮点数</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre>Random r = <span class="kw">new</span> Random();
<span class="kw">double</span> d = r.NextDouble();  <span class="cm">// 生成 0.0 ~ 1.0 之间的随机 double（不含1.0）</span>

<span class="cm">// 生成指定范围的随机浮点数</span>
<span class="kw">double</span> range = r.NextDouble() * (<span class="num">10.0</span> - <span class="num">1.0</span>) + <span class="num">1.0</span>;  <span class="cm">// 1.0 ~ 10.0</span></pre></div>`
      }

<h4>从一个 .cs 文件到多个 .cs 文件</h4>
<p>入门阶段我们所有的代码都写在 <code>Program.cs</code> 的 Main 函数里。随着项目越来越复杂，把全部代码塞在一个文件里会变得难以维护。这时候就需要将代码拆分到多个 <code>.cs</code> 文件中。</p>

<h4>.cs 文件是什么？</h4>
<ul>
  <li><strong>.cs</strong> 是 C# 源代码文件的后缀名（C Sharp 的缩写）</li>
  <li>一个 C# 项目可以包含<strong>任意数量</strong>的 .cs 文件</li>
  <li>编译时，所有 .cs 文件会合并编译成一个 .exe（可执行文件）</li>
</ul>

<h4>项目文件夹结构（编译后）</h4>
<table><tr><th>文件夹/文件</th><th>说明</th></tr>
<tr><td><code>项目根目录/</code></td><td>包含 .cs 源文件和 .csproj 项目配置文件</td></tr>
<tr><td><code>bin/Debug/netX.X/</code></td><td>编译后的输出文件夹，含 .exe 和 .dll 文件</td></tr>
<tr><td><code>obj/</code></td><td>编译过程中的中间文件（可忽略）</td></tr>
<tr><td><code>.csproj</code></td><td>项目配置文件（SDK版本、目标框架等）</td></tr>
</table>

<h4>解决方案资源管理器</h4>
<p>在 Visual Studio 右侧的<strong>解决方案资源管理器</strong>中，你可以：</p>
<ul>
  <li>右键项目名 → "添加" → "类" → 创建新的 .cs 文件</li>
  <li>查看和管理项目中所有 .cs 文件</li>
  <li>查看项目引用的外部库（依赖项）</li>
</ul>

<h4>不同文件间如何引用？—— using 与命名空间</h4>

<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// ============ 文件1：Player.cs ============</span>
<span class="kw">namespace</span> <span class="type">MyGame</span>    <span class="cm">// 定义命名空间</span>
{
    <span class="kw">class</span> <span class="type">Player</span>       <span class="cm">// 玩家类</span>
    {
        <span class="kw">public string</span> name;
        <span class="kw">public int</span> hp;

        <span class="kw">public void</span> <span class="fn">Attack</span>()
        {
            Console.WriteLine(name + <span class="str">" 发动攻击！"</span>);
        }
    }
}

<span class="cm">// ============ 文件2：Program.cs ============</span>
<span class="kw">using</span> <span class="type">MyGame</span>;  <span class="cm">// 引用命名空间，才能使用 Player 类</span>

<span class="kw">class</span> <span class="type">Program</span>
{
    <span class="kw">static void</span> <span class="fn">Main</span>(<span class="type">string</span>[] args)
    {
        Player p = <span class="kw">new</span> Player();
        p.name = <span class="str">"战士"</span>;
        p.hp = <span class="num">100</span>;
        p.Attack();  <span class="cm">// 跨文件调用成功！</span>
    }
}</pre></div>

<h4>using 的三种用法</h4>
<table><tr><th>用法</th><th>语法</th><th>示例</th></tr>
<tr><td>引用命名空间</td><td><code>using 命名空间名;</code></td><td><code>using System;</code></td></tr>
<tr><td>定义别名</td><td><code>using 别名 = 类型;</code></td><td><code>using MyList = System.Collections.Generic.List&lt;int&gt;;</code></td></tr>
<tr><td>引入静态类</td><td><code>using static 类名;</code></td><td><code>using static System.Math;</code> 之后可直接写 <code>Sqrt(9)</code></td></tr>
</table>

<h4>如果没有 using 怎么办？</h4>
<p>仍然可以用<strong>全限定名</strong>来访问：</p>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre>MyGame.Player p = <span class="kw">new</span> MyGame.Player();  <span class="cm">// 不写 using 也能用，就是打字多</span></pre></div>

<h4>同一项目中的类自动可见</h4>
<div class="highlight-box"><strong>重点：</strong>在同一个项目（同一个命名空间）下的所有 .cs 文件中的类，<strong>默认就可以互相使用</strong>，不需要额外导入。命名空间的作用是组织代码、避免命名冲突。不同项目/不同命名空间才需要用 <code>using</code> 来引用。</div>`

        content: `
<h4>项目概述</h4>
<p>贪食蛇是一个经典的控制台小游戏，综合运用了<strong>变量、循环、条件判断、数组/列表、控制台操作、随机数、键盘输入</strong>等几乎所有入门阶段的知识。</p>

<h4>核心需求分析</h4>
<table><tr><th>模块</th><th>功能</th><th>涉及知识点</th></tr>
<tr><td>地图绘制</td><td>用字符画出围墙和空地</td><td>循环、SetCursorPosition、Console.Write</td></tr>
<tr><td>蛇的移动</td><td>蛇身跟随蛇头移动</td><td>数组/List、坐标计算</td></tr>
<tr><td>食物生成</td><td>随机位置出现食物</td><td>Random、碰撞检测</td></tr>
<tr><td>输入控制</td><td>WASD/方向键改变方向</td><td>Console.ReadKey、switch</td></tr>
<tr><td>碰撞检测</td><td>撞墙/撞自己 → 游戏结束</td><td>if 条件判断</td></tr>
<tr><td>得分系统</td><td>吃食物加分，显示分数</td><td>变量累加、控制台输出</td></tr>
</table>

<h4>游戏主循环结构</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 贪食蛇游戏主循环（伪代码框架）</span>
<span class="kw">static void</span> <span class="fn">Main</span>(<span class="type">string</span>[] args)
{
    <span class="cm">// 1. 初始化</span>
    Console.CursorVisible = <span class="kw">false</span>;        <span class="cm">// 隐藏光标</span>
    Console.SetWindowSize(<span class="num">60</span>, <span class="num">30</span>);      <span class="cm">// 设置窗口</span>

    <span class="cm">// 2. 绘制固定墙壁</span>
    DrawWall();

    <span class="cm">// 3. 初始化蛇（用 List 存储坐标）</span>
    List<(<span class="kw">int</span> x, <span class="kw">int</span> y)> snake = <span class="kw">new</span> List<(<span class="kw">int</span>, <span class="kw">int</span>)>();
    snake.Add((<span class="num">20</span>, <span class="num">15</span>));  <span class="cm">// 蛇头初始位置</span>

    Random rand = <span class="kw">new</span> Random();
    <span class="kw">int</span> foodX = rand.Next(<span class="num">2</span>, <span class="num">58</span>);
    <span class="kw">int</span> foodY = rand.Next(<span class="num">2</span>, <span class="num">28</span>);

    <span class="kw">int</span> dirX = <span class="num">1</span>, dirY = <span class="num">0</span>;  <span class="cm">// 初始向右移动</span>
    <span class="kw">int</span> score = <span class="num">0</span>;

    <span class="cm">// 4. 游戏主循环</span>
    <span class="kw">while</span> (<span class="kw">true</span>)
    {
        <span class="cm">// 4a. 处理输入</span>
        <span class="kw">if</span> (Console.KeyAvailable)
        {
            <span class="kw">var</span> key = Console.ReadKey(<span class="kw">true</span>).Key;
            <span class="kw">switch</span> (key)
            {
                <span class="kw">case</span> ConsoleKey.W: <span class="kw">case</span> ConsoleKey.UpArrow:
                    dirX = <span class="num">0</span>; dirY = -<span class="num">1</span>; <span class="kw">break</span>;
                <span class="kw">case</span> ConsoleKey.S: <span class="kw">case</span> ConsoleKey.DownArrow:
                    dirX = <span class="num">0</span>; dirY = <span class="num">1</span>; <span class="kw">break</span>;
                <span class="kw">case</span> ConsoleKey.A: <span class="kw">case</span> ConsoleKey.LeftArrow:
                    dirX = -<span class="num">1</span>; dirY = <span class="num">0</span>; <span class="kw">break</span>;
                <span class="kw">case</span> ConsoleKey.D: <span class="kw">case</span> ConsoleKey.RightArrow:
                    dirX = <span class="num">1</span>; dirY = <span class="num">0</span>; <span class="kw">break</span>;
            }
        }

        <span class="cm">// 4b. 计算新蛇头位置</span>
        <span class="kw">var</span> head = snake[<span class="num">0</span>];
        <span class="kw">int</span> newX = head.x + dirX;
        <span class="kw">int</span> newY = head.y + dirY;

        <span class="cm">// 4c. 碰撞检测（撞墙/撞自己）</span>
        <span class="kw">if</span> (newX <= <span class="num">0</span> || newX >= <span class="num">59</span> || newY <= <span class="num">0</span> || newY >= <span class="num">29</span>)
            <span class="kw">break</span>;  <span class="cm">// 撞墙，游戏结束</span>

        <span class="cm">// 4d. 吃食物检测</span>
        <span class="kw">bool</span> ate = (newX == foodX && newY == foodY);

        <span class="cm">// 4e. 移动蛇</span>
        snake.Insert(<span class="num">0</span>, (newX, newY));  <span class="cm">// 头部前进</span>
        <span class="kw">if</span> (!ate)
            snake.RemoveAt(snake.Count - <span class="num">1</span>);  <span class="cm">// 去掉尾部（没吃到食物）</span>
        <span class="kw">else</span>
        {
            score += <span class="num">10</span>;  <span class="cm">// 加分</span>
            foodX = rand.Next(<span class="num">2</span>, <span class="num">58</span>);  <span class="cm">// 新食物</span>
            foodY = rand.Next(<span class="num">2</span>, <span class="num">28</span>);
        }

        <span class="cm">// 4f. 绘制当前帧</span>
        Draw(snake, foodX, foodY, score);

        <span class="cm">// 4g. 控制速度</span>
        System.Threading.Thread.Sleep(<span class="num">100</span>);  <span class="cm">// 100ms一帧</span>
    }

    <span class="cm">// 5. 游戏结束</span>
    Console.SetCursorPosition(<span class="num">20</span>, <span class="num">15</span>);
    Console.WriteLine(<span class="str">"游戏结束！得分："</span> + score);
}</pre></div>

<h4>关键技术点详解</h4>

<h4>1. 蛇身数据结构的选型</h4>
<table><tr><th>方案</th><th>优点</th><th>缺点</th></tr>
<tr><td><code>List&lt;(int, int)&gt;</code> 元组列表</td><td>简单直观，插入/删除方便</td><td>值类型元组，每次修改需整体替换</td></tr>
<tr><td><code>LinkedList&lt;&gt;</code></td><td>头部插入O(1)</td><td>代码稍复杂，遍历不如List方便</td></tr>
<tr><td><code>int[,]</code> 二维数组</td><td>可直接标记地图</td><td>每次移动需遍历整个数组清空旧位置</td></tr>
</table>

<p>推荐初学者使用 <strong>List 元组方案</strong>，代码最直观。</p>

<h4>2. Console.KeyAvailable 非阻塞输入</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">if</span> (Console.KeyAvailable)   <span class="cm">// 有按键才读取，不阻塞游戏循环</span>
{
    <span class="kw">var</span> key = Console.ReadKey(<span class="kw">true</span>).Key;  <span class="cm">// true=不显示按键字符</span>
    <span class="cm">// 处理方向键...</span>
}</pre></div>
<p>如果不加 <code>KeyAvailable</code> 判断，<code>ReadKey</code> 会阻塞游戏循环，导致蛇停下来等输入。</p>

<h4>3. 防止方向反转</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 防止蛇直接掉头（例如向右时不能立刻向左）</span>
<span class="kw">if</span> (key == ConsoleKey.A && dirX != <span class="num">1</span>)   dirX = -<span class="num">1</span>; dirY = <span class="num">0</span>;
<span class="kw">if</span> (key == ConsoleKey.D && dirX != -<span class="num">1</span>)  dirX = <span class="num">1</span>; dirY = <span class="num">0</span>;
<span class="kw">if</span> (key == ConsoleKey.W && dirY != <span class="num">1</span>)   dirX = <span class="num">0</span>; dirY = -<span class="num">1</span>;
<span class="kw">if</span> (key == ConsoleKey.S && dirY != -<span class="num">1</span>)  dirX = <span class="num">0</span>; dirY = <span class="num">1</span>;</pre></div>

<h4>4. Thread.Sleep 控制帧率</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre>System.Threading.Thread.Sleep(<span class="num">100</span>);  <span class="cm">// 暂停100毫秒 → 每秒约10帧</span></pre></div>
<p>不加延时会刷新太快看不清，延时太大则蛇移动太慢。</p>

      const lessonDiv = document.createElement('div');
      lessonDiv.className = 'lesson'; lessonDiv.id = flatId;
      lessonDiv.innerHTML = '<div class="lesson-header" onclick="toggleLesson(this.parentElement)"><span class="lesson-number">' + (li + 1) + '</span><div class="lesson-info"><h3>' + l.title + '</h3><div class="tags">' + l.tags.map(t => '<span class="tag">' + t + '</span>').join('') + '</div></div><span class="lesson-toggle">▼</span></div><div class="lesson-body">' + l.content + '</div>';
      moduleDiv.appendChild(lessonDiv);
    });
    content.appendChild(moduleDiv);
  });

  const first = document.querySelector('.lesson');
  if (first) first.classList.add('expanded');
  } catch(e) {
    document.getElementById('content').innerHTML = '<div style="padding:2rem;color:red;font-family:monospace;"><h3>JS Error:</h3><pre>'+e.message+'</pre><pre>Line: '+e.lineNumber+'</pre><pre>Stack: '+e.stack+'</pre></div>';
  }
}

function toggleLesson(el) { el.classList.toggle('expanded'); }
function expandAll() { document.querySelectorAll('.lesson').forEach(l => l.classList.add('expanded')); }
function collapseAll() { document.querySelectorAll('.lesson').forEach(l => l.classList.remove('expanded')); }

function jumpTo(id) {
  closeSidebar();
  const el = document.getElementById(id);
  if (el) { el.scrollIntoView({ behavior: 'smooth' }); el.classList.add('expanded'); }
  document.querySelectorAll('.nav-lessons a').forEach(a => a.classList.remove('active'));
  const link = document.querySelector('a[href="#' + id + '"]');
  if (link) link.classList.add('active');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? null : 'dark';
  html.setAttribute('data-theme', next || '');
  localStorage.setItem('cs-notes-theme', next || 'light');
}
function loadTheme() {
  const saved = localStorage.getItem('cs-notes-theme');
  if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const results = document.getElementById('searchResults');
  if (!q) { results.classList.remove('show'); return; }
  const matches = allLessonsFlat.filter(l =>
    l.title.toLowerCase().includes(q) || l.tags.some(t => t.toLowerCase().includes(q)) || l.content.toLowerCase().includes(q)
  ).slice(0, 15);
  if (matches.length === 0) {
    results.innerHTML = '<div class="no-results">未找到匹配的知识点</div>';
  } else {
    results.innerHTML = matches.map(m => '<a href="#' + m.flatId + '" onclick="jumpTo(\'' + m.flatId + '\');clearSearch();"><span class="sr-module">' + (m.moduleBadge ? '[' + m.moduleBadge + '] ' : '') + m.moduleTitle + '</span> › ' + m.title + '</a>').join('');
  }
  results.classList.add('show');
}
function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').classList.remove('show');
}

document.addEventListener('click', (e) => { if (!e.target.closest('.search-wrap')) document.getElementById('searchResults').classList.remove('show'); });

function copyCode(btn) {
  const pre = btn.closest('.code-block').querySelector('pre');
  navigator.clipboard.writeText(pre.textContent).then(() => {
    btn.textContent = '已复制 ✓'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
  });
}

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('searchInput').focus(); }
  if (e.key === 'Escape') { clearSearch(); closeSidebar(); }
});

document.write('<div style="position:fixed;top:0;right:200px;background:lime;color:#000;z-index:99999;padding:4px 10px;font:12px monospace;">SCRIPT END - modules='+(typeof modules)+' len='+(typeof modules!=='undefined'?modules.length:'N/A')+'</div>');
loadTheme();
buildSite();
</script>
</body>
</html>
