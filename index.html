<style>
:root {
  --bg:#fff; --bg2:#f5f7fa; --text:#1a1a2e; --text2:#555; --border:#e2e8f0;
  --accent:#68217a; --accent2:#9b4dca; --code-bg:#1e1e2e; --code-text:#cdd6f4;

  --card-bg:#fff; --card-shadow:0 2px 12px rgba(0,0,0,.08);
  --tag-bg:#f0e6f6; --tag-text:#68217a; --badge-bg:#68217a; --badge-text:#fff;
  --highlight:#fff3cd; --success:#10b981; --warn:#f59e0b; --scrollbar:#c1c1c1;
}
[data-theme="dark"] {
  --bg:#0d1117; --bg2:#161b22; --text:#e6edf3; --text2:#8b949e; --border:#30363d;
  --accent:#9b4dca; --accent2:#b388ff; --code-bg:#0d1117; --code-text:#e6edf3;
  --sidebar-bg:#0d1117; --sidebar-text:#e6edf3; --sidebar-hover:#1c2333;
  --card-bg:#161b22; --card-shadow:0 2px 12px rgba(0,0,0,.3);
  --tag-bg:#1c1a2e; --tag-text:#b388ff; --badge-bg:#9b4dca; --highlight:#2d2410;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;display:flex;min-height:100vh;transition:background .3s,color .3s}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}

.sidebar{width:280px;min-width:280px;height:100vh;position:fixed;top:0;left:0;background:var(--sidebar-bg);color:var(--sidebar-text);overflow-y:auto;z-index:100;transition:transform .3s,background .3s;display:flex;flex-direction:column}
.sidebar-header{padding:1.5rem 1.25rem;border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:0;background:var(--sidebar-bg);z-index:2}
.sidebar-header h1{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:.5rem}
.sidebar-header h1 .icon{font-size:1.4rem}
.sidebar-header p{font-size:.78rem;opacity:.6;margin-top:.25rem}
.sidebar-nav{flex:1;padding:.75rem 0}
.nav-section{margin-bottom:.25rem}
.nav-section-title{padding:.5rem 1.25rem;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;opacity:.45;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.nav-section-title:hover{opacity:.7}
.nav-section-title .arr{transition:transform .2s;font-size:.6rem}
.nav-section.collapsed .nav-lessons{display:none}
.nav-section.collapsed .arr{transform:rotate(-90deg)}
.nav-lessons{list-style:none}
.nav-lessons li a{display:block;padding:.35rem 1.25rem .35rem 1.75rem;font-size:.82rem;color:var(--sidebar-text);text-decoration:none;opacity:.7;transition:all .15s;border-left:2px solid transparent}
.nav-lessons li a:hover{opacity:1;background:var(--sidebar-hover);border-left-color:var(--accent2)}
.nav-lessons li a.active{opacity:1;background:var(--sidebar-hover);border-left-color:var(--accent2);color:var(--accent2)}
.sidebar-footer{padding:.75rem 1.25rem;border-top:1px solid rgba(255,255,255,.1);font-size:.72rem;opacity:.4}

.main{margin-left:280px;flex:1;min-width:0}
.topbar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:.6rem 1.5rem;display:flex;align-items:center;gap:1rem;z-index:50;transition:background .3s;flex-wrap:wrap}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap input{width:100%;padding:.5rem .75rem .5rem 2.25rem;border:1px solid var(--border);border-radius:8px;font-size:.88rem;background:var(--bg2);color:var(--text);transition:all .2s;outline:none}
.search-wrap input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(155,77,202,.15)}
.search-wrap .search-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);opacity:.4;font-size:.9rem}
.topbar-actions{display:flex;gap:.5rem;align-items:center}
.topbar-actions button{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:.45rem .75rem;border-radius:6px;cursor:pointer;font-size:.82rem;transition:all .15s;white-space:nowrap}
.topbar-actions button:hover{background:var(--border)}
.topbar-actions .btn-icon{font-size:1.1rem;padding:.4rem .5rem;line-height:1}
.menu-toggle{display:none}
.search-results{position:absolute;top:100%;left:0;right:0;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;box-shadow:var(--card-shadow);max-height:320px;overflow-y:auto;z-index:60;display:none;margin-top:4px}
.search-results.show{display:block}
.search-results a{display:block;padding:.5rem .75rem;color:var(--text);text-decoration:none;font-size:.85rem;border-bottom:1px solid var(--border)}
.search-results a:last-child{border-bottom:none}
.search-results a:hover{background:var(--bg2)}

.search-results .no-results{padding:.75rem;text-align:center;color:var(--text2);font-size:.85rem}

.content{padding:1.5rem 2rem 4rem;max-width:960px}

.module-desc{color:var(--text2);font-size:.95rem}

.lesson{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;margin-bottom:1.25rem;overflow:hidden;box-shadow:var(--card-shadow);transition:transform .15s,box-shadow .15s;scroll-margin-top:80px}
.lesson:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.12)}
.lesson-header{padding:1rem 1.25rem;display:flex;align-items:center;gap:.75rem;cursor:pointer;user-select:none;border-bottom:1px solid transparent}
.lesson-header:hover{background:var(--bg2)}
.lesson.expanded .lesson-header{border-bottom-color:var(--border)}
.lesson-number{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.lesson-info{flex:1}
.lesson-info h3{font-size:1.02rem;font-weight:700}
.lesson-info .tags{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.2rem}
.tag{display:inline-block;background:var(--tag-bg);color:var(--tag-text);padding:.1rem .5rem;border-radius:4px;font-size:.7rem;font-weight:600}
.lesson-toggle{font-size:.8rem;opacity:.4;transition:transform .3s}
.lesson.expanded .lesson-toggle{transform:rotate(180deg)}
.lesson-body{display:none;padding:1.25rem}
.lesson.expanded .lesson-body{display:block}

.lesson-body h4{font-size:.95rem;font-weight:700;color:var(--accent);margin:1rem 0 .5rem}
.lesson-body h4:first-child{margin-top:0}
.lesson-body p{margin-bottom:.6rem;font-size:.9rem}
.lesson-body ul,.lesson-body ol{margin:.5rem 0 .5rem 1.5rem;font-size:.9rem}
.lesson-body li{margin-bottom:.2rem}
.lesson-body table{width:100%;border-collapse:collapse;margin:.75rem 0;font-size:.85rem}
.lesson-body table th,.lesson-body table td{border:1px solid var(--border);padding:.4rem .6rem;text-align:left}
.lesson-body table th{background:var(--bg2);font-weight:700}
.lesson-body table tr:nth-child(even){background:var(--bg2)}
.highlight-box{background:var(--highlight);border-left:4px solid var(--warn);padding:.6rem 1rem;margin:.75rem 0;border-radius:0 6px 6px 0;font-size:.88rem}

.code-block{background:var(--code-bg);color:var(--code-text);border-radius:8px;margin:.75rem 0;overflow:hidden;position:relative}
.code-header{display:flex;justify-content:space-between;align-items:center;padding:.4rem .75rem;background:rgba(255,255,255,.05);font-size:.75rem}
.code-lang{opacity:.5;text-transform:uppercase;letter-spacing:1px}
.code-copy{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);padding:.15rem .5rem;border-radius:4px;cursor:pointer;font-size:.7rem;transition:all .15s}
.code-copy:hover{background:rgba(255,255,255,.1)}
.code-copy.copied{border-color:var(--success);color:var(--success)}
.code-block pre{padding:.75rem 1rem;margin:0;overflow-x:auto;font-size:.82rem;font-family:"Cascadia Code","Fira Code","JetBrains Mono",Consolas,monospace;line-height:1.55}
.kw{color:#c792ea}.str{color:#c3e88d}.cm{color:#676e95;font-style:italic}.num{color:#f78c6c}.fn{color:#82aaff}.type{color:#ffcb6b}.op{color:#89ddff}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.overlay.show{display:block}

@media(max-width:1024px){.content{padding:1rem 1.25rem 3rem}}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:inline-flex}
  .main{margin-left:0}
  .topbar{padding:.5rem .75rem}
  .module-title{font-size:1.4rem}
  .content{padding:.75rem 1rem 2rem}
  .lesson-header{padding:.75rem 1rem}
  .lesson-body{padding:.75rem 1rem}
  .code-block pre{font-size:.75rem;padding:.5rem .75rem}
}
@media(max-width:480px){
  .topbar-actions .btn-label{display:none}
  .topbar-actions button{padding:.4rem .5rem}
  .topbar{gap:.5rem}
}
@media print{
  .sidebar,.topbar{display:none}
  .main{margin-left:0}
  .lesson{break-inside:avoid;box-shadow:none;border:1px solid #ddd}
  .lesson-body{display:block!important}
}
</style>

<script>
document.write('<div style="position:fixed;top:0;right:0;background:lime;color:#000;z-index:99999;padding:4px 10px;font:12px monospace;">SCRIPT START</div>');
/*====== MODULES DATA ======*/
const modules = [
{id:'intro', title:'一、C# 入门教程', desc:'从零开始，掌握 C# 的基本语法和控制结构', badge:'入门', lessons:[
  {id:'intro-1', title:'第一个应用程序', tags:['输出','输入','注释'], content:`
<h4>三种注释方式</h4>
<table><tr><th>类型</th><th>语法</th><th>用途</th></tr>
<tr><td>单行注释</td><td><code>// 注释内容</code></td><td>单行说明，最常用</td></tr>
<tr><td>多行注释</td><td><code>/* 注释内容 */</code></td><td>多行说明，也可屏蔽代码</td></tr>
<tr><td>文档注释</td><td><code>/// &lt;summary&gt;</code></td><td>生成API说明文档</td></tr></table>

<h4>程序基本结构</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">using</span> <span class="type">System</span>;                     <span class="cm">// 引用命名空间</span>

<span class="kw">namespace</span> <span class="type">MyApp</span>                   <span class="cm">// 命名空间</span>
{
    <span class="kw">class</span> <span class="type">Program</span>                    <span class="cm">// 类</span>
    {
        <span class="kw">static void</span> <span class="fn">Main</span>(<span class="type">string</span>[] args) <span class="cm">// 主函数入口</span>
        {
            <span class="cm">// 所有基础代码写在这里</span>
        }
    }
}</pre></div>

<h4>控制台输出</h4>
<table><tr><th>方法</th><th>说明</th></tr>
<tr><td><code>Console.WriteLine()</code></td><td>打印一行，结束后自动换行</td></tr>
<tr><td><code>Console.Write()</code></td><td>打印内容，结束后不换行</td></tr></table>

<h4>控制台输入</h4>
<table><tr><th>方法</th><th>说明</th></tr>
<tr><td><code>Console.ReadLine()</code></td><td>等待用户输入（按回车结束），返回 string</td></tr>
<tr><td><code>Console.ReadKey()</code></td><td>检测按键，按下任意键即结束并返回按键信息</td></tr></table>

<div class="highlight-box">💡 <strong>关键理解：</strong>输入 = 向控制台输入内容；输出 = 在控制台打印信息。输入/输出是程序和用户交互的基础桥梁。</div>`},

  {id:'intro-2', title:'变量', tags:['变量类型','声明','初始化'], content:`
<h4>变量声明固定写法</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 变量类型 变量名 = 初始值;</span>
<span class="kw">int</span> i = <span class="num">1</span>;
<span class="kw">float</span> f = <span class="num">1.5f</span>;
<span class="kw">string</span> str = <span class="str">"Hello"</span>;
<span class="kw">bool</span> b = <span class="kw">true</span>;</pre></div>

<h4>14种变量类型速查表</h4>
<table><tr><th>分类</th><th>关键字</th><th>存储范围</th><th>字节</th></tr>
<tr><td>有符号整形</td><td><code>sbyte</code></td><td>-128 ~ 127</td><td>1</td></tr>
<tr><td>有符号整形</td><td><code>short</code></td><td>-32,768 ~ 32,767</td><td>2</td></tr>
<tr><td>有符号整形</td><td><code>int</code></td><td>-21亿 ~ 21亿</td><td>4</td></tr>
<tr><td>有符号整形</td><td><code>long</code></td><td>-9百万兆 ~ 9百万兆</td><td>8</td></tr>
<tr><td>无符号整形</td><td><code>byte</code></td><td>0 ~ 255</td><td>1</td></tr>
<tr><td>无符号整形</td><td><code>ushort</code></td><td>0 ~ 65,535</td><td>2</td></tr>
<tr><td>无符号整形</td><td><code>uint</code></td><td>0 ~ 42亿</td><td>4</td></tr>
<tr><td>无符号整形</td><td><code>ulong</code></td><td>0 ~ 18百万兆</td><td>8</td></tr>
<tr><td>浮点数</td><td><code>float</code></td><td>7~8位有效数字</td><td>4</td></tr>
<tr><td>浮点数</td><td><code>double</code></td><td>15~17位有效数字</td><td>8</td></tr>
<tr><td>浮点数</td><td><code>decimal</code></td><td>27~28位有效数字</td><td>16</td></tr>
<tr><td>特殊</td><td><code>bool</code></td><td>true / false</td><td>1</td></tr>
<tr><td>特殊</td><td><code>char</code></td><td>单个字符</td><td>2</td></tr>
<tr><td>特殊</td><td><code>string</code></td><td>一串字符（无上限）</td><td>不定</td></tr></table>

<h4>使用建议</h4>
<div class="highlight-box">💡 <strong>日常开发口诀：</strong>整数用 <code>int</code>，小数用 <code>float</code>，字符串用 <code>string</code>，真假用 <code>bool</code>。根据数据大小选择合适类型可节省内存。</div>

<h4>多个同类型变量同时声明</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span> a = <span class="num">1</span>, b = <span class="num">2</span>, c = <span class="num">3</span>;
<span class="kw">string</span> s1 = <span class="str">"Hello"</span>, s2 = <span class="str">"World"</span>;</pre></div>

<h4>折叠代码</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="pp">#region</span> 区域名称
<span class="cm">// 可折叠的代码块</span>
<span class="pp">#endregion</span></pre></div>

<h4>变量初始化</h4>
<p>变量在使用前<strong>必须先初始化</strong>（赋值），否则编译器会报错。这是 C# 的类型安全机制。</p>`},

  {id:'intro-3', title:'变量本质', tags:['内存','sizeof','二进制'], content:`
<h4>存储单位换算</h4>
<table><tr><th>单位</th><th>换算</th></tr>
<tr><td>1 Byte</td><td>= 8 bit</td></tr>
<tr><td>1 KB</td><td>= 1024 Byte</td></tr>
<tr><td>1 MB</td><td>= 1024 KB</td></tr>
<tr><td>1 GB</td><td>= 1024 MB</td></tr>
<tr><td>1 TB</td><td>= 1024 GB</td></tr></table>

<h4>使用 sizeof 获取类型大小</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span> intSize = <span class="kw">sizeof</span>(<span class="kw">int</span>);      <span class="cm">// 4 字节</span>
<span class="kw">int</span> longSize = <span class="kw">sizeof</span>(<span class="kw">long</span>);    <span class="cm">// 8 字节</span>
<span class="kw">int</span> charSize = <span class="kw">sizeof</span>(<span class="kw">char</span>);   <span class="cm">// 2 字节</span>
<span class="cm">// sizeof(string) 不可用——字符串长度可变</span></pre></div>

<h4>变量的本质——二进制</h4>
<p>计算机中所有数据本质都是二进制（0和1），因为数据传递只能通过电信号（开/关两种状态）。</p>
<ul>
  <li><strong>bit（位）：</strong>最小存储单位，只能表示 0 或 1</li>
  <li><strong>byte（字节）：</strong>由 8 个 bit 组成，如 0000 0000</li>
  <li>变量的存储空间越大，能表示的数据范围越大</li>
  <li>二进制逢二进一：0、1、10、11、100、101、110、111...</li>
</ul>

<div class="highlight-box">💡 <strong>核心领悟：</strong>不同的变量类型占用的内存空间不同，选择合适类型是为了更高效地利用内存。理解二进制是编程的底层基础。</div>`},

  {id:'intro-4', title:'变量的命名规则', tags:['命名规范','驼峰','帕斯卡'], content:`
<h4>必须遵守的规则</h4>
<ol>
  <li><strong>不能重名</strong>——同一作用域内变量名必须唯一</li>
  <li><strong>不能以数字开头</strong>——如 <code>1name</code> 非法，<code>name1</code> 合法</li>
  <li><strong>不能使用程序关键字</strong>——如 <code>int</code>、<code>class</code>、<code>static</code> 不可作变量名</li>
  <li><strong>不能有特殊符号</strong>——下划线 <code>_</code> 除外</li>
</ol>

<h4>常用命名规则</h4>
<table><tr><th>命名法</th><th>规则</th><th>适用</th><th>示例</th></tr>
<tr><td>驼峰命名法 (camelCase)</td><td>首字母小写，之后单词首字母大写</td><td>局部变量、字段</td><td><code>myName</code>, <code>playerHealth</code></td></tr>
<tr><td>帕斯卡命名法 (PascalCase)</td><td>所有单词首字母都大写</td><td>函数、类、属性</td><td><code>MyMethod</code>, <code>PlayerController</code></td></tr></table>

<h4>命名建议</h4>
<ul>
  <li>变量名要有<strong>实际含义</strong>——见名知意</li>
  <li>建议用英文命名，不建议用汉字</li>
  <li>避免无意义缩写（如 <code>a</code>, <code>b</code>, <code>x1</code>）</li>
</ul>

<div class="highlight-box">⚠️ <strong>重要：</strong>C# 对大小写敏感，<code>myName</code> 和 <code>MyName</code> 是两个不同的变量。养成规范命名的好习惯，团队协作时尤为重要。</div>`},

  {id:'intro-5', title:'常量', tags:['const','不可修改'], content:`
<h4>常量声明</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// const 变量类型 变量名 = 初始值;</span>
<span class="kw">const</span> <span class="kw">int</span> MAX_HP = <span class="num">100</span>;
<span class="kw">const</span> <span class="kw">float</span> PI = <span class="num">3.1415926f</span>;
<span class="kw">const</span> <span class="kw">string</span> GAME_TITLE = <span class="str">"My Game"</span>;
<span class="kw">const</span> <span class="kw">bool</span> IS_DEBUG = <span class="kw">true</span>;</pre></div>

<h4>常量特点</h4>
<ol>
  <li><strong>必须初始化</strong>——声明时必须赋值</li>
  <li><strong>不能被修改</strong>——赋值后不可改变，尝试修改会编译报错</li>
  <li><strong>编译时常量</strong>——值在编译时就确定，运行时不可变</li>
  <li><strong>命名惯例</strong>——常量通常用全大写 + 下划线命名</li>
</ol>

<h4>变量 vs 常量对比</h4>
<table><tr><th>特性</th><th>变量</th><th>常量</th></tr>
<tr><td>关键字</td><td>无</td><td><code>const</code></td></tr>
<tr><td>初始化</td><td>可延迟</td><td>必须立即</td></tr>
<tr><td>修改</td><td>可多次修改</td><td>不可修改</td></tr>
<tr><td>用途</td><td>可变数据</td><td>固定值</td></tr>
<tr><td>命名风格</td><td>camelCase</td><td>UPPER_CASE</td></tr></table>

<div class="highlight-box">💡 <strong>最佳实践：</strong>固定不变的数值（如数学常量、配置上限）务必用 <code>const</code> 声明，既防止误改又提高可读性。</div>`}

  {id:'intro-6', title:'转义字符', tags:['转义','\\n','@'], content:`
<h4>转义字符速查表</h4>
<table><tr><th>转义序列</th><th>含义</th><th>常用度</th></tr>
<tr><td><code>\\'</code></td><td>单引号</td><td>⭐⭐</td></tr>
<tr><td><code>\\"</code></td><td>双引号</td><td>⭐⭐⭐</td></tr>
<tr><td><code>\\n</code></td><td>换行</td><td>⭐⭐⭐</td></tr>
<tr><td><code>\\\\</code></td><td>反斜杠本身</td><td>⭐⭐⭐</td></tr>
<tr><td><code>\\t</code></td><td>制表符 (Tab)</td><td>⭐⭐</td></tr>
<tr><td><code>\\b</code></td><td>光标退格</td><td>⭐</td></tr>
<tr><td><code>\\0</code></td><td>空字符</td><td>⭐</td></tr>
<tr><td><code>\\a</code></td><td>警报音</td><td>⭐</td></tr></table>

<h4>什么是转义字符</h4>
<p>字符串中的 <code>\\</code> 不是普通字符，而是用来改变其后字符的含义。例如 <code>\\n</code> 不代表"反斜杠+n"，而代表"换行符"。</p>

<h4>取消转义——@符号</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">string</span> path = <span class="str">@"C:\Users\Name\Documents"</span>;  <span class="cm">// 不需要写 \\\\</span>
<span class="kw">string</span> raw = <span class="str">@"\n\t不会被转义成换行和Tab"</span>;
<span class="kw">string</span> quote = <span class="str">@"在@字符串中""可以这样写双引号"</span>;</pre></div>

<h4>转义字符使用示例</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">string</span> s1 = <span class="str">"第一行\n第二行"</span>;       <span class="cm">// 两行文字</span>
<span class="kw">string</span> s2 = <span class="str">"列1\t列2\t列3"</span>;         <span class="cm">// Tab对齐</span>
<span class="kw">string</span> s3 = <span class="str">"He said \"Hello\""</span>;      <span class="cm">// 包含双引号</span>
<span class="kw">string</span> s4 = <span class="str">"C:\\\\temp\\\\file.txt"</span>;    <span class="cm">// 显示为 C:\temp\file.txt</span></pre></div>

<div class="highlight-box">💡 <strong>使用场景：</strong>文件路径中频繁用到反斜杠，使用 <code>@</code> 前缀可以让路径更直观可读。正则表达式中也极其有用。</div>`},

  {id:'intro-7', title:'类型转换——隐式转换', tags:['隐式转换','自动转换','类型兼容'], content:`
<h4>隐式转换核心规则</h4>
<p><strong>大范围装小范围</strong> —— 高精度变量可以自动接收低精度变量的值。</p>

<h4>转换关系图（从上到下可隐式转换）</h4>
<div class="highlight-box">
  <code>decimal</code> &#8592; <code>double</code> &#8592; <code>float</code> &#8592; <strong>所有整数类型</strong> (有符号/无符号) &#8592; <code>char</code><br>
  <code>string</code> 和 <code>bool</code> 不参与隐式转换
</div>

<h4>相同大类间的转换规则</h4>
<table><tr><th>类别</th><th>方向</th></tr>
<tr><td>有符号</td><td>long &#8592; int &#8592; short &#8592; sbyte</td></tr>
<tr><td>无符号</td><td>ulong &#8592; uint &#8592; ushort &#8592; byte</td></tr>
<tr><td>浮点数</td><td>decimal 不能隐式存 double/float；double &#8592; float</td></tr></table>

<h4>不同大类间的关键规则</h4>
<ul>
  <li><strong>有符号 &#8596; 无符号：</strong>有符号可以装无符号（前提范围涵盖），无符号不能装有符号</li>
  <li><strong>浮点数 &#8592; 整数：</strong>浮点数可以装载任何类型的整数（存在隐式转换）</li>
  <li><strong>整数 &#8592; 浮点数：</strong>不可以（整数不能存小数）</li>
  <li><strong>char &#8594; 数值：</strong>char 可以隐式转换为整形和浮点型（变成 ASCII 码）</li>
</ul>

<h4>隐式转换示例</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span> i = <span class="num">100</span>;
<span class="kw">long</span> l = i;           <span class="cm">// 合法：int &#8594; long（小转大）</span>
<span class="kw">float</span> f = i;          <span class="cm">// 合法：int &#8594; float</span>
<span class="kw">double</span> d = f;         <span class="cm">// 合法：float &#8594; double</span>
<span class="kw">byte</span> b = <span class="num">10</span>;
<span class="kw">int</span> i2 = b;          <span class="cm">// 合法：byte &#8594; int</span>

<span class="cm">// 以下会报错：</span>
<span class="cm">// int x = 1.5f;      // float 不能隐式转 int</span>
<span class="cm">// short s = 50000;   // 50000 超出 short 范围</span></pre></div>`},

  {id:'intro-8', title:'类型转换——显示转换', tags:['强制转换','Parse','Convert'], content:`
<h4>三种显示转换方式对比</h4>
<table><tr><th>方式</th><th>语法</th><th>适用场景</th><th>注意</th></tr>
<tr><td><strong>括号强转</strong></td><td><code>(目标类型)变量</code></td><td>高精度&#8594;低精度</td><td>范围溢出、精度丢失</td></tr>
<tr><td><strong>Parse法</strong></td><td><code>类型.Parse("字符串")</code></td><td>字符串&#8594;对应类型</td><td>字符串必须合法</td></tr>
<tr><td><strong>Convert法</strong></td><td><code>Convert.To目标类型()</code></td><td>各类型间互转</td><td>会四舍五入</td></tr></table>

<h4>括号强转示例</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span> i = <span class="num">40000</span>;
<span class="kw">short</span> s = (<span class="kw">short</span>)i;          <span class="cm">// 范围溢出！结果异常</span>
<span class="kw">float</span> f = <span class="num">1.64f</span>;
<span class="kw">int</span> i2 = (<span class="kw">int</span>)f;            <span class="cm">// 直接抛弃小数 &#8594; 1</span>
<span class="kw">char</span> c = (<span class="kw">char</span>)<span class="num">65</span>;            <span class="cm">// 数字&#8594;字符 &#8594; 'A'</span>
<span class="kw">int</span> code = (<span class="kw">int</span>)<span class="str">'A'</span>;          <span class="cm">// 字符&#8594;数字 &#8594; 65</span></pre></div>

<h4>Parse法示例</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span> i = <span class="kw">int</span>.Parse(<span class="str">"123"</span>);
<span class="kw">float</span> f = <span class="kw">float</span>.Parse(<span class="str">"3.14"</span>);
<span class="kw">bool</span> b = <span class="kw">bool</span>.Parse(<span class="str">"true"</span>);
<span class="cm">// 如果字符串不合法，会抛出异常！建议配合 try-catch 使用</span></pre></div>

<h4>Convert法示例（精度更好）</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span> a = Convert.ToInt32(<span class="num">1.458f</span>);  <span class="cm">// 四舍五入 &#8594; 1</span>
a = Convert.ToInt32(<span class="num">1.6f</span>);        <span class="cm">// 四舍五入 &#8594; 2</span>
a = Convert.ToInt32(<span class="kw">true</span>);         <span class="cm">// true&#8594;1, false&#8594;0</span>
a = Convert.ToInt32(<span class="str">'A'</span>);          <span class="cm">// &#8594; 65</span>
<span class="kw">string</span> s = Convert.ToString(<span class="num">123</span>);   <span class="cm">// 任意类型&#8594;字符串</span></pre></div>

<h4>其他类型转 string — .ToString()</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">string</span> s = <span class="num">1</span>.ToString();           <span class="cm">// "1"</span>
s = <span class="kw">true</span>.ToString();              <span class="cm">// "True"</span>
s = <span class="str">'A'</span>.ToString();               <span class="cm">// "A"</span>
<span class="cm">// 字符串拼接时会自动调用 ToString()</span>
<span class="kw">string</span> result = <span class="str">"值："</span> + <span class="num">1</span> + <span class="kw">true</span>;  <span class="cm">// "值：1True"</span></pre></div>

<div class="highlight-box">⚠️ <strong>关键区别：</strong>括号强转直接截断，Convert 会四舍五入。处理用户输入时优先用 <code>TryParse</code>（不会抛异常）。</div>`},

  {id:'intro-9', title:'异常捕获', tags:['try-catch','异常处理','健壮性'], content:`
<h4>基本语法</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">try</span>
{
    <span class="cm">// 希望进行异常捕获的代码块</span>
    <span class="cm">// 如果这里报错，不会导致程序崩溃</span>
}
<span class="kw">catch</span> (Exception e)
{
    <span class="cm">// 出错时执行，e 包含具体错误信息</span>
    Console.WriteLine(<span class="str">$"错误：{e.Message}"</span>);
}
<span class="kw">finally</span>
{
    <span class="cm">// 可选：无论是否出错都会执行</span>
    <span class="cm">// 常用于释放资源、关闭文件等</span>
}</pre></div>

<h4>实践示例——安全转换用户输入</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">try</span>
{
    <span class="kw">string</span> str = Console.ReadLine();
    <span class="kw">int</span> i = <span class="kw">int</span>.Parse(str);
    Console.WriteLine(<span class="str">$"你输入的数字是：{i}"</span>);
}
<span class="kw">catch</span>
{
    Console.WriteLine(<span class="str">"请输入合法数字！"</span>);
}</pre></div>

<h4>如何处理异常</h4>
<ul>
  <li><strong>不能逃避异常</strong>——如果不在 Main 里处理，异常会在调用处继续往上抛</li>
  <li>将异常的代码包裹在 try 块中</li>
  <li>catch 块中进行补救或通知</li>
  <li>finally 块用于清理工作（可选）</li>
</ul>

<div class="highlight-box">💡 <strong>核心价值：</strong>异常捕获让程序在遇到错误时不至于崩溃闪退。这是写出健壮（Robust）程序的基础技能，也是面试高频考点。</div>`},

  {id:'intro-10', title:'算数运算符', tags:['运算符','优先级','复合运算','自增减'], content:`
<h4>赋值符号 =</h4>
<p><strong>先看右侧，再看左侧</strong>——把右侧的值计算出来，再赋值给左侧的变量。</p>

<h4>算数运算符一览</h4>
<table><tr><th>运算符</th><th>说明</th><th>示例</th><th>结果</th></tr>
<tr><td><code>+</code></td><td>加法</td><td><code>1 + 2</code></td><td>3</td></tr>
<tr><td><code>-</code></td><td>减法</td><td><code>5 - 3</code></td><td>2</td></tr>
<tr><td><code>*</code></td><td>乘法</td><td><code>3 * 4</code></td><td>12</td></tr>
<tr><td><code>/</code></td><td>除法</td><td><code>5 / 2</code></td><td>2（整数除法丢小数）</td></tr>
<tr><td><code>%</code></td><td>取余（模）</td><td><code>5 % 2</code></td><td>1</td></tr></table>

<h4>运算符优先级</h4>
<p>乘除取余 <strong>&gt;</strong> 加减。括号 <code>()</code> 可改变优先级，多组括号先算最里层。</p>

<h4>复合运算符</h4>
<table><tr><th>写法</th><th>等价于</th></tr>
<tr><td><code>i += 2</code></td><td><code>i = i + 2</code></td></tr>
<tr><td><code>i -= 2</code></td><td><code>i = i - 2</code></td></tr>
<tr><td><code>i *= 2</code></td><td><code>i = i * 2</code></td></tr>
<tr><td><code>i /= 2</code></td><td><code>i = i / 2</code></td></tr>
<tr><td><code>i %= 2</code></td><td><code>i = i % 2</code></td></tr></table>

<h4>自增自减（面试高频考点！）</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span> a = <span class="num">1</span>;
Console.WriteLine(a++);  <span class="cm">// 1 —— 先用再加（后缀）</span>
Console.WriteLine(<span class="op">++</span>a);  <span class="cm">// 3 —— 先加再用（前缀）</span>
<span class="cm">// a-- 和 --a 同理，自减</span></pre></div>

<h4>自增减深度分析</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span> a = <span class="num">2</span>;
<span class="kw">int</span> b = a++ + <span class="op">++</span>a * <span class="num">2</span> + a--;
<span class="cm">// 分析：
// a++: 先用2，a变3
// ++a: 先变4，再用4
// a--: 先用4，a变3
// b = 2 + 4*2 + 4 = 14
// 最终 a = 3, b = 14</span></pre></div>

<div class="highlight-box">💡 <strong>记忆口诀：</strong>++ 在前，先加后用；++ 在后，先用后加。这个面试高频考点！</div>`}

  {id:'intro-11', title:'字符串拼接', tags:['字符串','Format','占位符'], content:`
<h4>方式一：+ 号拼接</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">string</span> str = <span class="str">"123"</span>;
str = str + <span class="str">"456"</span>;      <span class="cm">// "123456"</span>
str += <span class="str">"1"</span> + <span class="num">4</span> + <span class="kw">true</span>;  <span class="cm">// 自动调用 ToString()</span>
<span class="cm">// 注意：字符串只能用 + 拼接，不能用 -*/%</span></pre></div>

<h4>方式二：string.Format() —— 推荐</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">string</span> str = <span class="kw">string</span>.Format(<span class="str">"我是{0}，今年{1}岁"</span>, <span class="str">"小明"</span>, <span class="num">18</span>);
<span class="cm">// 结果: "我是小明，今年18岁"</span>
<span class="cm">// {0} 对应第一个参数, {1} 对应第二个参数, 以此类推</span></pre></div>

<h4>方式三：字符串插值（C# 6.0+）——最常见</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">string</span> name = <span class="str">"小明"</span>;
<span class="kw">int</span> age = <span class="num">18</span>;
<span class="kw">string</span> str = <span class="str">$"我是{name}，今年{age}岁"</span>;
<span class="cm">// $ 符号，在字符串中用 {变量名} 直接嵌入变量</span></pre></div>

<h4>控制台打印拼接</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre>Console.WriteLine(<span class="str">"A{0}B{1}C{2}"</span>, <span class="num">1</span>, <span class="kw">true</span>, <span class="kw">false</span>);
<span class="cm">// 后面参数比占位符多 → 不会报错，多余的被忽略</span>
<span class="cm">// 后面参数比占位符少 → 会报错！</span></pre></div>

<h4>+ 号拼接的重要细节</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre>str = <span class="str">""</span>;
str += <span class="num">1</span> + <span class="num">2</span> + <span class="str">""</span> + (<span class="num">3</span> + <span class="num">4</span>);  <span class="cm">// "37"</span>
<span class="cm">// 先算 1+2=3，遇到字符串""后转为拼接</span>
<span class="cm">// 括号优先 3+4=7，结果是 "3" + "" + "7" = "37"</span></pre></div>

<h4>三种拼接方式对比</h4>
<table><tr><th>方式</th><th>可读性</th><th>性能</th><th>推荐度</th></tr>
<tr><td>+ 拼接</td><td>简单场景好</td><td>频繁拼接差</td><td>⭐⭐</td></tr>
<tr><td>string.Format</td><td>大量参数时好</td><td>中等</td><td>⭐⭐⭐</td></tr>
<tr><td>$ 插值</td><td>最好</td><td>好</td><td>⭐⭐⭐⭐⭐</td></tr></table>`},

  {id:'intro-12', title:'条件运算符', tags:['比较','bool','大小判断'], content:`
<h4>六大条件运算符</h4>
<table><tr><th>运算符</th><th>含义</th><th>示例</th><th>结果</th></tr>
<tr><td><code>&gt;</code></td><td>大于</td><td><code>5 &gt; 3</code></td><td>true</td></tr>
<tr><td><code>&lt;</code></td><td>小于</td><td><code>3 &lt; 5</code></td><td>true</td></tr>
<tr><td><code>&gt;=</code></td><td>大于等于</td><td><code>5 &gt;= 5</code></td><td>true</td></tr>
<tr><td><code>&lt;=</code></td><td>小于等于</td><td><code>3 &lt;= 5</code></td><td>true</td></tr>
<tr><td><code>==</code></td><td>等于</td><td><code>5 == 3</code></td><td>false</td></tr>
<tr><td><code>!=</code></td><td>不等于</td><td><code>5 != 3</code></td><td>true</td></tr></table>

<h4>重要规则</h4>
<ul>
  <li>比较结果返回 <strong>bool 类型</strong>（true/false）</li>
  <li>条件运算符优先级 <strong>低于</strong> 算数运算符（先计算再比较）</li>
  <li><strong>不能进行范围比较</strong>：<code>1 &lt; a &lt; 6</code> 在 C# 中非法，需配合逻辑运算符</li>
  <li>不同数值类型可以随意进行条件比较</li>
  <li>string、char、bool 只能同类型进行 <code>==</code> 和 <code>!=</code> 比较</li>
  <li>char 还可以和数值类型进行大小比较（转为 ASCII 码）</li>
</ul>

<div class="highlight-box">💡 <strong>常见错误：</strong><code>if (a == true)</code> 冗余。直接写 <code>if (a)</code> 即可。判断不等于用 <code>if (!a)</code>。</div>`},

  {id:'intro-13', title:'逻辑运算符', tags:['&&','||','!','短路'], content:`
<h4>逻辑运算符速查</h4>
<table><tr><th>运算符</th><th>名称</th><th>规则</th><th>真值表示例</th></tr>
<tr><td><code>&&</code></td><td>逻辑与 (AND)</td><td>有假则假，同真为真</td><td>T&&T=T, T&&F=F, F&&T=F, F&&F=F</td></tr>
<tr><td><code>||</code></td><td>逻辑或 (OR)</td><td>有真则真，同假为假</td><td>T||T=T, T||F=T, F||T=T, F||F=F</td></tr>
<tr><td><code>!</code></td><td>逻辑非 (NOT)</td><td>真变假，假变真</td><td>!T=F, !F=T</td></tr></table>

<h4>短路规则（高频面试题！）</h4>
<table><tr><th>运算符</th><th>短路条件</th><th>效果</th></tr>
<tr><td><code>||</code></td><td>左边为 true</td><td>右边不再计算（有真则真，无需再看右边）</td></tr>
<tr><td><code>&&</code></td><td>左边为 false</td><td>右边不再计算（有假则假，无需再看右边）</td></tr></table>

<h4>短路规则验证</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span> i = <span class="num">1</span>;
<span class="kw">bool</span> r = i &gt; <span class="num">0</span> || ++i &gt;= <span class="num">1</span>;  <span class="cm">// i&gt;0为true，短路，++i不执行</span>
<span class="cm">// 此时 i 仍然是 1</span>

r = i &lt; <span class="num">0</span> && i++ &gt; <span class="num">1</span>;     <span class="cm">// i&lt;0为false，短路，i++不执行</span>
<span class="cm">// 此时 i 仍然是 1</span></pre></div>

<h4>运算符优先级总览</h4>
<p><code>!</code>（最高）> 算术运算符 > 条件运算符 > <code>&&</code> > <code>||</code> > 赋值运算符（最低）</p>

<h4>实用技巧：判断一个数在区间内</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span> a = <span class="num">5</span>;
<span class="kw">bool</span> inRange = a &gt; <span class="num">1</span> && a &lt; <span class="num">10</span>;  <span class="cm">// true — 这才是C#的正确写法</span>
<span class="cm">// 错误写法：1 &lt; a &lt; 10  （C#不支持数学式范围比较）</span></pre></div>`},

  {id:'intro-14', title:'位运算符', tags:['位运算','二进制','<<','>>'], content:`
<h4>位运算符速查</h4>
<table><tr><th>运算符</th><th>名称</th><th>规则</th><th>示例</th></tr>
<tr><td><code>&</code></td><td>位与</td><td>有0则0</td><td>101 & 011 = 001</td></tr>
<tr><td><code>|</code></td><td>位或</td><td>有1则1</td><td>101 | 011 = 111</td></tr>
<tr><td><code>^</code></td><td>异或</td><td>相同为0，不同为1</td><td>101 ^ 011 = 110</td></tr>
<tr><td><code>~</code></td><td>位取反</td><td>0变1，1变0</td><td>~101 = ...010（涉及补码）</td></tr>
<tr><td><code>&lt;&lt;</code></td><td>左移</td><td>左侧去掉，右侧加0</td><td>101 &lt;&lt; 2 = 10100</td></tr>
<tr><td><code>&gt;&gt;</code></td><td>右移</td><td>右侧去掉，左侧补符号位</td><td>10100 &gt;&gt; 2 = 101</td></tr></table>

<h4>代码示例</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span> a = <span class="num">1</span>;   <span class="cm">// 二进制: 001</span>
<span class="kw">int</span> b = <span class="num">5</span>;   <span class="cm">// 二进制: 101</span>
Console.WriteLine(a & b);  <span class="cm">// 001 & 101 = 001 = 1</span>
Console.WriteLine(a | b);  <span class="cm">// 001 | 101 = 101 = 5</span>
Console.WriteLine(a ^ b);  <span class="cm">// 001 ^ 101 = 100 = 4</span>

<span class="kw">int</span> x = <span class="num">5</span>;   <span class="cm">// 二进制: 101</span>
Console.WriteLine(x &lt;&lt; <span class="num">5</span>); <span class="cm">// 10100000 = 160（左移5位）</span>
Console.WriteLine(x &gt;&gt; <span class="num">2</span>); <span class="cm">// 1（右移2位，去掉最右2位）</span>
Console.WriteLine(x &lt;&lt; <span class="num">1</span>); <span class="cm">// 10（左移1位 = 乘以2）</span></pre></div>

<h4>位运算的应用场景</h4>
<ul>
  <li><strong>性能优化：</strong>位运算速度极快，左移1位等于乘2，右移1位等于除以2</li>
  <li><strong>权限系统：</strong>用每个 bit 代表一种权限（读=1，写=2，执行=4）</li>
  <li><strong>标志位：</strong>用一个 int 存储多个 bool 状态</li>
  <li><strong>图形学：</strong>颜色值的拆分和合并</li>
</ul>

<div class="highlight-box">💡 <strong>记忆技巧：</strong>& 位与 = AND（有0则0），| 位或 = OR（有1则1）。注意不要与逻辑运算符 && 和 || 混淆！</div>`},

  {id:'intro-15', title:'三目运算符', tags:['?:','条件表达式','三元'], content:`
<h4>语法</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// bool表达式 ? true时返回的值 : false时返回的值</span>
<span class="kw">string</span> result = score &gt;= <span class="num">60</span> ? <span class="str">"及格"</span> : <span class="str">"不及格"</span>;
<span class="kw">int</span> max = a &gt; b ? a : b;
<span class="kw">int</span> abs = x &gt;= <span class="num">0</span> ? x : -x;  <span class="cm">// 取绝对值</span></pre></div>

<h4>关键规则</h4>
<ul>
  <li>三个空位：<strong>bool类型的条件 ? 真值 : 假值</strong></li>
  <li>有返回值，且 <strong>两个分支的返回值类型必须一致</strong></li>
  <li>必须使用返回值（不能单独作为语句，不同于 if-else）</li>
  <li>第一个空位：bool变量 / 条件表达式 / 逻辑表达式</li>
  <li>第二、三个空位：任何表达式，只要结果类型一致</li>
</ul>

<h4>三目运算符嵌套（谨慎使用）</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">string</span> grade = score &gt;= <span class="num">90</span> ? <span class="str">"A"</span> :
           score &gt;= <span class="num">80</span> ? <span class="str">"B"</span> :
           score &gt;= <span class="num">70</span> ? <span class="str">"C"</span> :
           score &gt;= <span class="num">60</span> ? <span class="str">"D"</span> : <span class="str">"F"</span>;
<span class="cm">// 效果等同于多分支 if-else，但不推荐超过2层嵌套</span></pre></div>

<h4>三目 vs if-else</h4>
<table><tr><th>特性</th><th>三目运算符</th><th>if-else</th></tr>
<tr><td>本质</td><td>表达式（有返回值）</td><td>语句（无返回值）</td></tr>
<tr><td>使用场景</td><td>简单的二选一赋值</td><td>复杂的多分支逻辑</td></tr>
<tr><td>可读性</td><td>简单场景极佳</td><td>复杂场景更清晰</td></tr></table>

<div class="highlight-box">💡 <strong>最佳实践：</strong>三目运算符让简单的二选一变得极其简洁。但嵌套超过2层会严重降低可读性，此时应该用 <code>if-else</code> 或 <code>switch</code>。</div>`}

  {id:'intro-16', title:'条件分支——if语句', tags:['if','else','分支','嵌套'], content:`
<h4>三种形式</h4>
<table><tr><th>形式</th><th>分支数</th><th>语法</th></tr>
<tr><td>if</td><td>1条</td><td><code>if(bool) { }</code></td></tr>
<tr><td>if...else</td><td>2条</td><td><code>if(bool) { } else { }</code></td></tr>
<tr><td>if...else if...else</td><td>N条</td><td><code>if(bool) { } else if(bool) { } else { }</code></td></tr></table>

<h4>注意事项</h4>
<ul>
  <li>if 语句的大括号后面<strong>不需要加分号</strong></li>
  <li>可以<strong>无限嵌套</strong>使用</li>
  <li>else 可以省略</li>
  <li>条件判断<strong>从上到下</strong>执行，满足第一个后，之后的都不会执行</li>
  <li>如果只有一行代码，可以省略大括号（但不推荐，容易出错）</li>
</ul>

<h4>嵌套示例——登录验证</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">if</span> (name == <span class="str">"admin"</span>)
{
    Console.WriteLine(<span class="str">"用户名验证成功"</span>);
    <span class="kw">if</span> (password == <span class="str">"123456"</span>)
    {
        Console.WriteLine(<span class="str">"密码验证成功，欢迎登录！"</span>);
    }
    <span class="kw">else</span>
    {
        Console.WriteLine(<span class="str">"密码错误！"</span>);
    }
}
<span class="kw">else</span>
{
    Console.WriteLine(<span class="str">"用户名不存在！"</span>);
}</pre></div>

<h4>if-else if 的陷阱</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span> score = <span class="num">85</span>;
<span class="kw">if</span> (score &gt;= <span class="num">90</span>)
    Console.WriteLine(<span class="str">"A"</span>);
<span class="kw">else if</span> (score &gt;= <span class="num">80</span>)   <span class="cm">// 只有上面不成立才判断</span>
    Console.WriteLine(<span class="str">"B"</span>);
<span class="kw">else if</span> (score &gt;= <span class="num">70</span>)
    Console.WriteLine(<span class="str">"C"</span>);
<span class="cm">// 如果把条件从大到小反过来写（>=70 在 >=80 之前）</span>
<span class="cm">// 则只会输出"B"永远不会输出"A"，因为 >=70 先匹配了</span></pre></div>

<div class="highlight-box">⚠️ <strong>顺序很重要：</strong>if-else if 链中，条件的排列顺序会影响逻辑。建议从小范围到大范围，或从大到小，保持一致。</div>`},

  {id:'intro-17', title:'条件分支——switch语句', tags:['switch','case','贯穿','default'], content:`
<h4>基本语法</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">switch</span> (变量)
{
    <span class="kw">case</span> <span class="num">1</span>:            <span class="cm">// 变量 == 1</span>
        Console.WriteLine(<span class="str">"等于1"</span>);
        <span class="kw">break</span>;
    <span class="kw">case</span> <span class="num">2</span>:            <span class="cm">// 变量 == 2</span>
        Console.WriteLine(<span class="str">"等于2"</span>);
        <span class="kw">break</span>;
    <span class="kw">default</span>:           <span class="cm">// 以上都不满足时执行</span>
        Console.WriteLine(<span class="str">"其他情况"</span>);
        <span class="kw">break</span>;
}</pre></div>

<h4>贯穿 (Fall-through)</h4>
<p>多个 case 共享同一逻辑时，可以省略中间的 break：</p>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">switch</span> (num)
{
    <span class="kw">case</span> <span class="num">1</span>:
    <span class="kw">case</span> <span class="num">3</span>:
    <span class="kw">case</span> <span class="num">5</span>:
        Console.WriteLine(<span class="str">"是奇数"</span>);
        <span class="kw">break</span>;
    <span class="kw">case</span> <span class="num">2</span>:
    <span class="kw">case</span> <span class="num">4</span>:
    <span class="kw">case</span> <span class="num">6</span>:
        Console.WriteLine(<span class="str">"是偶数"</span>);
        <span class="kw">break</span>;
}</pre></div>

<h4>switch 与枚举配合（最佳实践）</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">enum</span> <span class="type">GameState</span> { <span class="type">Menu</span>, <span class="type">Playing</span>, <span class="type">Paused</span>, <span class="type">GameOver</span> }

<span class="kw">switch</span> (state)
{
    <span class="kw">case</span> <span class="type">GameState</span>.<span class="type">Menu</span>:
        ShowMainMenu(); <span class="kw">break</span>;
    <span class="kw">case</span> <span class="type">GameState</span>.<span class="type">Playing</span>:
        UpdateGame(); <span class="kw">break</span>;
    <span class="kw">case</span> <span class="type">GameState</span>.<span class="type">Paused</span>:
        ShowPauseMenu(); <span class="kw">break</span>;
    <span class="kw">case</span> <span class="type">GameState</span>.<span class="type">GameOver</span>:
        ShowResult(); <span class="kw">break</span>;
}</pre></div>

<h4>关键注意</h4>
<ul>
  <li>case 后必须跟<strong>常量值</strong>（不能写范围/条件/逻辑表达式）</li>
  <li>switch 只判断变量是否<strong>等于</strong>某个固定值</li>
  <li>default 可以省略</li>
  <li>每个非贯穿的 case 必须以 <code>break</code> 结束（或其他跳转语句）</li>
</ul>

<div class="highlight-box">💡 <strong>适用场景：</strong>switch 用于精确匹配（枚举、状态机、菜单选择等）。C# 编译器会将其优化为跳转表，在 case 较多时性能优于 if-else 链。</div>`},

  {id:'intro-18', title:'循环——while语句', tags:['while','循环','break','continue'], content:`
<h4>基本语法</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">while</span> (bool类型值)
{
    <span class="cm">// 满足条件时循环执行</span>
    <span class="cm">// 执行完后回到开头再次判断条件</span>
}
<span class="cm">// 条件不满足时，跳出循环，继续执行后面的代码</span></pre></div>

<h4>流程控制关键词</h4>
<table><tr><th>关键词</th><th>作用</th><th>说明</th></tr>
<tr><td><code>break</code></td><td>跳出循环</td><td>立即终止当前循环，执行循环外的代码</td></tr>
<tr><td><code>continue</code></td><td>回到循环开始</td><td>跳过本次循环剩余代码，进入下一次循环条件判断</td></tr></table>

<h4>实战——打印 1~20 之间的奇数</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span> i = <span class="num">0</span>;
<span class="kw">while</span> (i &lt; <span class="num">20</span>)
{
    i++;
    <span class="kw">if</span> (i % <span class="num">2</span> == <span class="num">0</span>)
        <span class="kw">continue</span>;  <span class="cm">// 跳过偶数，进入下一次循环</span>
    Console.WriteLine(i);
}</pre></div>

<h4>死循环及其使用场景</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">while</span> (<span class="kw">true</span>)  <span class="cm">// 死循环——条件永远为真</span>
{
    Console.WriteLine(<span class="str">"请输入命令（输入 exit 退出）："</span>);
    <span class="kw">string</span> cmd = Console.ReadLine();
    <span class="kw">if</span> (cmd == <span class="str">"exit"</span>)
        <span class="kw">break</span>;  <span class="cm">// 必须有退出条件！</span>
    ProcessCommand(cmd);
}
<span class="cm">// 注意：在游戏引擎（Unity）中死循环会导致卡死！</span></pre></div>

<h4>while vs for 选择指南</h4>
<table><tr><th>场景</th><th>推荐</th><th>原因</th></tr>
<tr><td>已知循环次数</td><td>for</td><td>初始化、条件、增量一目了然</td></tr>
<tr><td>不确定循环次数</td><td>while</td><td>条件灵活，适合等待型循环</td></tr>
<tr><td>至少执行一次</td><td>do-while</td><td>先执行后判断</td></tr></table>`},

  {id:'intro-19', title:'循环——do while语句', tags:['do-while','先执行后判断'], content:`
<h4>基本语法</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">do</span>
{
    <span class="cm">// 循环语句块——至少执行一次</span>
} <span class="kw">while</span> (bool类型值);  <span class="cm">// &#8592; 注意：这里有分号！</span></pre></div>

<h4>while vs do...while 对比</h4>
<table><tr><th>特性</th><th>while</th><th>do...while</th></tr>
<tr><td>判断时机</td><td>先判断，再执行</td><td>先执行，后判断</td></tr>
<tr><td>最少执行次数</td><td>0次（条件不满足就不执行）</td><td>1次（至少执行一次）</td></tr>
<tr><td>结尾分号</td><td>无</td><td>有 <code>;</code></td></tr>
<tr><td>使用频率</td><td>⭐⭐⭐⭐⭐</td><td>⭐⭐</td></tr></table>

<h4>典型使用场景——菜单循环</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">string</span> choice;
<span class="kw">do</span>
{
    Console.WriteLine(<span class="str">"===== 菜单 ====="</span>);
    Console.WriteLine(<span class="str">"1. 开始游戏"</span>);
    Console.WriteLine(<span class="str">"2. 设置"</span>);
    Console.WriteLine(<span class="str">"3. 退出"</span>);
    Console.Write(<span class="str">"请选择："</span>);
    choice = Console.ReadLine();

    <span class="kw">switch</span> (choice)
    {
        <span class="kw">case</span> <span class="str">"1"</span>: StartGame(); <span class="kw">break</span>;
        <span class="kw">case</span> <span class="str">"2"</span>: OpenSettings(); <span class="kw">break</span>;
    }
} <span class="kw">while</span> (choice != <span class="str">"3"</span>);  <span class="cm">// 选择"退出"时结束循环</span></pre></div>

<div class="highlight-box">💡 <strong>使用场景：</strong>当你需要"至少执行一次再判断"时用 do...while。典型场景：先显示菜单，再根据用户选择决定是否继续。</div>`},

  {id:'intro-20', title:'循环——for语句', tags:['for','初始表达式','嵌套循环'], content:`
<h4>基本语法</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">for</span> (初始表达式; 条件表达式; 增量表达式)
{
    <span class="cm">// 循环代码逻辑</span>
}
<span class="cm">// 执行顺序：</span>
<span class="cm">// 1. 第一次进入循环时执行初始表达式（只一次）</span>
<span class="cm">// 2. 判断条件表达式（bool值），为true进入循环体</span>
<span class="cm">// 3. 执行循环体</span>
<span class="cm">// 4. 执行增量表达式</span>
<span class="cm">// 5. 回到第2步再次判断</span></pre></div>

<h4>典型用法</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i &lt; <span class="num">10</span>; i++)     <span class="cm">// 递增：0, 1, 2, ..., 9</span>
<span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">10</span>; i &gt;= <span class="num">0</span>; i--)  <span class="cm">// 递减：10, 9, 8, ..., 0</span>
<span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i &lt; <span class="num">10</span>; i += <span class="num">2</span>)  <span class="cm">// 步进2：0, 2, 4, 6, 8</span>
<span class="kw">for</span> (; ; )                       <span class="cm">// 死循环（三个空位均可省略）</span></pre></div>

<h4>for 循环的灵活用法</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 多变量初始化</span>
<span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>, j = <span class="num">10</span>; i &lt; j; i++, j--)
{
    Console.WriteLine(<span class="str">$"i={i}, j={j}"</span>);
}

<span class="cm">// 不初始化（循环变量在外部定义）</span>
<span class="kw">int</span> k = <span class="num">0</span>;
<span class="kw">for</span> (; k &lt; <span class="num">5</span>; k++) { }</pre></div>

<h4>嵌套循环</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i &lt; <span class="num">3</span>; i++)      <span class="cm">// 外层循环 3 次</span>
{
    <span class="kw">for</span> (<span class="kw">int</span> j = <span class="num">0</span>; j &lt; <span class="num">3</span>; j++)  <span class="cm">// 内层循环每次重新初始化</span>
    {
        Console.WriteLine(<span class="str">$"({i},{j})"</span>);
    }
}
<span class="cm">// 输出：(0,0)(0,1)(0,2)(1,0)(1,1)(1,2)(2,0)(2,1)(2,2)</span>
<span class="cm">// 内层 j 每次都会重新初始化为 0！</span></pre></div>

<h4>for vs while 总结</h4>
<table><tr><th>场景</th><th>推荐</th><th>原因</th></tr>
<tr><td>已知循环次数/范围</td><td>for</td><td>结构紧凑，初始化、条件、增量一目了然</td></tr>
<tr><td>不确定循环次数</td><td>while</td><td>条件灵活，适合等待型循环</td></tr></table>`}
  ]
},

{id:'basic', title:'二、C# 基础教学', desc:'掌握枚举、数组、函数、结构体等核心基础知识', badge:'基础', lessons:[
  {id:'basic-1', title:'枚举', tags:['enum','状态','类型转换'], content:`
<h4>什么是枚举</h4>
<p>枚举是一组被命名的<strong>整型常量</strong>的集合，用于表示一组相关的、固定的选项。使用 <code>enum</code> 关键字定义。</p>

<h4>枚举的基本声明和使用</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 声明枚举（通常定义在 namespace 或 class 内部）</span>
<span class="kw">enum</span> <span class="type">E_Direction</span>
{
    <span class="type">North</span>,    <span class="cm">// 0 —— 默认从0开始</span>
    <span class="type">South</span>,    <span class="cm">// 1</span>
    <span class="type">East</span>,     <span class="cm">// 2</span>
    <span class="type">West</span>      <span class="cm">// 3</span>
}

<span class="kw">enum</span> <span class="type">E_GameState</span>
{
    <span class="type">Menu</span> = <span class="num">1</span>,      <span class="cm">// 自定义起始值</span>
    <span class="type">Playing</span>,        <span class="cm">// 2 —— 自动递增</span>
    <span class="type">Paused</span> = <span class="num">5</span>,     <span class="cm">// 5 —— 手动指定</span>
    <span class="type">GameOver</span>        <span class="cm">// 6 —— 自动递增 = 5+1</span>
}

<span class="cm">// 使用枚举</span>
<span class="type">E_Direction</span> dir = <span class="type">E_Direction</span>.<span class="type">North</span>;
<span class="kw">if</span> (dir == <span class="type">E_Direction</span>.<span class="type">North</span>)
{
    Console.WriteLine(<span class="str">"向北走"</span>);
}</pre></div>

<h4>枚举与整数的相互转换</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 枚举转整数</span>
<span class="kw">int</span> dirValue = (<span class="kw">int</span>)<span class="type">E_Direction</span>.<span class="type">East</span>;  <span class="cm">// 2</span>

<span class="cm">// 整数转枚举 (强制转换)</span>
<span class="type">E_Direction</span> dir2 = (<span class="type">E_Direction</span>)<span class="num">2</span>;   <span class="cm">// East</span>
<span class="cm">// 注意：即使整数值没有对应的枚举成员也不会报错</span>

<span class="cm">// 枚举转字符串</span>
<span class="kw">string</span> dirName = dir.ToString();         <span class="cm">// "North"</span>

<span class="cm">// 字符串转枚举</span>
<span class="type">E_Direction</span> dir3 = (<span class="type">E_Direction</span>)Enum.Parse(<span class="kw">typeof</span>(<span class="type">E_Direction</span>), <span class="str">"South"</span>);</pre></div>

<h4>枚举在 switch 中的应用</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">switch</span> (state)
{
    <span class="kw">case</span> <span class="type">E_GameState</span>.<span class="type">Menu</span>:
        ShowMenuPanel(); <span class="kw">break</span>;
    <span class="kw">case</span> <span class="type">E_GameState</span>.<span class="type">Playing</span>:
        StartGame(); <span class="kw">break</span>;
    <span class="kw">case</span> <span class="type">E_GameState</span>.<span class="type">Paused</span>:
        PauseGame(); <span class="kw">break</span>;
    <span class="kw">case</span> <span class="type">E_GameState</span>.<span class="type">GameOver</span>:
        ShowResult(); <span class="kw">break</span>;
}</pre></div>

<h4>何为命名常量</h4>
<p>给一组"状态"取名字，用名字代替魔法数字。例如用 <code>E_Direction.North</code> 代替 <code>0</code>。</p>

<div class="highlight-box">💡 <strong>最佳实践：</strong>枚举让代码更加可读、可维护。当你有"一组固定的选项"（方向、状态、类型、级别等）时，优先考虑使用枚举，而不是用整数 0,1,2,3 这样的"魔法数字"。</div>
`},

  {id:'basic-2', title:'一维数组', tags:['数组','遍历','增删查改'], content:`
<h4>什么是数组</h4>
<p>数组是一组<strong>相同类型</strong>、<strong>固定长度</strong>的数据集合，通过索引访问。索引从 <strong>0</strong> 开始。</p>

<h4>数组的声明与初始化（5种方式）</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 方式1：声明长度，不赋值（元素为默认值）</span>
<span class="kw">int</span>[] arr = <span class="kw">new</span> <span class="kw">int</span>[<span class="num">5</span>];  <span class="cm">// {0, 0, 0, 0, 0}</span>

<span class="cm">// 方式2：声明长度并初始化</span>
<span class="kw">int</span>[] arr2 = <span class="kw">new</span> <span class="kw">int</span>[<span class="num">3</span>] { <span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span> };

<span class="cm">// 方式3：不指定长度，元素决定长度</span>
<span class="kw">int</span>[] arr3 = <span class="kw">new</span> <span class="kw">int</span>[] { <span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">4</span>, <span class="num">5</span> };

<span class="cm">// 方式4：最简洁写法</span>
<span class="kw">int</span>[] arr4 = { <span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">4</span>, <span class="num">5</span> };

<span class="cm">// 方式5：先声明再初始化</span>
<span class="kw">int</span>[] arr5;
arr5 = <span class="kw">new</span> <span class="kw">int</span>[<span class="num">3</span>] { <span class="num">7</span>, <span class="num">8</span>, <span class="num">9</span> };</pre></div>

<h4>数组的访问与遍历</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span>[] arr = { <span class="num">10</span>, <span class="num">20</span>, <span class="num">30</span>, <span class="num">40</span>, <span class="num">50</span> };

<span class="cm">// 通过索引访问</span>
Console.WriteLine(arr[<span class="num">0</span>]);  <span class="cm">// 10</span>
arr[<span class="num">2</span>] = <span class="num">99</span>;            <span class="cm">// 修改第三个元素</span>

<span class="cm">// 获取长度</span>
Console.WriteLine(arr.Length);  <span class="cm">// 5</span>

<span class="cm">// for 遍历（需要索引时使用）</span>
<span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i &lt; arr.Length; i++)
{
    Console.WriteLine(<span class="str">$"arr[{i}] = {arr[i]}"</span>);
}

<span class="cm">// foreach 遍历（不需要索引时使用——推荐）</span>
<span class="kw">foreach</span> (<span class="kw">int</span> item <span class="kw">in</span> arr)
{
    Console.WriteLine(item);
}</pre></div>

<h4>数组的增删查改</h4>
<p>由于数组<strong>长度固定</strong>，不能直接增加或删除元素。常见做法：</p>
<ul>
  <li><strong>增加/删除：</strong>创建一个新的更大/更小的数组，复制原有元素</li>
  <li><strong>查找：</strong>遍历数组或使用 <code>Array.IndexOf()</code></li>
  <li><strong>修改：</strong>直接通过索引赋值 <code>arr[i] = newValue</code></li>
</ul>

<h4>数组 vs 变量</h4>
<table><tr><th>特性</th><th>单个变量</th><th>数组</th></tr>
<tr><td>数据量</td><td>1个</td><td>多个（批量处理）</td></tr>
<tr><td>操作方式</td><td>直接操作</td><td>通过索引 + 循环批量操作</td></tr>
<tr><td>内存</td><td>分配在栈或堆</td><td>引用类型，分配在堆</td></tr>
</table>

<div class="highlight-box">⚠️ <strong>注意：</strong>数组索引越界（如访问 <code>arr[5]</code> 当 Length=5）会抛出 <code>IndexOutOfRangeException</code>。这是最常见的运行时错误之一。</div>
`},

  {id:'basic-3', title:'二维数组', tags:['矩阵','行列','GetLength'], content:`
<h4>什么是二维数组</h4>
<p>二维数组可以理解为"表格"或"矩阵"——有行和列的数据结构。使用逗号 <code>,</code> 分隔维度。</p>

<h4>二维数组的声明与初始化</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 声明 3行2列 的数组</span>
<span class="kw">int</span>[,] matrix = <span class="kw">new</span> <span class="kw">int</span>[<span class="num">3</span>, <span class="num">2</span>];

<span class="cm">// 声明并初始化</span>
<span class="kw">int</span>[,] matrix2 = <span class="kw">new</span> <span class="kw">int</span>[<span class="num">3</span>, <span class="num">2</span>] {
    { <span class="num">1</span>, <span class="num">2</span> },
    { <span class="num">3</span>, <span class="num">4</span> },
    { <span class="num">5</span>, <span class="num">6</span> }
};

<span class="cm">// 最简写法</span>
<span class="kw">int</span>[,] matrix3 = {
    { <span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span> },
    { <span class="num">4</span>, <span class="num">5</span>, <span class="num">6</span> }
};</pre></div>

<h4>访问元素和属性</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span>[,] arr = {
    { <span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span> },
    { <span class="num">4</span>, <span class="num">5</span>, <span class="num">6</span> }
};

Console.WriteLine(arr[<span class="num">0</span>, <span class="num">1</span>]);  <span class="cm">// 2（第0行，第1列）</span>
Console.WriteLine(arr[<span class="num">1</span>, <span class="num">2</span>]);  <span class="cm">// 6（第1行，第2列）</span>

arr[<span class="num">1</span>, <span class="num">0</span>] = <span class="num">99</span>;          <span class="cm">// 修改元素</span>

<span class="cm">// 获取维度长度</span>
Console.WriteLine(arr.GetLength(<span class="num">0</span>));  <span class="cm">// 2（行数 - 第0维）</span>
Console.WriteLine(arr.GetLength(<span class="num">1</span>));  <span class="cm">// 3（列数 - 第1维）</span>
<span class="cm">// arr.Length = 6（总元素数 = 2 * 3）</span></pre></div>

<h4>二维数组遍历</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span>[,] matrix = {
    { <span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span> },
    { <span class="num">4</span>, <span class="num">5</span>, <span class="num">6</span> },
    { <span class="num">7</span>, <span class="num">8</span>, <span class="num">9</span> }
};

<span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i &lt; matrix.GetLength(<span class="num">0</span>); i++)    <span class="cm">// 行</span>
{
    <span class="kw">for</span> (<span class="kw">int</span> j = <span class="num">0</span>; j &lt; matrix.GetLength(<span class="num">1</span>); j++) <span class="cm">// 列</span>
    {
        Console.Write(matrix[i, j] + <span class="str">" "</span>);
    }
    Console.WriteLine();  <span class="cm">// 每行结束后换行</span>
}
<span class="cm">// 输出：
// 1 2 3
// 4 5 6
// 7 8 9</span></pre></div>

<h4>实用案例——地图格子的数据存储</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 用二维数组表示游戏地图（0=空地，1=墙，2=道具）</span>
<span class="kw">int</span>[,] map = {
    { <span class="num">1</span>, <span class="num">1</span>, <span class="num">1</span>, <span class="num">1</span> },
    { <span class="num">1</span>, <span class="num">0</span>, <span class="num">2</span>, <span class="num">1</span> },
    { <span class="num">1</span>, <span class="num">0</span>, <span class="num">0</span>, <span class="num">1</span> },
    { <span class="num">1</span>, <span class="num">1</span>, <span class="num">1</span>, <span class="num">1</span> }
};
<span class="cm">// 通过 map[row, col] 即可读取或修改地图格子</span></pre></div>
`},

  {id:'basic-4', title:'交错数组', tags:['数组的数组','不规则'], content:`
<h4>什么是交错数组</h4>
<p>交错数组是<strong>"数组的数组"</strong>——每个元素又是一个一维数组。与二维数组不同，交错数组的每行可以有<strong>不同的长度</strong>。</p>

<h4>声明与初始化</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 声明一个有3行的交错数组（每行长度待定）</span>
<span class="kw">int</span>[][] jagged = <span class="kw">new</span> <span class="kw">int</span>[<span class="num">3</span>][];

<span class="cm">// 每行分别初始化（可以不同长度！）</span>
jagged[<span class="num">0</span>] = <span class="kw">new</span> <span class="kw">int</span>[] { <span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span> };       <span class="cm">// 第0行：3个元素</span>
jagged[<span class="num">1</span>] = <span class="kw">new</span> <span class="kw">int</span>[] { <span class="num">4</span>, <span class="num">5</span> };          <span class="cm">// 第1行：2个元素</span>
jagged[<span class="num">2</span>] = <span class="kw">new</span> <span class="kw">int</span>[] { <span class="num">6</span>, <span class="num">7</span>, <span class="num">8</span>, <span class="num">9</span> };    <span class="cm">// 第2行：4个元素</span>

<span class="cm">// 声明时直接初始化</span>
<span class="kw">int</span>[][] jagged2 = <span class="kw">new</span> <span class="kw">int</span>[][] {
    <span class="kw">new</span> <span class="kw">int</span>[] { <span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span> },
    <span class="kw">new</span> <span class="kw">int</span>[] { <span class="num">4</span>, <span class="num">5</span> },
    <span class="kw">new</span> <span class="kw">int</span>[] { <span class="num">6</span>, <span class="num">7</span>, <span class="num">8</span>, <span class="num">9</span> }
};

<span class="cm">// 最简写法</span>
<span class="kw">int</span>[][] jagged3 = {
    <span class="kw">new</span> <span class="kw">int</span>[] { <span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span> },
    <span class="kw">new</span> <span class="kw">int</span>[] { <span class="num">4</span>, <span class="num">5</span> },
    <span class="kw">new</span> <span class="kw">int</span>[] { <span class="num">6</span>, <span class="num">7</span>, <span class="num">8</span>, <span class="num">9</span> }
};</pre></div>

<h4>交错数组的访问与遍历</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span>[][] jagged = {
    <span class="kw">new</span> <span class="kw">int</span>[] { <span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span> },
    <span class="kw">new</span> <span class="kw">int</span>[] { <span class="num">4</span>, <span class="num">5</span> },
    <span class="kw">new</span> <span class="kw">int</span>[] { <span class="num">6</span>, <span class="num">7</span>, <span class="num">8</span>, <span class="num">9</span> }
};

Console.WriteLine(jagged[<span class="num">0</span>][<span class="num">1</span>]);  <span class="cm">// 2</span>
Console.WriteLine(jagged[<span class="num">2</span>][<span class="num">3</span>]);  <span class="cm">// 9</span>

<span class="cm">// 遍历（嵌套循环 + 每行不同长度）</span>
<span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i &lt; jagged.Length; i++)
{
    <span class="kw">for</span> (<span class="kw">int</span> j = <span class="num">0</span>; j &lt; jagged[i].Length; j++)
    {
        Console.Write(jagged[i][j] + <span class="str">" "</span>);
    }
    Console.WriteLine();
}
<span class="cm">// 输出：
// 1 2 3
// 4 5
// 6 7 8 9</span></pre></div>

<h4>二维数组 vs 交错数组</h4>
<table><tr><th>特性</th><th>二维数组 <code>[,]</code></th><th>交错数组 <code>[][]</code></th></tr>
<tr><td>语法</td><td>一个逗号</td><td>两个方括号</td></tr>
<tr><td>形状</td><td>规则的矩形</td><td>不规则（每行长度可不同）</td></tr>
<tr><td>内存布局</td><td>连续内存块</td><td>每行独立的数组引用</td></tr>
<tr><td>访问方式</td><td><code>arr[row, col]</code></td><td><code>arr[row][col]</code></td></tr>
<tr><td>性能</td><td>缓存友好</td><td>可能稍慢</td></tr></table>

<div class="highlight-box">💡 <strong>选择建议：</strong>规则矩阵用二维数组，不规则数据（如每行学生数量不同的成绩表）用交错数组。交错数组在 .NET 中也被称为"锯齿形数组"。</div>
`},

  {id:'basic-5', title:'值类型和引用类型', tags:['栈','堆','内存'], content:`
<h4>核心概念</h4>
<p>C# 中的数据类型分为两大类：<strong>值类型</strong>和<strong>引用类型</strong>。它们的核心区别在于"数据存储在哪里"和"赋值时复制什么"。</p>

<h4>值类型 vs 引用类型对比</h4>
<table><tr><th>特性</th><th>值类型 (Value Type)</th><th>引用类型 (Reference Type)</th></tr>
<tr><td>存储位置</td><td>栈 (Stack)</td><td>堆 (Heap) — 栈上只存地址</td></tr>
<tr><td>赋值行为</td><td>复制数据本身</td><td>复制地址（指向同一对象）</td></tr>
<tr><td>默认值</td><td>0 / false</td><td>null</td></tr>
<tr><td>继承自</td><td>System.ValueType</td><td>System.Object</td></tr>
<tr><td>包含类型</td><td>int, float, bool, struct, enum</td><td>string, class, array, interface, delegate</td></tr>
</table>

<h4>值类型赋值——复制数据</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span> a = <span class="num">10</span>;
<span class="kw">int</span> b = a;       <span class="cm">// b 复制了 a 的值</span>
b = <span class="num">20</span>;           <span class="cm">// 修改 b 不影响 a</span>
Console.WriteLine(a);  <span class="cm">// 10（a 不变）</span>
Console.WriteLine(b);  <span class="cm">// 20</span></pre></div>

<h4>引用类型赋值——复制地址</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span>[] arr1 = { <span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span> };
<span class="kw">int</span>[] arr2 = arr1;   <span class="cm">// arr2 和 arr1 指向同一个数组</span>
arr2[<span class="num">0</span>] = <span class="num">99</span>;         <span class="cm">// 修改 arr2 会影响 arr1</span>
Console.WriteLine(arr1[<span class="num">0</span>]);  <span class="cm">// 99（arr1 也变了！）</span></pre></div>

<h4>内存图解</h4>
<div class="highlight-box">
  <strong>栈 (Stack)：</strong>小而快，自动管理。存储值类型数据和方法参数。<br>
  <strong>堆 (Heap)：</strong>大而灵活，由 GC 管理。存储引用类型的实际对象。<br>
  引用类型的变量在栈上存储的是<strong>堆内存的地址</strong>（指针），真正的数据在堆中。
</div>

<h4>结构体和类的区别（面试高频！）</h4>
<table><tr><th>特性</th><th>struct（值类型）</th><th>class（引用类型）</th></tr>
<tr><td>关键字</td><td><code>struct</code></td><td><code>class</code></td></tr>
<tr><td>存储</td><td>栈（或内联在对象中）</td><td>堆</td></tr>
<tr><td>赋值</td><td>复制整个数据</td><td>复制引用</td></tr>
<tr><td>可继承</td><td>不能（密封）</td><td>可以</td></tr>
<tr><td>默认构造</td><td>不能自定义无参构造</td><td>可以</td></tr>
</table>

<div class="highlight-box">⚠️ <strong>关键理解：</strong>两个变量引用了同一个引用类型对象时，通过其中任何一个变量修改对象，另一个也会"看到"修改。这是很多 bug 的根源。</div>
`}

  {id:'basic-6', title:'特殊引用类型string', tags:['string','不可变','内存垃圾'], content:`
<h4>string 的特殊性</h4>
<p>string 是<strong>引用类型</strong>，但它表现出<strong>值类型的特征</strong>。这是因为它具有<strong>不可变性（Immutable）</strong>。</p>

<h4>string 的不可变性验证</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">string</span> s1 = <span class="str">"Hello"</span>;
<span class="kw">string</span> s2 = s1;           <span class="cm">// s2 和 s1 指向同一个 "Hello"</span>
s2 = <span class="str">"World"</span>;            <span class="cm">// s2 指向新的 "World"，s1 不变</span>
Console.WriteLine(s1);    <span class="cm">// "Hello"（s1 不受影响）</span>
Console.WriteLine(s2);    <span class="cm">// "World"</span></pre></div>

<h4>string 修改的本质——产生新字符串</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">string</span> str = <span class="str">"abc"</span>;
str += <span class="str">"def"</span>;  <span class="cm">// 并非修改 "abc"，而是创建新字符串 "abcdef"</span>
<span class="cm">// 旧字符串 "abc" 变成内存垃圾，等待 GC 回收</span>
str = str.Replace(<span class="str">"a"</span>, <span class="str">"x"</span>);  <span class="cm">// 又生成了新字符串</span></pre></div>

<h4>频繁字符串拼接的性能问题</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 低效做法：每次 += 都产生新字符串和内存垃圾</span>
<span class="kw">string</span> result = <span class="str">""</span>;
<span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i &lt; <span class="num">10000</span>; i++)
{
    result += i.ToString();  <span class="cm">// 产生 10000 个中间字符串！</span>
}

<span class="cm">// 高效做法：使用 StringBuilder</span>
System.Text.<span class="type">StringBuilder</span> sb = <span class="kw">new</span> System.Text.<span class="type">StringBuilder</span>();
<span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i &lt; <span class="num">10000</span>; i++)
{
    sb.Append(i);  <span class="cm">// 在内部缓冲区中直接追加，不产生垃圾</span>
}
<span class="kw">string</span> result2 = sb.ToString();</pre></div>

<h4>string 的值特征表现</h4>
<p>尽管 string 是引用类型，但由于不可变性，它"看起来像值类型"：</p>
<ul>
  <li>修改字符串不会影响其他指向原字符串的变量</li>
  <li>字符串常量会自动驻留（Interning），相同内容的字符串可能共享同一内存</li>
</ul>

<h4>字符串驻留验证</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">string</span> a = <span class="str">"Hello"</span>;
<span class="kw">string</span> b = <span class="str">"Hello"</span>;
Console.WriteLine(<span class="kw">object</span>.ReferenceEquals(a, b));  <span class="cm">// True! 驻留</span>

<span class="kw">string</span> c = <span class="kw">new</span> <span class="kw">string</span>(<span class="str">"Hello"</span>.ToCharArray());
Console.WriteLine(<span class="kw">object</span>.ReferenceEquals(a, c));  <span class="cm">// False! 动态创建的不驻留</span></pre></div>

<div class="highlight-box">💡 <strong>最佳实践：</strong>少量拼接用 <code>$</code> 插值或 <code>+</code>；大量拼接（如循环中）务必用 <code>StringBuilder</code>。面试中常考"String 和 StringBuilder 的区别"。</div>
`},

  {id:'basic-7', title:'函数', tags:['方法','参数','返回值','封装'], content:`
<h4>什么是函数（方法）</h4>
<p>函数是一段<strong>可重复使用</strong>的代码块，用于完成特定任务。它接受输入（参数），执行逻辑，并可能返回结果。函数是代码复用的基本单位。</p>

<h4>函数声明语法</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 访问修饰符 返回类型 函数名(参数列表)</span>
<span class="cm">// {</span>
<span class="cm">//     函数体</span>
<span class="cm">//     return 返回值;  // 如果返回类型不是 void</span>
<span class="cm">// }</span>

<span class="kw">static int</span> <span class="fn">Add</span>(<span class="kw">int</span> a, <span class="kw">int</span> b)
{
    <span class="kw">return</span> a + b;
}

<span class="kw">static void</span> <span class="fn">SayHello</span>(<span class="kw">string</span> name)
{
    Console.WriteLine(<span class="str">$"Hello, {name}!"</span>);
}

<span class="kw">static bool</span> <span class="fn">IsEven</span>(<span class="kw">int</span> num)
{
    <span class="kw">return</span> num % <span class="num">2</span> == <span class="num">0</span>;
}</pre></div>

<h4>函数的四大要素</h4>
<table><tr><th>要素</th><th>说明</th><th>示例</th></tr>
<tr><td>返回值类型</td><td>函数返回的数据类型，无返回用 <code>void</code></td><td><code>int</code>, <code>string</code>, <code>void</code></td></tr>
<tr><td>函数名</td><td>见名知意的名字，PascalCase</td><td><code>CalculateScore</code>, <code>GetName</code></td></tr>
<tr><td>参数列表</td><td>接收外部传入的数据（可空）</td><td><code>(int a, string s)</code>, <code>()</code></td></tr>
<tr><td>函数体</td><td>具体执行的代码逻辑</td><td>花括号内的代码</td></tr></table>

<h4>函数调用和返回值接收</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">int</span> sum = <span class="fn">Add</span>(<span class="num">3</span>, <span class="num">5</span>);           <span class="cm">// 接收返回值，sum = 8</span>
<span class="fn">SayHello</span>(<span class="str">"小明"</span>);                <span class="cm">// void 函数，不需要接收返回值</span>

<span class="cm">// return 会立即结束函数</span>
<span class="kw">static int</span> <span class="fn">EarlyReturn</span>(<span class="kw">int</span> x)
{
    <span class="kw">if</span> (x &lt; <span class="num">0</span>)
        <span class="kw">return</span> <span class="num">0</span>;         <span class="cm">// 满足条件时直接返回</span>
    <span class="kw">return</span> x * <span class="num">2</span>;            <span class="cm">// 正常情况</span>
}</pre></div>

<h4>函数的好处</h4>
<ul>
  <li><strong>代码复用：</strong>一次定义，多处调用</li>
  <li><strong>逻辑封装：</strong>隐藏实现细节，只需关心输入和输出</li>
  <li><strong>易于维护：</strong>修改只需改一处</li>
  <li><strong>分而治之：</strong>将大问题拆解为小函数</li>
</ul>

<div class="highlight-box">💡 <strong>设计原则：</strong>一个函数只做一件事（单一职责）。函数应尽量短小（通常不超过 30 行）。好的函数名能让人不看实现就能理解其功能。</div>
`},

  {id:'basic-8', title:'ref和out', tags:['引用传递','输出参数'], content:`
<h4>为什么需要 ref 和 out</h4>
<p>普通的函数参数是<strong>值传递</strong>——函数内修改参数不会影响外部的变量。ref 和 out 可以实现<strong>引用传递</strong>，让函数直接操作外部变量。</p>

<h4>三种参数传递方式对比</h4>
<table><tr><th>方式</th><th>关键词</th><th>传入要求</th><th>传出要求</th><th>用途</th></tr>
<tr><td>值传递</td><td>（无）</td><td>无</td><td>无</td><td>普通参数</td></tr>
<tr><td>引用传递</td><td><code>ref</code></td><td>调用前<strong>必须初始化</strong></td><td>可选（不强制修改）</td><td>需要读写外部变量</td></tr>
<tr><td>输出参数</td><td><code>out</code></td><td>调用前<strong>不需要</strong>初始化</td><td>函数内<strong>必须赋值</strong></td><td>多返回值场景</td></tr></table>

<h4>ref —— 引用传递示例</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">static void</span> <span class="fn">Swap</span>(<span class="kw">ref</span> <span class="kw">int</span> a, <span class="kw">ref</span> <span class="kw">int</span> b)
{
    <span class="kw">int</span> temp = a;
    a = b;
    b = temp;
}

<span class="kw">int</span> x = <span class="num">10</span>, y = <span class="num">20</span>;
<span class="fn">Swap</span>(<span class="kw">ref</span> x, <span class="kw">ref</span> y);  <span class="cm">// 调用时也必须加 ref！</span>
Console.WriteLine(<span class="str">$"x={x}, y={y}"</span>);  <span class="cm">// x=20, y=10</span></pre></div>

<h4>out —— 输出参数示例</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">static bool</span> <span class="fn">TryDivide</span>(<span class="kw">int</span> a, <span class="kw">int</span> b, <span class="kw">out</span> <span class="kw">int</span> result)
{
    result = <span class="num">0</span>;          <span class="cm">// out 参数必须在函数内赋值</span>
    <span class="kw">if</span> (b == <span class="num">0</span>)
        <span class="kw">return</span> <span class="kw">false</span>;   <span class="cm">// 失败</span>
    result = a / b;
    <span class="kw">return</span> <span class="kw">true</span>;        <span class="cm">// 成功</span>
}

<span class="kw">int</span> answer;  <span class="cm">// 使用 out 时可以不初始化</span>
<span class="kw">if</span> (<span class="fn">TryDivide</span>(<span class="num">10</span>, <span class="num">3</span>, <span class="kw">out</span> answer))
    Console.WriteLine(<span class="str">$"结果：{answer}"</span>);  <span class="cm">// 结果：3</span>

<span class="cm">// C# 7.0+ 可以在调用处直接声明 out 变量</span>
<span class="kw">if</span> (<span class="fn">TryDivide</span>(<span class="num">10</span>, <span class="num">2</span>, <span class="kw">out</span> <span class="kw">int</span> result))
    Console.WriteLine(<span class="str">$"结果：{result}"</span>);  <span class="cm">// 结果：5</span></pre></div>

<h4>ref vs out 关键区别</h4>
<ul>
  <li><strong>ref：</strong>"双向奔赴"——外部的值可以传进来，函数也能把值传回去。外部变量必须先初始化。</li>
  <li><strong>out：</strong>"单向输出"——是函数对外输出数据的额外通道。外部变量可以不初始化，但函数内必须赋值。</li>
  <li>两者调用时都<strong>必须显式加关键字</strong>（ref / out），这是 C# 的强制性语法。</li>
</ul>

<div class="highlight-box">💡 <strong>使用场景：</strong>ref 用于需要"修改外部变量"的场景（如 Swap）。out 用于"Try模式"（如 int.TryParse），让函数返回两个值（一个 bool 表示成功与否，一个 out 参数返回实际值）。</div>
`},

  {id:'basic-9', title:'变长参数和参数默认值', tags:['params','可选参数'], content:`
<h4>变长参数 —— params 关键字</h4>
<p>使用 <code>params</code> 关键字可以让函数接受<strong>可变数量的参数</strong>，而不需要提前声明数组。</p>

<h4>params 基本用法</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">static int</span> <span class="fn">Sum</span>(<span class="kw">params</span> <span class="kw">int</span>[] numbers)
{
    <span class="kw">int</span> total = <span class="num">0</span>;
    <span class="kw">foreach</span> (<span class="kw">int</span> n <span class="kw">in</span> numbers)
        total += n;
    <span class="kw">return</span> total;
}

<span class="cm">// 调用时可以传任意数量的参数</span>
<span class="kw">int</span> r1 = <span class="fn">Sum</span>(<span class="num">1</span>, <span class="num">2</span>);              <span class="cm">// 3</span>
<span class="kw">int</span> r2 = <span class="fn">Sum</span>(<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">4</span>, <span class="num">5</span>);     <span class="cm">// 15</span>
<span class="kw">int</span> r3 = <span class="fn">Sum</span>();                       <span class="cm">// 0（可以不传参数）</span>
<span class="kw">int</span> r4 = <span class="fn">Sum</span>(<span class="kw">new</span> <span class="kw">int</span>[] { <span class="num">1</span>, <span class="num">2</span> });   <span class="cm">// 3（也可以直接传数组）</span></pre></div>

<h4>params 的约束</h4>
<ul>
  <li>每个函数<strong>只能有一个</strong> params 参数</li>
  <li>params 参数必须是参数列表中的<strong>最后一个</strong></li>
  <li>params 参数必须是<strong>一维数组</strong>类型</li>
</ul>

<h4>参数默认值（可选参数）</h4>
<p>在声明函数时给参数设置默认值，调用时可以省略该参数。</p>
