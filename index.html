<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">static void</span> <span class="fn">Log</span>(<span class="kw">string</span> message, <span class="kw">int</span> level = <span class="num">0</span>, <span class="kw">bool</span> showTime = <span class="kw">true</span>)
{
    <span class="kw">if</span> (showTime)
        Console.Write(<span class="str">$"[{DateTime.Now}] "</span>);

    <span class="kw">if</span> (level &gt; <span class="num">0</span>)
        Console.Write(<span class="str">$"(错误级别 {level}) "</span>);

    Console.WriteLine(message);
}

<span class="kw">void</span> <span class="fn">Main</span>() {
    <span class="fn">Log</span>(<span class="str">"程序启动"</span>);                      <span class="cm">// 使用所有默认值</span>
    <span class="fn">Log</span>(<span class="str">"发生错误"</span>, <span class="num">2</span>);                   <span class="cm">// level=2, showTime 使用默认值 true</span>
    <span class="fn">Log</span>(<span class="str">"调试信息"</span>, showTime: <span class="kw">false</span>);      <span class="cm">// 使用命名参数跳过中间的 level</span>
}</pre></div>

<h4>可选参数规则</h4>
<ul>
  <li>有默认值的参数必须放在<strong>必填参数的后面</strong></li>
  <li>调用时可以<strong>从左到右</strong>依次省略</li>
  <li>使用<strong>命名参数</strong>可以跳过中间的默认参数</li>
</ul>

<div class="highlight-box">💡 <strong>最佳实践：</strong>params 常用于数学计算（Sum, Max）、日志方法、格式化输出等场景。默认参数让函数更灵活，避免写大量重载。</div>
`},

  {id:'basic-10', title:'函数重载', tags:['重载','多态','参数签名'], content:`
<h4>什么是函数重载</h4>
<p>在同一作用域内，可以有<strong>多个同名函数</strong>，只要它们的<strong>参数类型、数量或顺序不同</strong>。这叫做函数重载（Overload）。</p>

<h4>重载的定义规则</h4>
<table><tr><th>规则</th><th>说明</th></tr>
<tr><td>函数名相同</td><td>重载的函数必须同名</td></tr>
<tr><td>参数不同</td><td>参数的类型、数量或顺序中至少有一项不同</td></tr>
<tr><td>返回值不算</td><td>不能仅靠返回值类型来区分重载</td></tr>
<tr><td>同一作用域</td><td>必须在同一个 class 或 namespace 内</td></tr></table>

<h4>重载示例</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 同名函数，参数类型不同</span>
<span class="kw">static int</span> <span class="fn">Add</span>(<span class="kw">int</span> a, <span class="kw">int</span> b)           { <span class="kw">return</span> a + b; }
<span class="kw">static double</span> <span class="fn">Add</span>(<span class="kw">double</span> a, <span class="kw">double</span> b)  { <span class="kw">return</span> a + b; }
<span class="kw">static string</span> <span class="fn">Add</span>(<span class="kw">string</span> a, <span class="kw">string</span> b) { <span class="kw">return</span> a + b; }

<span class="cm">// 同名函数，参数数量不同</span>
<span class="kw">static int</span> <span class="fn">Max</span>(<span class="kw">int</span> a, <span class="kw">int</span> b)          { <span class="kw">return</span> a &gt; b ? a : b; }
<span class="kw">static int</span> <span class="fn">Max</span>(<span class="kw">int</span> a, <span class="kw">int</span> b, <span class="kw">int</span> c) { <span class="kw">return</span> <span class="fn">Max</span>(<span class="fn">Max</span>(a, b), c); }

<span class="cm">// 调用——编译器自动匹配最合适的版本</span>
Console.WriteLine(<span class="fn">Add</span>(<span class="num">1</span>, <span class="num">2</span>));           <span class="cm">// 3 —— 调用 int 版本</span>
Console.WriteLine(<span class="fn">Add</span>(<span class="num">1.5</span>, <span class="num">2.5</span>));       <span class="cm">// 4.0 —— 调用 double 版本</span>
Console.WriteLine(<span class="fn">Add</span>(<span class="str">"Hello"</span>, <span class="str">"World"</span>)); <span class="cm">// "HelloWorld" —— 调用 string 版本</span></pre></div>

<h4>重载的歧义</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">static void</span> <span class="fn">Test</span>(<span class="kw">int</span> a, <span class="kw">float</span> b) { }
<span class="kw">static void</span> <span class="fn">Test</span>(<span class="kw">float</span> a, <span class="kw">int</span> b) { }

<span class="fn">Test</span>(<span class="num">1</span>, <span class="num">2</span>);  <span class="cm">// 编译报错！歧义——两个版本都能匹配</span>
<span class="cm">// int 可以隐式转换为 float，编译器无法选择</span></pre></div>

<h4>重载 = 编译时多态</h4>
<p>函数重载属于<strong>编译时多态</strong>（也称静态多态）。编译器在编译时就根据参数类型决定调用哪个版本，不涉及运行时判断。</p>

<h4>重载的最佳实践</h4>
<ul>
  <li>提供不同参数的版本提供灵活性（如 Console.WriteLine 有 18+ 个重载）</li>
  <li>重载之间应该逻辑一致，参数多的版本可以调用参数少的版本</li>
  <li>避免制造歧义重载</li>
</ul>

<div class="highlight-box">💡 <strong>面试常考：</strong>重载只看参数签名（类型+数量+顺序），不看返回值。仅返回值类型不同的两个函数<strong>不能</strong>构成重载。</div>
`}

  {id:'basic-11', title:'递归函数', tags:['递归','自调用','终止条件'], content:`
<h4>什么是递归</h4>
<p>递归是函数<strong>自己调用自己</strong>的编程技巧。它可以把一个复杂问题分解为若干个相同形式的子问题。</p>

<h4>递归的两个必要条件</h4>
<ol>
  <li><strong>终止条件（出口）</strong>——没有出口会导致栈溢出（StackOverflow）</li>
  <li><strong>递归公式</strong>——将大问题缩小为小问题的规律</li>
</ol>

<h4>经典示例——计算阶乘</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">static int</span> <span class="fn">Factorial</span>(<span class="kw">int</span> n)
{
    <span class="kw">if</span> (n == <span class="num">0</span> || n == <span class="num">1</span>)  <span class="cm">// 终止条件</span>
        <span class="kw">return</span> <span class="num">1</span>;
    <span class="kw">return</span> n * <span class="fn">Factorial</span>(n - <span class="num">1</span>);  <span class="cm">// 递归公式：n! = n * (n-1)!</span>
}

Console.WriteLine(<span class="fn">Factorial</span>(<span class="num">5</span>));  <span class="cm">// 120
// 执行过程：5 * F(4) = 5 * 4 * F(3) = 5 * 4 * 3 * F(2) = ... = 120</span></pre></div>

<h4>递归的调用过程（以 Factorial(3) 为例）</h4>
<div class="highlight-box">
  <code>F(3)</code> → <code>3 * F(2)</code> → <code>3 * 2 * F(1)</code> → <code>3 * 2 * 1</code> = <code>6</code><br>
  每次递归调用都会开辟新的栈帧，直到命中终止条件后逐层返回。
</div>

<h4>示例——斐波那契数列</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">static int</span> <span class="fn">Fibonacci</span>(<span class="kw">int</span> n)
{
    <span class="kw">if</span> (n == <span class="num">0</span>) <span class="kw">return</span> <span class="num">0</span>;      <span class="cm">// 终止条件1</span>
    <span class="kw">if</span> (n == <span class="num">1</span>) <span class="kw">return</span> <span class="num">1</span>;      <span class="cm">// 终止条件2</span>
    <span class="kw">return</span> <span class="fn">Fibonacci</span>(n - <span class="num">1</span>) + <span class="fn">Fibonacci</span>(n - <span class="num">2</span>);
}
<span class="cm">// Fib(5) = 5  （数列：0, 1, 1, 2, 3, 5）</span></pre></div>

<h4>示例——递归打印目录结构</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">static void</span> <span class="fn">PrintDirectory</span>(<span class="kw">string</span> path, <span class="kw">int</span> depth = <span class="num">0</span>)
{
    Console.WriteLine(<span class="kw">new</span> <span class="kw">string</span>(<span class="str">' '</span>, depth * <span class="num">2</span>) + <span class="str">$"[目录] {Path.GetFileName(path)}"</span>);
    <span class="kw">foreach</span> (<span class="kw">var</span> file <span class="kw">in</span> Directory.GetFiles(path))
        Console.WriteLine(<span class="kw">new</span> <span class="kw">string</span>(<span class="str">' '</span>, (depth+<span class="num">1</span>) * <span class="num">2</span>) + Path.GetFileName(file));
    <span class="kw">foreach</span> (<span class="kw">var</span> dir <span class="kw">in</span> Directory.GetDirectories(path))
        <span class="fn">PrintDirectory</span>(dir, depth + <span class="num">1</span>);  <span class="cm">// 递归调用</span>
}</pre></div>

<h4>递归的优缺点</h4>
<table><tr><th>优点</th><th>缺点</th></tr>
<tr><td>代码简洁优雅</td><td>每次调用消耗栈空间</td></tr>
<tr><td>天然适合树形结构</td><td>深度过大导致栈溢出</td></tr>
<tr><td>思路直观（分治思维）</td><td>可能有大量重复计算（如斐波那契的朴素递归）</td></tr></table>

<div class="highlight-box">⚠️ <strong>注意：</strong>递归必须有明确的终止条件。深度过大（通常 > 10000 层）会导致 StackOverflowException。对于斐波那契等场景，考虑使用循环或记忆化优化。</div>
`},

  {id:'basic-12', title:'结构体', tags:['struct','值类型','构造函数'], content:`
<h4>什么是结构体</h4>
<p>结构体（struct）是一种<strong>自定义的值类型</strong>。它和类（class）很像，但有一些关键区别。struct 适合表示小型、简单的数据集合。</p>

<h4>结构体声明</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// struct 关键字 + 结构体名（PascalCase）</span>
<span class="kw">struct</span> <span class="type">Point</span>
{
    <span class="kw">public</span> <span class="kw">float</span> x;
    <span class="kw">public</span> <span class="kw">float</span> y;

    <span class="cm">// 有参构造函数（必须初始化所有字段）</span>
    <span class="kw">public</span> <span class="fn">Point</span>(<span class="kw">float</span> x, <span class="kw">float</span> y)
    {
        <span class="kw">this</span>.x = x;
        <span class="kw">this</span>.y = y;
    }

    <span class="kw">public</span> <span class="kw">float</span> <span class="fn">Distance</span>(<span class="type">Point</span> other)
    {
        <span class="kw">return</span> MathF.Sqrt((x - other.x) * (x - other.x) + (y - other.y) * (y - other.y));
    }
}</pre></div>

<h4>结构体的使用</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 使用构造函数初始化</span>
<span class="type">Point</span> p1 = <span class="kw">new</span> <span class="type">Point</span>(<span class="num">3f</span>, <span class="num">4f</span>);

<span class="cm">// 如果不使用 new，需要先给所有字段赋值</span>
<span class="type">Point</span> p2;
p2.x = <span class="num">0f</span>;
p2.y = <span class="num">0f</span>;

<span class="cm">// 值类型赋值——复制整个结构体</span>
<span class="type">Point</span> p3 = p1;    <span class="cm">// p3 是 p1 的完整副本</span>
p3.x = <span class="num">10f</span>;       <span class="cm">// 修改 p3 不影响 p1</span>
Console.WriteLine(p1.x);  <span class="cm">// 3（p1 不变——值类型特性）</span></pre></div>

<h4>struct vs class 详细对比</h4>
<table><tr><th>特性</th><th>struct（结构体）</th><th>class（类）</th></tr>
<tr><td>类型分类</td><td>值类型</td><td>引用类型</td></tr>
<tr><td>存储位置</td><td>栈（或内联在对象中）</td><td>堆</td></tr>
<tr><td>赋值行为</td><td>复制整个数据</td><td>复制引用地址</td></tr>
<tr><td>继承</td><td>不能继承（隐式密封）</td><td>可以继承和被继承</td></tr>
<tr><td>无参构造函数</td><td>不能自定义（始终存在默认）</td><td>可以自定义</td></tr>
<tr><td>析构函数</td><td>不能有</td><td>可以有</td></tr>
<tr><td>字段初始化</td><td>不能在声明时初始化字段</td><td>可以在声明时初始化</td></tr>
<tr><td>适用场景</td><td>小而简单的数据载体</td><td>复杂对象、需要继承的场景</td></tr>
</table>

<h4>何时使用 struct？</h4>
<div class="highlight-box">💡 <strong>微软建议：</strong>当满足以下条件时考虑使用 struct：<br>
  1. 逻辑上表示单个值（如坐标、颜色、复数）<br>
  2. 实例大小小于 16 字节<br>
  3. 不可变（immutable）<br>
  4. 不需要频繁装箱<br>
  否则使用 class。典型 struct 例子：<code>DateTime</code>, <code>Point</code>, <code>Color</code>。</div>
`},

  {id:'basic-13', title:'冒泡排序', tags:['排序','交换','优化'], content:`
<h4>什么是冒泡排序</h4>
<p>冒泡排序（Bubble Sort）是一种简单的排序算法。它重复地遍历要排序的数列，一次比较两个元素，如果顺序错误就交换它们。较大的元素会像气泡一样"浮"到数列的顶端。</p>

<h4>核心思路</h4>
<ul>
  <li>比较<strong>相邻</strong>的两个元素</li>
  <li>如果前一个比后一个大，就<strong>交换</strong>它们的位置</li>
  <li>每一轮遍历后，<strong>最大</strong>的元素被移到最后</li>
  <li>经过 N 轮后，整个数组有序</li>
</ul>

<h4>基础实现</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">static void</span> <span class="fn">BubbleSort</span>(<span class="kw">int</span>[] arr)
{
    <span class="kw">int</span> n = arr.Length;
    <span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i &lt; n - <span class="num">1</span>; i++)        <span class="cm">// 外层：需要 n-1 轮</span>
    {
        <span class="kw">for</span> (<span class="kw">int</span> j = <span class="num">0</span>; j &lt; n - <span class="num">1</span> - i; j++)  <span class="cm">// 内层：每轮比较到已排序元素之前</span>
        {
            <span class="kw">if</span> (arr[j] &gt; arr[j + <span class="num">1</span>])
            {
                <span class="cm">// 交换相邻元素</span>
                <span class="kw">int</span> temp = arr[j];
                arr[j] = arr[j + <span class="num">1</span>];
                arr[j + <span class="num">1</span>] = temp;
            }
        }
    }
}</pre></div>

<h4>逐步演示（排序 {5, 3, 8, 1, 4}）</h4>
<table><tr><th>轮次</th><th>内层比较过程</th><th>本轮结果</th></tr>
<tr><td>第1轮</td><td>5&gt;3交换→3,5,8,1,4；5&lt;8不交换；8&gt;1交换→3,5,1,8,4；8&gt;4交换→3,5,1,4,<strong>8</strong></td><td>8归位</td></tr>
<tr><td>第2轮</td><td>3&lt;5不交换；5&gt;1交换→3,1,5,4,8；5&gt;4交换→3,1,4,<strong>5</strong>,8</td><td>5归位</td></tr>
<tr><td>第3轮</td><td>3&gt;1交换→1,3,4,5,8；3&lt;4不交换</td><td>4归位</td></tr>
<tr><td>第4轮</td><td>1&lt;3不交换</td><td>排序完成</td></tr></table>

<h4>优化——提前终止</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">static void</span> <span class="fn">BubbleSortOptimized</span>(<span class="kw">int</span>[] arr)
{
    <span class="kw">int</span> n = arr.Length;
    <span class="kw">bool</span> swapped;
    <span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i &lt; n - <span class="num">1</span>; i++)
    {
        swapped = <span class="kw">false</span>;
        <span class="kw">for</span> (<span class="kw">int</span> j = <span class="num">0</span>; j &lt; n - <span class="num">1</span> - i; j++)
        {
            <span class="kw">if</span> (arr[j] &gt; arr[j + <span class="num">1</span>])
            {
                <span class="kw">int</span> temp = arr[j];
                arr[j] = arr[j + <span class="num">1</span>];
                arr[j + <span class="num">1</span>] = temp;
                swapped = <span class="kw">true</span>;
            }
        }
        <span class="kw">if</span> (!swapped) <span class="kw">break</span>;  <span class="cm">// 没有交换，说明已有序，提前结束</span>
    }
}</pre></div>

<h4>复杂度分析</h4>
<table><tr><th>情况</th><th>时间复杂度</th><th>说明</th></tr>
<tr><td>最坏情况</td><td>O(n²)</td><td>完全逆序</td></tr>
<tr><td>最好情况（优化版）</td><td>O(n)</td><td>已经有序，一轮后发现无交换直接结束</td></tr>
<tr><td>平均情况</td><td>O(n²)</td><td></td></tr>
<tr><td>空间复杂度</td><td>O(1)</td><td>原地排序，只用常数额外空间</td></tr>
<tr><td>稳定性</td><td>稳定</td><td>相等元素不会交换位置</td></tr></table>

<div class="highlight-box">💡 <strong>学习意义：</strong>冒泡排序是入门排序算法的第一课，虽然性能不佳但思路简单清晰。理解它有助于学习更高效的排序算法。实际开发中用 <code>Array.Sort()</code>。</div>
`},

  {id:'basic-14', title:'选择排序', tags:['排序','极值','比较'], content:`
<h4>什么是选择排序</h4>
<p>选择排序（Selection Sort）每次从待排序的数据中选出<strong>最小（或最大）</strong>的元素，放在已排序序列的末尾，直到全部待排序的数据元素排完。</p>

<h4>核心思路</h4>
<ul>
  <li>在未排序序列中找到<strong>最小</strong>的元素</li>
  <li>将其与未排序序列的<strong>第一个</strong>元素交换</li>
  <li>已排序序列扩展一个位置</li>
  <li>重复直到所有元素排序完成</li>
</ul>

<h4>基础实现</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="kw">static void</span> <span class="fn">SelectionSort</span>(<span class="kw">int</span>[] arr)
{
    <span class="kw">int</span> n = arr.Length;
    <span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i &lt; n - <span class="num">1</span>; i++)
    {
        <span class="kw">int</span> minIndex = i;  <span class="cm">// 假设当前位置就是最小值</span>

        <span class="cm">// 在剩余未排序元素中找真正的最小值</span>
        <span class="kw">for</span> (<span class="kw">int</span> j = i + <span class="num">1</span>; j &lt; n; j++)
        {
            <span class="kw">if</span> (arr[j] &lt; arr[minIndex])
                minIndex = j;   <span class="cm">// 记录更小元素的位置</span>
        }

        <span class="cm">// 将最小值交换到前面</span>
        <span class="kw">if</span> (minIndex != i)
        {
            <span class="kw">int</span> temp = arr[i];
            arr[i] = arr[minIndex];
            arr[minIndex] = temp;
        }
    }
}</pre></div>

<h4>逐步演示（排序 {64, 25, 12, 22, 11}）</h4>
<table><tr><th>轮次</th><th>查找过程</th><th>本轮结果</th></tr>
<tr><td>第1轮</td><td>找最小值：64中最小是11(index=4)，交换64和11</td><td><strong>11</strong>, 25, 12, 22, 64</td></tr>
<tr><td>第2轮</td><td>从25开始找：最小是12(index=2)，交换25和12</td><td>11, <strong>12</strong>, 25, 22, 64</td></tr>
<tr><td>第3轮</td><td>从25开始找：最小是22(index=3)，交换25和22</td><td>11, 12, <strong>22</strong>, 25, 64</td></tr>
<tr><td>第4轮</td><td>从25开始找：最小是25，无需交换</td><td>11, 12, 22, <strong>25</strong>, 64</td></tr>
</table>

<h4>冒泡排序 vs 选择排序</h4>
<table><tr><th>特性</th><th>冒泡排序</th><th>选择排序</th></tr>
<tr><td>比较方式</td><td>相邻元素两两比较</td><td>找最值后再交换</td></tr>
<tr><td>交换次数</td><td>最多 O(n²) 次</td><td>最多 O(n) 次</td></tr>
<tr><td>稳定性</td><td>稳定</td><td>不稳定</td></tr>
<tr><td>时间复杂度</td><td>O(n²)</td><td>O(n²)</td></tr>
<tr><td>空间复杂度</td><td>O(1)</td><td>O(1)</td></tr>
<tr><td>适用场景</td><td>教学 + 小数据量</td><td>写操作少时（交换次数少）</td></tr>
</table>

<h4>复杂度分析</h4>
<table><tr><th>情况</th><th>时间复杂度</th><th>说明</th></tr>
<tr><td>最坏情况</td><td>O(n²)</td><td>无论数据如何，都需要比较 n(n-1)/2 次</td></tr>
<tr><td>最好情况</td><td>O(n²)</td><td>即使已有序也要全部比较一遍</td></tr>
<tr><td>空间复杂度</td><td>O(1)</td><td>原地排序</td></tr>
</table>

<h4>选择排序的优缺点</h4>
<ul>
  <li><strong>优点：</strong>交换次数少（每轮最多一次），简单易懂</li>
  <li><strong>缺点：</strong>时间复杂度固定为 O(n²)，即使数据已有序也要全部比较；不稳定</li>
</ul>

<div class="highlight-box">💡 <strong>学习意义：</strong>选择排序和冒泡排序是排序算法入门的"双子星"。选择排序交换次数比冒泡少，但比较次数相同且不稳定。实际开发中优先使用内置的 <code>Array.Sort()</code>（快速排序实现）。</div>`}
  ]
}
,

{id:'core', title:'CSharp核心教学', desc:'深入理解面向对象编程三大特性：封装、继承、多态，掌握C#面向对象开发的全部核心知识。', badge:'核心', lessons:[
  {id:'core-01', title:'类和对象', tags:["class", "对象", "实例化", "面向对象"], content:`<h3>什么是类？什么是对象？</h3>
<p>类（Class）是一种抽象的数据类型，定义了对象的属性和行为——你可以把它看作"蓝图"或"模板"。对象（Object）是类的具体实例——用蓝图盖出来的房子就是对象，同一个蓝图可以盖出很多栋房子。</p>
<h3>定义类与创建对象</h3>
<pre><code><span class="kw">public class</span> <span class="type">Student</span>
{
    <span class="cm">// 字段（成员变量）</span>
    <span class="kw">public string</span> name;
    <span class="kw">public int</span> age;

    <span class="cm">// 方法</span>
    <span class="kw">public void</span> <span class="fn">Introduce</span>()
    {
        <span class="type">Console</span>.WriteLine(<span class="str">"$"我叫{name}，今年{age}岁""</span>);
    }
}

<span class="cm">// 实例化对象（使用 new 关键字）</span>
<span class="type">Student</span> s1 = <span class="kw">new</span> <span class="type">Student</span>();
s1.name = <span class="str">"张三"</span>;
s1.age = <span class="num">20</span>;
s1.Introduce();  <span class="cm">// 输出：我叫张三，今年20岁</span>

<span class="type">Student</span> s2 = <span class="kw">new</span> <span class="type">Student</span>();
s2.name = <span class="str">"李四"</span>;
s2.age = <span class="num">22</span>;
s2.Introduce();  <span class="cm">// 输出：我叫李四，今年22岁</span></code></pre>
<h3>类 vs 对象对比</h3>
<table><tr><th>类（Class）</th><th>对象（Object）</th></tr><tr><td>抽象的数据类型定义</td><td>类的具体实例</td></tr><tr><td>定义一次，存在于代码中</td><td>可创建无数个，存在于内存中</td></tr><tr><td>描述"有什么"和"能做什么"</td><td>真正持有数据和执行行为</td></tr><tr><td>引用类型，分配在堆上</td><td>通过引用变量来访问</td></tr></table>
<div class="tip"><strong>实践建议：</strong>类名使用 Pascal 命名（首字母大写），一个 .cs 文件通常定义一个类。使用 <code>new</code> 关键字在堆上分配内存并调用构造函数。</div>`},
  {id:'core-02', title:'封装——成员变量和访问修饰符', tags:["public", "private", "protected", "成员变量"], content:`<h3>为什么需要封装？</h3>
<p>封装是面向对象的第一根支柱。核心思想："把数据藏起来，只暴露必要的访问方式"。这能防止外部代码直接修改内部状态，保证数据的安全性和一致性。</p>
<h3>访问修饰符（Access Modifiers）</h3>
<table><tr><th>修饰符</th><th>同类内</th><th>子类</th><th>同程序集</th><th>任何地方</th></tr><tr><td><code>public</code></td><td>是</td><td>是</td><td>是</td><td>是</td></tr><tr><td><code>private</code></td><td>是</td><td>否</td><td>否</td><td>否（默认）</td></tr><tr><td><code>protected</code></td><td>是</td><td>是</td><td>否</td><td>否</td></tr><tr><td><code>internal</code></td><td>是</td><td>是（同程序集）</td><td>是</td><td>否</td></tr></table>
<h3>代码示例</h3>
<pre><code><span class="kw">public class</span> <span class="type">BankAccount</span>
{
    <span class="cm">// 私有字段——外部无法直接访问</span>
    <span class="kw">private decimal</span> balance;

    <span class="cm">// 受保护字段——子类可以访问</span>
    <span class="kw">protected string</span> accountHolder;

    <span class="cm">// 公开方法作为安全访问入口</span>
    <span class="kw">public decimal</span> <span class="fn">GetBalance</span>()
    {
        <span class="kw">return</span> balance;
    }

    <span class="kw">public void</span> <span class="fn">Deposit</span>(<span class="kw">decimal</span> amount)
    {
        <span class="kw">if</span> (amount <= <span class="num">0</span>)
            <span class="kw">throw new</span> <span class="type">ArgumentException</span>(<span class="str">"金额必须大于0"</span>);
        balance += amount;
    }
}</code></pre>
<div class="highlight"><strong>重要：</strong>字段通常设为 private，通过 public 方法或属性暴露必要操作。这叫做"信息隐藏"（Information Hiding），是高质量代码的重要特征。</div>`},
  {id:'core-03', title:'封装——成员方法', tags:["方法", "行为", "对象交互"], content:`<h3>成员方法概述</h3>
<p>方法是封装在类中的行为，定义了对象"能做什么"。方法可以接收参数、执行逻辑、返回结果。</p>
<h3>参数传递方式</h3>
<table><tr><th>方式</th><th>关键字</th><th>说明</th></tr><tr><td>值传递</td><td>（默认）</td><td>传递参数的副本，方法内修改不影响原变量</td></tr><tr><td>引用传递</td><td><code>ref</code></td><td>传递变量本身，必须先初始化</td></tr><tr><td>输出传递</td><td><code>out</code></td><td>传递变量本身，可以不预先初始化</td></tr><tr><td>可变参数</td><td><code>params</code></td><td>接收可变数量的参数</td></tr></table>
<pre><code><span class="kw">public void</span> <span class="fn">Swap</span>(<span class="kw">ref int</span> x, <span class="kw">ref int</span> y)
{
    <span class="kw">int</span> temp = x;
    x = y;
    y = temp;
}  <span class="cm">// 使用 ref 实现真正的交换</span>

<span class="kw">public bool</span> <span class="fn">TryParse</span>(<span class="kw">string</span> s, <span class="kw">out int</span> result)
{
    result = <span class="num">0</span>;
    <span class="kw">return int</span>.TryParse(s, <span class="kw">out</span> result);
}  <span class="cm">// out 参数允许多返回值</span>

<span class="kw">public int</span> <span class="fn">Sum</span>(<span class="kw">params int</span>[] numbers)
{
    <span class="kw">int</span> total = <span class="num">0</span>;
    <span class="kw">foreach</span> (<span class="kw">int</span> n <span class="kw">in</span> numbers) total += n;
    <span class="kw">return</span> total;
}
<span class="cm">// 调用：Sum(1,2,3,4,5) → 15</span></code></pre>
<h3>方法重载（Overload）</h3>
<p>同一类中可以定义同名但参数列表不同的多个方法：</p>
<pre><code><span class="kw">public int</span> <span class="fn">Max</span>(<span class="kw">int</span> a, <span class="kw">int</span> b) => a > b ? a : b;
<span class="kw">public double</span> <span class="fn">Max</span>(<span class="kw">double</span> a, <span class="kw">double</span> b) => a > b ? a : b;
<span class="kw">public int</span> <span class="fn">Max</span>(<span class="kw">int</span> a, <span class="kw">int</span> b, <span class="kw">int</span> c) => Max(Max(a,b), c);</code></pre>
<div class="tip"><strong>实践建议：</strong>方法只做一件事，命名用动词开头（Pascal命名）。如果一个方法超过30行，考虑拆分成多个小方法。</div>`},
  {id:'core-04', title:'封装——构造函数和析构函数', tags:["构造", "析构", "GC", "垃圾回收"], content:`<h3>构造函数（Constructor）</h3>
<p>构造函数在对象创建时自动调用，用于初始化对象的成员变量。构造函数名与类名相同，没有返回值类型。</p>
<pre><code><span class="kw">public class</span> <span class="type">Person</span>
{
    <span class="kw">public string</span> name;
    <span class="kw">public int</span> age;

    <span class="cm">// 无参构造函数</span>
    <span class="kw">public</span> <span class="fn">Person</span>()
    {
        name = <span class="str">"未知"</span>;
        age = <span class="num">0</span>;
    }

    <span class="cm">// 有参构造函数（重载）</span>
    <span class="kw">public</span> <span class="fn">Person</span>(<span class="kw">string</span> name, <span class="kw">int</span> age)
    {
        <span class="kw">this</span>.name = name;
        <span class="kw">this</span>.age = age;
    }
}

<span class="cm">// 使用</span>
<span class="type">Person</span> p1 = <span class="kw">new</span> <span class="type">Person</span>();              <span class="cm">// 无参构造</span>
<span class="type">Person</span> p2 = <span class="kw">new</span> <span class="type">Person</span>(<span class="str">"张三"</span>, <span class="num">25</span>);    <span class="cm">// 有参构造</span></code></pre>
<div class="highlight"><strong>重要：</strong>如果不写任何构造函数，编译器会生成一个默认无参构造函数。一旦写了任何一个构造函数，默认无参构造函数就不会被生成。</div>
<h3>析构函数（Finalizer）</h3>
<p>析构函数在对象被垃圾回收（GC）时调用，用于释放非托管资源：</p>
<pre><code><span class="kw">public class</span> <span class="type">ResourceHolder</span>
{
    <span class="cm">// 析构函数：类名前加 ~</span>
    ~<span class="fn">ResourceHolder</span>()
    {
        <span class="cm">// 释放非托管资源（文件句柄、数据库连接等）</span>
        <span class="type">Console</span>.WriteLine(<span class="str">"对象被回收"</span>);
    }
}</code></pre>
<table><tr><th>特性</th><th>构造函数</th><th>析构函数</th></tr><tr><td>调用时机</td><td>对象创建时（<span class="kw">new</span>）</td><td>对象销毁前（GC触发）</td></tr><tr><td>调用次数</td><td>每个对象一次</td><td>每个对象一次（不确定时机）</td></tr><tr><td>参数</td><td>可以有参数</td><td>不能有参数</td></tr><tr><td>重载</td><td>支持重载</td><td>不支持</td></tr></table>
<div class="tip"><strong>实践建议：</strong>优先使用 <code>IDisposable</code> 接口和 <code>using</code> 语句来管理资源，析构函数仅作为最后的"安全网"。</div>`},
  {id:'core-05', title:'成员属性', tags:["get", "set", "value", "自动属性"], content:`<h3>为什么需要属性？</h3>
<p>属性（Property）是字段的高级封装——它看起来像字段，用起来像字段，但背后是方法。属性提供了对私有字段的安全访问，并可在 get/set 中加入验证逻辑。</p>
<h3>基本语法</h3>
<pre><code><span class="kw">public class</span> <span class="type">Student</span>
{
    <span class="kw">private int</span> _age;

    <span class="cm">// 完整属性（带验证逻辑）</span>
    <span class="kw">public int</span> Age
    {
        <span class="kw">get</span> { <span class="kw">return</span> _age; }
        <span class="kw">set</span>
        {
            <span class="kw">if</span> (<span class="kw">value</span> < <span class="num">0</span> || <span class="kw">value</span> > <span class="num">150</span>)
                <span class="kw">throw new</span> <span class="type">ArgumentOutOfRangeException</span>();
            _age = <span class="kw">value</span>;
        }
    }
}

<span class="cm">// 使用——像字段一样自然</span>
<span class="type">Student</span> s = <span class="kw">new</span> <span class="type">Student</span>();
s.Age = <span class="num">20</span>;        <span class="cm">// 调用 set 访问器</span>
<span class="type">Console</span>.WriteLine(s.Age);  <span class="cm">// 调用 get 访问器</span></code></pre>
<h3>自动属性（Auto-Property）</h3>
<pre><code><span class="kw">public string</span> Name { <span class="kw">get</span>; <span class="kw">set</span>; }               <span class="cm">// 可读可写</span>
<span class="kw">public string</span> Id { <span class="kw">get</span>; <span class="kw">private set</span>; }        <span class="cm">// 外部只读</span>
<span class="kw">public string</span> School { <span class="kw">get</span>; } = <span class="str">"默认学校"</span>;   <span class="cm">// 只读 + 默认值 (C# 6+)</span></code></pre>
<h3>表达式体属性（C# 6+）</h3>
<pre><code><span class="kw">public class</span> <span class="type">Circle</span>
{
    <span class="kw">public double</span> Radius { <span class="kw">get</span>; <span class="kw">set</span>; }
    <span class="kw">public double</span> Area => <span class="type">Math</span>.PI * Radius * Radius;
    <span class="kw">public double</span> Perimeter => <span class="num">2</span> * <span class="type">Math</span>.PI * Radius;
}</code></pre>
<table><tr><th>对比</th><th>字段</th><th>属性</th></tr><tr><td>本质</td><td>存储数据的内存位置</td><td>一对 get/set 方法的语法糖</td></tr><tr><td>验证逻辑</td><td>无法附加验证</td><td>可在 set 中加入验证</td></tr><tr><td>数据绑定</td><td>不支持</td><td>大多数框架要求属性</td></tr><tr><td>反射</td><td>FieldInfo</td><td>PropertyInfo</td></tr></table>
<div class="tip"><strong>实践建议：</strong>永远将字段设为 <code>private</code>，通过属性暴露。这是封装的核心体现。在 C# 中，属性几乎是访问数据的唯一推荐方式。</div>`},
  {id:'core-06', title:'封装——索引器', tags:["this[]", "索引访问"], content:`<h3>什么是索引器？</h3>
<p>索引器（Indexer）让对象可以像数组一样通过 [] 来访问内部数据。它本质上是一个带参数的属性，使用 this 关键字定义。</p>
<h3>基本语法</h3>
<pre><code><span class="kw">public class</span> <span class="type">StudentList</span>
{
    <span class="kw">private string</span>[] names = <span class="kw">new string</span>[<span class="num">100</span>];

    <span class="cm">// 索引器：通过整数索引访问</span>
    <span class="kw">public string this</span>[<span class="kw">int</span> index]
    {
        <span class="kw">get</span>
        {
            <span class="kw">if</span> (index < <span class="num">0</span> || index >= names.Length)
                <span class="kw">throw new</span> <span class="type">IndexOutOfRangeException</span>();
            <span class="kw">return</span> names[index];
        }
        <span class="kw">set</span>
        {
            <span class="kw">if</span> (index < <span class="num">0</span> || index >= names.Length)
                <span class="kw">throw new</span> <span class="type">IndexOutOfRangeException</span>();
            names[index] = <span class="kw">value</span>;
        }
    }
}

<span class="cm">// 使用</span>
<span class="type">StudentList</span> list = <span class="kw">new</span> <span class="type">StudentList</span>();
list[<span class="num">0</span>] = <span class="str">"张三"</span>;              <span class="cm">// 调用 set</span>
<span class="type">Console</span>.WriteLine(list[<span class="num">0</span>]);  <span class="cm">// 调用 get → 张三</span></code></pre>
<h3>多参数索引器</h3>
<pre><code><span class="kw">public class</span> <span class="type">Grid</span>
{
    <span class="kw">private int</span>[,] cells = <span class="kw">new int</span>[<span class="num">10</span>, <span class="num">10</span>];
    <span class="kw">public int this</span>[<span class="kw">int</span> row, <span class="kw">int</span> col]
    {
        <span class="kw">get</span> => cells[row, col];
        <span class="kw">set</span> => cells[row, col] = <span class="kw">value</span>;
    }
}
<span class="type">Grid</span> g = <span class="kw">new</span> <span class="type">Grid</span>();
g[<span class="num">2</span>, <span class="num">3</span>] = <span class="num">42</span>;  <span class="cm">// 像二维数组一样访问</span></code></pre>
<h3>字符串索引</h3>
<pre><code><span class="kw">public class</span> <span class="type">Config</span>
{
    <span class="kw">private</span> Dictionary<<span class="kw">string</span>, <span class="kw">string</span>> data = <span class="kw">new</span>();
    <span class="kw">public string this</span>[<span class="kw">string</span> key]
    {
        <span class="kw">get</span> => data.ContainsKey(key) ? data[key] : <span class="kw">null</span>;
        <span class="kw">set</span> => data[key] = <span class="kw">value</span>;
    }
}
<span class="type">Config</span> cfg = <span class="kw">new</span> <span class="type">Config</span>();
cfg[<span class="str">"Server"</span>] = <span class="str">"localhost"</span>;
cfg[<span class="str">"Port"</span>]   = <span class="str">"8080"</span>;</code></pre>
<div class="tip"><strong>实践建议：</strong>索引器适用于封装内部集合的场景（自定义列表、字典、矩阵等），让API更加直观自然。注意与属性的区别：属性有名称，索引器用 this 关键字。</div>`},
  {id:'core-07', title:'封装——静态成员', tags:["static", "全局", "共享"], content:`<h3>什么是静态成员？</h3>
<p>static 关键字修饰的成员属于类本身，而不是属于某个实例。所有实例共享同一份静态数据。</p>
<pre><code><span class="kw">public class</span> <span class="type">Player</span>
{
    <span class="cm">// 静态字段——所有Player共享</span>
    <span class="kw">public static int</span> totalPlayers;

    <span class="cm">// 实例字段——每个Player各有一份</span>
    <span class="kw">public string</span> playerName;

    <span class="kw">public</span> <span class="fn">Player</span>(<span class="kw">string</span> name)
    {
        playerName = name;
        totalPlayers++;  <span class="cm">// 每创建一个就+1</span>
    }

    <span class="cm">// 静态方法——只能访问静态成员</span>
    <span class="kw">public static void</span> <span class="fn">ShowTotal</span>()
    {
        <span class="type">Console</span>.WriteLine(<span class="str">"$"当前玩家总数：{totalPlayers}""</span>);
    }
}

<span class="type">Player</span> p1 = <span class="kw">new</span> <span class="type">Player</span>(<span class="str">"小红"</span>);
<span class="type">Player</span> p2 = <span class="kw">new</span> <span class="type">Player</span>(<span class="str">"小明"</span>);
<span class="type">Player</span>.ShowTotal();  <span class="cm">// 输出：当前玩家总数：2</span></code></pre>
<table><tr><th>对比</th><th>实例成员</th><th>静态成员</th></tr><tr><td>归属</td><td>属于对象（实例）</td><td>属于类本身</td></tr><tr><td>调用方式</td><td><code>obj.Method()</code></td><td><code>Class.Method()</code></td></tr><tr><td>存储位置</td><td>每个对象一份（堆上）</td><td>全局一份（静态区）</td></tr><tr><td>生命周期</td><td>随对象创建/销毁</td><td>程序启动到结束</td></tr></table>
<div class="highlight"><strong>重要：</strong>静态方法中不能使用 <code>this</code> 关键字（因为没有实例），也不能直接调用实例成员。</div>
<div class="tip"><strong>实践建议：</strong>典型应用：工具类（Math、Console）、单例模式、全局计数器、配置管理。多线程同时修改静态字段需要加锁。</div>`},
  {id:'core-08', title:'封装——静态类和静态构造函数', tags:["静态类", "工具类", "单例初始化"], content:`<h3>静态类（Static Class）</h3>
<p>当一个类的所有成员都是静态的，且不需要实例化时，可以将其声明为静态类。</p>
<pre><code><span class="kw">public static class</span> <span class="type">MathHelper</span>
{
    <span class="kw">public const double</span> PI = <span class="num">3.14159265358979</span>;

    <span class="kw">public static double</span> <span class="fn">Square</span>(<span class="kw">double</span> x) => x * x;

    <span class="kw">public static double</span> <span class="fn">Clamp</span>(<span class="kw">double</span> val, <span class="kw">double</span> min, <span class="kw">double</span> max)
        => <span class="type">Math</span>.Max(min, <span class="type">Math</span>.Min(val, max));
}

<span class="cm">// 使用——直接用类名调用</span>
<span class="kw">double</span> result = <span class="type">MathHelper</span>.Square(<span class="num">5</span>);  <span class="cm">// 25</span></code></pre>
<h3>静态类的限制</h3>
<ul><li>不能使用 new 关键字实例化</li><li>所有成员必须是 static</li><li>不能包含实例构造函数</li><li>不能被继承（隐含 sealed）</li><li>不能实现接口</li></ul>
<h3>静态构造函数</h3>
<pre><code><span class="kw">public class</span> <span class="type">DatabaseManager</span>
{
    <span class="kw">public static string</span> ConnectionString;

    <span class="cm">// 静态构造函数：无参数、无访问修饰符、最多执行一次</span>
    <span class="kw">static</span> <span class="fn">DatabaseManager</span>()
    {
        <span class="type">Console</span>.WriteLine(<span class="str">"初始化数据库连接..."</span>);
        ConnectionString = <span class="str">"Server=localhost;Database=MyDB;"</span>;
    }

    <span class="kw">public static void</span> <span class="fn">Connect</span>()
    {
        <span class="type">Console</span>.WriteLine(<span class="str">"$"连接到：{ConnectionString}""</span>);
    }
}

<span class="cm">// 首次访问该类时，静态构造函数自动执行（且只执行一次）</span>
<span class="type">DatabaseManager</span>.Connect();
<span class="cm">// 输出：初始化数据库连接... → 连接到：Server=localhost;Database=MyDB;</span></code></pre>
<div class="highlight"><strong>重要：</strong>静态构造函数在第一次使用该类时自动执行且只执行一次，CLR保证线程安全。执行时机：(1)创建第一个实例 (2)访问任何静态成员。</div>
<div class="tip"><strong>实践建议：</strong>工具/辅助类（Math, File, Convert）、扩展方法容器、常量定义、全局配置管理都应使用静态类。</div>`},
  {id:'core-09', title:'封装——拓展方法', tags:["this参数", "扩展", "静态类"], content:`<h3>什么是拓展方法？</h3>
<p>拓展方法（Extension Method）可以在不修改原始类型、不创建子类的情况下，为已有类型添加新方法。它是 C# 中实现"开放-封闭原则"的有力工具。</p>
<pre><code><span class="cm">// 必须定义在静态类中</span>
<span class="kw">public static class</span> <span class="type">StringExtensions</span>
{
    <span class="cm">// 第一个参数用 this 标记——表示"为谁扩展"</span>
    <span class="kw">public static bool</span> <span class="fn">IsNullOrEmpty</span>(<span class="kw">this string</span> str)
    {
        <span class="kw">return string</span>.IsNullOrEmpty(str);
    }

    <span class="kw">public static string</span> <span class="fn">Reverse</span>(<span class="kw">this string</span> str)
    {
        <span class="kw">char</span>[] arr = str.ToCharArray();
        <span class="type">Array</span>.Reverse(arr);
        <span class="kw">return new string</span>(arr);
    }
}

<span class="cm">// 使用——像实例方法一样调用</span>
<span class="kw">string</span> s = <span class="str">"Hello World"</span>;
<span class="kw">string</span> rev = s.Reverse();  <span class="cm">// dlroW olleH</span></code></pre>
<h3>LINQ 就是拓展方法的杰作</h3>
<pre><code><span class="kw">var</span> numbers = <span class="kw">new</span> <span class="type">List</span><<span class="kw">int</span>> { <span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">4</span>, <span class="num">5</span> };
<span class="cm">// Where, Select, OrderBy 都是拓展方法</span>
<span class="kw">var</span> result = numbers
    .Where(n => n > <span class="num">2</span>)
    .Select(n => n * <span class="num">10</span>)
    .OrderByDescending(n => n);
<span class="cm">// result = [50, 40, 30]</span></code></pre>
<div class="tip"><strong>实践建议：</strong>扩展方法放在以 Extensions 结尾的静态类中。不要滥用——只为真正需要"扩展"的场景使用。实例方法优先于扩展方法。</div>`},
  {id:'core-10', title:'封装——运算符重载', tags:["operator", "自定义运算"], content:`<h3>什么是运算符重载？</h3>
<p>运算符重载（Operator Overloading）让你为自定义类型定义运算符行为。比如让两个 Vector 对象可以用 + 相加。</p>
<table><tr><th>类别</th><th>运算符</th></tr><tr><td>算术</td><td><code>+ - * / %</code></td></tr><tr><td>比较</td><td><code>== != &lt; &gt; &lt;= &gt;=</code></td></tr><tr><td>递增/递减</td><td><code>++ --</code></td></tr><tr><td>转换</td><td><code>implicit explicit</code></td></tr></table>
<pre><code><span class="kw">public struct</span> <span class="type">Vector2</span>
{
    <span class="kw">public double</span> X, Y;
    <span class="kw">public</span> <span class="fn">Vector2</span>(<span class="kw">double</span> x, <span class="kw">double</span> y) { X = x; Y = y; }

    <span class="cm">// 重载加法</span>
    <span class="kw">public static</span> <span class="type">Vector2</span> <span class="kw">operator</span> +(<span class="type">Vector2</span> a, <span class="type">Vector2</span> b)
        => <span class="kw">new</span> <span class="type">Vector2</span>(a.X + b.X, a.Y + b.Y);

    <span class="cm">// 重载减法</span>
    <span class="kw">public static</span> <span class="type">Vector2</span> <span class="kw">operator</span> -(<span class="type">Vector2</span> a, <span class="type">Vector2</span> b)
        => <span class="kw">new</span> <span class="type">Vector2</span>(a.X - b.X, a.Y - b.Y);

    <span class="cm">// 重载标量乘法</span>
    <span class="kw">public static</span> <span class="type">Vector2</span> <span class="kw">operator</span> *(<span class="type">Vector2</span> v, <span class="kw">double</span> s)
        => <span class="kw">new</span> <span class="type">Vector2</span>(v.X * s, v.Y * s);

    <span class="cm">// 重载 == 和 != （必须成对出现）</span>
    <span class="kw">public static bool operator</span> ==(<span class="type">Vector2</span> a, <span class="type">Vector2</span> b)
        => a.X == b.X && a.Y == b.Y;
    <span class="kw">public static bool operator</span> !=(<span class="type">Vector2</span> a, <span class="type">Vector2</span> b)
        => !(a == b);
}

<span class="cm">// 使用</span>
<span class="type">Vector2</span> v1 = <span class="kw">new</span> <span class="type">Vector2</span>(<span class="num">1</span>, <span class="num">2</span>);
<span class="type">Vector2</span> v2 = <span class="kw">new</span> <span class="type">Vector2</span>(<span class="num">3</span>, <span class="num">4</span>);
<span class="type">Vector2</span> v3 = v1 + v2;  <span class="cm">// (4, 6)</span>
<span class="type">Vector2</span> v4 = v3 * <span class="num">2</span>;  <span class="cm">// (8, 12)</span></code></pre>
<div class="highlight"><strong>重要：</strong>重载的运算符必须是 <code>public static</code>。比较运算符（== !=、< >）必须成对重载。重载了 == 时，也应该重写 Equals() 和 GetHashCode()。</div>
<div class="tip"><strong>实践建议：</strong>仅为"数学/数值"类型的自定义结构或类重载运算符（如向量、矩阵、复数、金额），不要滥用——可读性比简洁更重要。</div>`},
  {id:'core-11', title:'封装——内部类和分部类', tags:["嵌套类", "partial"], content:`<h3>内部类（嵌套类）</h3>
<p>内部类（Nested Class）是定义在另一个类内部的类，通常用于辅助外部类，对外部世界隐藏实现细节。</p>
<pre><code><span class="kw">public class</span> <span class="type">BinaryTree</span>
{
    <span class="cm">// 内部类——树的节点，外界不需要知道</span>
    <span class="kw">private class</span> <span class="type">Node</span>
    {
        <span class="kw">public int</span> value;
        <span class="kw">public</span> <span class="type">Node</span> left, right;
        <span class="kw">public</span> <span class="fn">Node</span>(<span class="kw">int</span> val) { value = val; }
    }

    <span class="kw">private</span> <span class="type">Node</span> root;

    <span class="kw">public void</span> <span class="fn">Insert</span>(<span class="kw">int</span> value)
    {
        root = InsertRec(root, value);
    }

    <span class="kw">private</span> <span class="type">Node</span> <span class="fn">InsertRec</span>(<span class="type">Node</span> node, <span class="kw">int</span> value)
    {
        <span class="kw">if</span> (node == <span class="kw">null</span>)
            <span class="kw">return new</span> <span class="type">Node</span>(value);
        <span class="kw">if</span> (value < node.value)
            node.left = InsertRec(node.left, value);
        <span class="kw">else</span>
            node.right = InsertRec(node.right, value);
        <span class="kw">return</span> node;
    }
}</code></pre>
<h3>分部类（Partial Class）</h3>
<p>partial 关键字允许将同一个类的定义分散在多个文件中，编译器会将它们合并。</p>
<pre><code><span class="cm">// 文件1：Person.Data.cs</span>
<span class="kw">public partial class</span> <span class="type">Person</span>
{
    <span class="kw">public string</span> Name { <span class="kw">get</span>; <span class="kw">set</span>; }
    <span class="kw">public int</span> Age { <span class="kw">get</span>; <span class="kw">set</span>; }
}

<span class="cm">// 文件2：Person.Methods.cs</span>
<span class="kw">public partial class</span> <span class="type">Person</span>
{
    <span class="kw">public void</span> <span class="fn">Introduce</span>()
    {
        <span class="type">Console</span>.WriteLine(<span class="str">"$"我是{Name}，{Age}岁""</span>);
    }
}</code></pre>
<table><tr><th>应用场景</th><th>说明</th></tr><tr><td>代码生成</td><td>自动生成的代码与手写代码分离（WinForms、EF Core）</td></tr><tr><td>大型类</td><td>将一个大型类按功能拆分成多个文件</td></tr><tr><td>团队协作</td><td>多人同时编辑同一类的不同部分，减少合并冲突</td></tr><tr><td>接口实现</td><td>把不同接口的实现放在不同文件中</td></tr></table>
<div class="tip"><strong>实践建议：</strong>分部类的所有部分必须在同一个程序集中。访问修饰符、基类、接口实现只需在其中一个部分声明即可。</div>`},
  {id:'core-12', title:'继承——继承的基本规则', tags:["单根性", "传递性", "base"], content:`<h3>什么是继承？</h3>
<p>继承是面向对象的第二根支柱。子类（派生类）可以复用父类（基类）的成员，并添加自己的新成员或重写父类的行为。</p>
<h3>继承的两大特性</h3>
<table><tr><th>特性</th><th>说明</th></tr><tr><td>单根性</td><td>一个类只能有一个直接父类（不支持多继承，但可通过接口弥补）</td></tr><tr><td>传递性</td><td>子类继承父类，父类继承祖父类……形成一条继承链</td></tr></table>
<pre><code><span class="cm">// 基类（父类）</span>
<span class="kw">public class</span> <span class="type">Animal</span>
{
    <span class="kw">public string</span> Name { <span class="kw">get</span>; <span class="kw">set</span>; }
    <span class="kw">public void</span> <span class="fn">Eat</span>()
    {
        <span class="type">Console</span>.WriteLine(<span class="str">"$"{Name} 在吃东西""</span>);
    }
}

<span class="cm">// 派生类（子类）——用 : 表示继承</span>
<span class="kw">public class</span> <span class="type">Dog</span> : <span class="type">Animal</span>
{
    <span class="kw">public void</span> <span class="fn">Bark</span>()
    {
        <span class="type">Console</span>.WriteLine(<span class="str">"$"{Name} 汪汪叫""</span>);
    }
}

<span class="cm">// 使用</span>
<span class="type">Dog</span> dog = <span class="kw">new</span> <span class="type">Dog</span>();
dog.Name = <span class="str">"旺财"</span>;
dog.Eat();    <span class="cm">// 继承自Animal的方法</span>
dog.Bark();   <span class="cm">// Dog自己的方法</span></code></pre>
<h3>base 关键字</h3>
<p>base 代表父类的引用，用于在子类中显式调用父类的成员。</p>
<pre><code><span class="kw">public class</span> <span class="type">Dog</span> : <span class="type">Animal</span>
{
    <span class="kw">public new void</span> <span class="fn">Eat</span>()  <span class="cm">// new 表示隐藏父类方法</span>
    {
        <span class="kw">base</span>.Eat();         <span class="cm">// 先调用父类的Eat</span>
        <span class="type">Console</span>.WriteLine(<span class="str">"吃的是狗粮"</span>);
    }
}</code></pre>
<h3>访问修饰符在继承中的表现</h3>
<ul><li><code>public</code> — 子类可以访问，外部也可以访问</li><li><code>protected</code> — 子类内部可以访问，外部不能访问</li><li><code>private</code> — 子类无法访问（但被继承下来了，只是不可见）</li></ul>
<div class="highlight"><strong>重要：</strong>C# 不支持多继承（一个类继承多个父类），但支持多层继承（继承链）和多接口实现。所有类最终都继承自 <code>System.Object</code>。</div>`},
  {id:'core-13', title:'继承——里氏替换原则', tags:["父类容器", "is", "as"], content:`<h3>里氏替换原则（LSP）</h3>
<p>面向对象设计的基石之一："任何基类出现的地方，子类一定可以出现"。通俗地说：子类必须能够完全替代父类。</p>
<pre><code><span class="kw">public class</span> <span class="type">Animal</span>
{
    <span class="kw">public virtual void</span> <span class="fn">Speak</span>()
        => <span class="type">Console</span>.WriteLine(<span class="str">"动物发出声音"</span>);
}

<span class="kw">public class</span> <span class="type">Dog</span> : <span class="type">Animal</span>
{
    <span class="kw">public override void</span> <span class="fn">Speak</span>()
        => <span class="type">Console</span>.WriteLine(<span class="str">"汪汪汪"</span>);
}

<span class="kw">public class</span> <span class="type">Cat</span> : <span class="type">Animal</span>
{
    <span class="kw">public override void</span> <span class="fn">Speak</span>()
        => <span class="type">Console</span>.WriteLine(<span class="str">"喵喵喵"</span>);
}

<span class="cm">// 父类数组可以装各种子类对象——多态！</span>
<span class="type">Animal</span>[] animals = { <span class="kw">new</span> <span class="type">Dog</span>(), <span class="kw">new</span> <span class="type">Cat</span>(), <span class="kw">new</span> <span class="type">Dog</span>() };
<span class="kw">foreach</span> (<span class="type">Animal</span> a <span class="kw">in</span> animals)
{
    a.Speak();  <span class="cm">// 多态调用——实际执行子类方法</span>
}
<span class="cm">// 输出：汪汪汪  喵喵喵  汪汪汪</span></code></pre>
<h3>is 和 as 关键字</h3>
<pre><code><span class="type">Animal</span> animal = <span class="kw">new</span> <span class="type">Dog</span>();

<span class="cm">// is：类型检查（返回 bool）</span>
<span class="kw">if</span> (animal <span class="kw">is</span> <span class="type">Dog</span>)
    <span class="type">Console</span>.WriteLine(<span class="str">"这是一只狗"</span>);

<span class="cm">// is + 模式匹配（C# 7.0+，一步完成检查+转换）</span>
<span class="kw">if</span> (animal <span class="kw">is</span> <span class="type">Dog</span> dog)
    dog.Bark();

<span class="cm">// as：尝试转换，失败返回 null（不会抛异常）</span>
<span class="type">Dog</span> d = animal <span class="kw">as</span> <span class="type">Dog</span>;
<span class="kw">if</span> (d != <span class="kw">null</span>)
    d.Bark();

<span class="cm">// 强制转换：失败会抛 InvalidCastException</span>
<span class="type">Dog</span> d2 = (<span class="type">Dog</span>)animal;</code></pre>
<div class="highlight"><strong>重要：</strong><code>is</code> 只做类型检查，<code>as</code> 做类型转换且失败返回null。对于引用类型优先使用 as + null检查；对于值类型使用 is 模式匹配。</div>
<div class="tip"><strong>实践建议：</strong>如果代码中大量使用 is/as 来判断子类类型，可能意味着多态设计不够好——理想情况下应通过虚方法让子类自己表现得不同。</div>`},
  {id:'core-14', title:'继承——继承中的构造函数', tags:["base调用", "构造顺序"], content:`<h3>构造函数的执行顺序</h3>
<p>创建子类对象时，构造函数的执行顺序是：先调用父类构造函数，再调用子类构造函数。这保证了子类可以安全地使用继承来的成员。</p>
<h3>使用 base 调用父类构造</h3>
<pre><code><span class="kw">public class</span> <span class="type">Animal</span>
{
    <span class="kw">public string</span> Name;
    <span class="kw">public</span> <span class="fn">Animal</span>(<span class="kw">string</span> name)
    {
        Name = name;
        <span class="type">Console</span>.WriteLine(<span class="str">"$"Animal 构造：{Name}""</span>);
    }
}

<span class="kw">public class</span> <span class="type">Dog</span> : <span class="type">Animal</span>
{
    <span class="kw">public int</span> Age;
    <span class="cm">// 通过 base 调用父类的有参构造函数</span>
    <span class="kw">public</span> <span class="fn">Dog</span>(<span class="kw">string</span> name, <span class="kw">int</span> age) : <span class="kw">base</span>(name)
    {
        Age = age;
        <span class="type">Console</span>.WriteLine(<span class="str">"$"Dog 构造：{Age}岁""</span>);
    }
}

<span class="cm">// 创建对象</span>
<span class="type">Dog</span> dog = <span class="kw">new</span> <span class="type">Dog</span>(<span class="str">"旺财"</span>, <span class="num">3</span>);
<span class="cm">// 输出：Animal 构造：旺财 → Dog 构造：3岁</span></code></pre>
<h3>this 构造调用链（同类内重定向）</h3>
<pre><code><span class="kw">public class</span> <span class="type">Person</span>
{
    <span class="kw">public string</span> Name;
    <span class="kw">public int</span> Age;

    <span class="kw">public</span> <span class="fn">Person</span>(<span class="kw">string</span> name) { Name = name; }
    <span class="kw">public</span> <span class="fn">Person</span>(<span class="kw">string</span> name, <span class="kw">int</span> age) : <span class="kw">this</span>(name)
    {
        Age = age;  <span class="cm">// 先执行 this(name) 再执行这里</span>
    }
}</code></pre>
<div class="highlight"><strong>重要：</strong>创建子类对象时完整执行流程：(1)子类静态初始化 (2)父类静态初始化 (3)父类实例字段初始化 (4)父类构造函数 (5)子类实例字段初始化 (6)子类构造函数。注意：如果父类没有无参构造，子类必须显式调用 <code>base(...)</code>。</div>`},
  {id:'core-15', title:'万物之父和装箱拆箱', tags:["object", "装箱", "拆箱", "性能"], content:`<h3>万物之父——Object</h3>
<p>在 C# 中，所有类型最终都继承自 System.Object。因此任何类型的对象都可以用 object 变量来引用。</p>
<pre><code><span class="cm">// object 可以装任何东西</span>
<span class="kw">object</span> o1 = <span class="num">42</span>;                  <span class="cm">// int</span>
<span class="kw">object</span> o2 = <span class="str">"Hello"</span>;             <span class="cm">// string</span>
<span class="kw">object</span> o3 = <span class="kw">new</span> <span class="type">Dog</span>();          <span class="cm">// 自定义类</span>
<span class="kw">object</span> o4 = <span class="kw">true</span>;               <span class="cm">// bool</span></code></pre>
<h3>装箱（Boxing）</h3>
<p>装箱是把值类型转换为引用类型的过程。CLR会在堆上分配一块内存，把值类型的值复制过去，返回一个指向该内存的引用。</p>
<pre><code><span class="kw">int</span> num = <span class="num">42</span>;             <span class="cm">// 值类型在栈上</span>
<span class="kw">object</span> obj = num;          <span class="cm">// 装箱：栈上的值被复制到堆上</span></code></pre>
<h3>拆箱（Unboxing）</h3>
<p>拆箱是把引用类型（被装箱的值类型）转换回值类型。拆箱到错误类型会抛出InvalidCastException。</p>
<pre><code><span class="kw">object</span> obj = <span class="num">42</span>;          <span class="cm">// 先装箱</span>
<span class="kw">int</span> num = (<span class="kw">int</span>)obj;        <span class="cm">// 拆箱：必须显式转换为原类型</span>

<span class="cm">// 拆箱到错误类型会抛出 InvalidCastException</span>
<span class="kw">object</span> obj2 = <span class="num">3.14</span>;
<span class="cm">// int x = (int)obj2;       // 运行时错误！</span>
<span class="kw">int</span> y = (<span class="kw">int</span>)(<span class="kw">double</span>)obj2; <span class="cm">// 正确：先拆箱为原类型，再转换</span></code></pre>
<h3>装箱拆箱的性能代价</h3>
<table><tr><th>操作</th><th>性能代价</th></tr><tr><td>装箱</td><td>在堆上分配内存 + 复制数据 ≈ 比普通赋值慢约20倍</td></tr><tr><td>拆箱</td><td>类型检查 + 从堆复制数据到栈 ≈ 比普通赋值慢约4倍</td></tr></table>
<pre><code><span class="cm">// 性能陷阱示例——ArrayList中的装箱</span>
<span class="type">ArrayList</span> list = <span class="kw">new</span> <span class="type">ArrayList</span>();
list.Add(<span class="num">1</span>);    <span class="cm">// 装箱！1被装箱为object</span>
list.Add(<span class="num">2</span>);    <span class="cm">// 装箱！</span>
<span class="kw">int</span> sum = <span class="num">0</span>;
<span class="kw">foreach</span> (<span class="kw">object</span> item <span class="kw">in</span> list)
    sum += (<span class="kw">int</span>)item;  <span class="cm">// 拆箱！</span></code></pre>
<div class="highlight"><strong>重要：</strong>解决方案：使用泛型集合（如 <code>List&lt;int&gt;</code>）代替 <code>ArrayList</code>，可以完全避免装箱拆箱。这是泛型最重要的设计动机之一。</div>
<div class="tip"><strong>实践建议：</strong>记忆口诀："装箱往上走（值→引用），拆箱往下走（引用→值）。能不用就不用——泛型是最好的替代方案。"</div>`},
  {id:'core-16', title:'继承——密封类', tags:["sealed", "禁止继承"], content:`<h3>密封类（Sealed Class）</h3>
<p>使用 sealed 关键字修饰的类不能被继承。这是面向对象设计中的"最终类"——继承链到此为止。</p>
<pre><code><span class="cm">// 密封类——不能被继承</span>
<span class="kw">public sealed class</span> <span class="type">FinalCalculator</span>
{
    <span class="kw">public static double</span> <span class="fn">Calculate</span>(<span class="kw">double</span> x, <span class="kw">double</span> y)
        => <span class="type">Math</span>.Sqrt(x * x + y * y);
}

<span class="cm">// 编译错误！不能继承密封类</span>
<span class="cm">// public class SuperCalculator : FinalCalculator { }  // Error!</span></code></pre>
<h3>什么时候使用 sealed？</h3>
<ul><li>不希望类被继承，防止功能被修改或破坏</li><li>类中包含安全敏感逻辑，不允许子类篡改</li><li>该类的设计已经"最终完成"</li><li>密封类可以带来微小的性能提升（JIT编译器可做更多优化）</li><li>静态类隐含就是 sealed</li></ul>
<h3>密封方法（Sealed Override）</h3>
<p>sealed 也可以修饰 override 方法，阻止进一步的子类再次重写该方法。</p>
<pre><code><span class="kw">public class</span> <span class="type">Base</span> { <span class="kw">public virtual void</span> <span class="fn">Method</span>() { } }

<span class="kw">public class</span> <span class="type">Middle</span> : <span class="type">Base</span>
{
    <span class="kw">public sealed override void</span> <span class="fn">Method</span>() { }
}

<span class="kw">public class</span> <span class="type">Derived</span> : <span class="type">Middle</span>
{
    <span class="cm">// 编译错误！不能重写 sealed 方法</span>
    <span class="cm">// public override void Method() { }  // CS0239 Error!</span>
}</code></pre>
<div class="tip"><strong>实践建议：</strong>sealed 是设计决策的一部分——如果不确定一个类是否应该被继承，宁可先不加 sealed。一旦 sealed，就无法撤销。string 就是典型的密封类，你不能继承它。</div>`},
  {id:'core-17', title:'多态——vob', tags:["virtual", "override", "base", "运行时多态"], content:`<h3>多态——面向对象的第三根支柱</h3>
<p>多态（Polymorphism）意味着"多种形态"。通过多态，同一个方法调用可以表现出不同的行为——具体执行哪个版本的方法，由运行时对象的实际类型决定。</p>
<h3>virtual、override、base 三件套</h3>
<pre><code><span class="kw">public class</span> <span class="type">Animal</span>
{
    <span class="cm">// virtual：标记方法为"可被重写"</span>
    <span class="kw">public virtual void</span> <span class="fn">Speak</span>()
    {
        <span class="type">Console</span>.WriteLine(<span class="str">"动物发出声音"</span>);
    }
}

<span class="kw">public class</span> <span class="type">Dog</span> : <span class="type">Animal</span>
{
    <span class="cm">// override：重写父类虚方法</span>
    <span class="kw">public override void</span> <span class="fn">Speak</span>()
    {
        <span class="type">Console</span>.WriteLine(<span class="str">"汪汪汪！"</span>);
    }
}

<span class="kw">public class</span> <span class="type">Cat</span> : <span class="type">Animal</span>
{
    <span class="kw">public override void</span> <span class="fn">Speak</span>()
    {
        <span class="cm">// base：调用父类的实现</span>
        <span class="kw">base</span>.Speak();
        <span class="type">Console</span>.WriteLine(<span class="str">"喵喵喵！"</span>);
    }
}

<span class="cm">// 运行时多态——关键在于对象实际类型</span>
<span class="type">Animal</span> a1 = <span class="kw">new</span> <span class="type">Dog</span>();
<span class="type">Animal</span> a2 = <span class="kw">new</span> <span class="type">Cat</span>();
a1.Speak();  <span class="cm">// 汪汪汪！——执行Dog版本</span>
a2.Speak();  <span class="cm">// 动物发出声音 → 喵喵喵！——执行Cat版本</span></code></pre>
<h3>new 关键字——方法隐藏（不支持多态）</h3>
<pre><code><span class="kw">public class</span> <span class="type">Parent</span> { <span class="kw">public void</span> <span class="fn">Show</span>() => <span class="type">Console</span>.WriteLine(<span class="str">"父类"</span>); }
<span class="kw">public class</span> <span class="type">Child</span> : <span class="type">Parent</span> { <span class="kw">public new void</span> <span class="fn">Show</span>() => <span class="type">Console</span>.WriteLine(<span class="str">"子类"</span>); }

<span class="type">Parent</span> p = <span class="kw">new</span> <span class="type">Child</span>();
p.Show();  <span class="cm">// 输出：父类 —— new隐藏不支持多态！</span></code></pre>
<table><tr><th>关键字组合</th><th>是否支持多态</th><th>调用决定时机</th></tr><tr><td>virtual + override</td><td>是</td><td>运行时（根据对象实际类型）</td></tr><tr><td>new（隐藏）</td><td>否</td><td>编译时（根据引用类型）</td></tr></table>
<div class="tip"><strong>实践建议：</strong>多态的核心价值在于"对扩展开放，对修改关闭"——增加新的子类无需修改已有的多态调用代码。</div>`},
  {id:'core-18', title:'多态——抽象类和抽象方法', tags:["abstract", "纯虚方法", "框架设计"], content:`<h3>抽象类（Abstract Class）</h3>
<p>抽象类是不能被实例化的类，它的作用是作为其他类的基类，定义统一的接口规范。抽象类中可以包含抽象方法——只有声明、没有实现的方法，强制子类去实现。</p>
<pre><code><span class="cm">// 抽象类——不能 new</span>
<span class="kw">public abstract class</span> <span class="type">Shape</span>
{
    <span class="kw">public string</span> Name { <span class="kw">get</span>; <span class="kw">set</span>; }

    <span class="cm">// 抽象方法——没有方法体，子类必须实现</span>
    <span class="kw">public abstract double</span> <span class="fn">GetArea</span>();
    <span class="kw">public abstract double</span> <span class="fn">GetPerimeter</span>();

    <span class="cm">// 普通方法——有默认实现，子类可以继承</span>
    <span class="kw">public void</span> <span class="fn">PrintInfo</span>()
    {
        <span class="type">Console</span>.WriteLine(<span class="str">"$"{Name}: 面积={GetArea()}, 周长={GetPerimeter()}""</span>);
    }
}

<span class="kw">public class</span> <span class="type">Circle</span> : <span class="type">Shape</span>
{
    <span class="kw">public double</span> Radius { <span class="kw">get</span>; <span class="kw">set</span>; }
    <span class="kw">public override double</span> <span class="fn">GetArea</span>() => <span class="type">Math</span>.PI * Radius * Radius;
    <span class="kw">public override double</span> <span class="fn">GetPerimeter</span>() => <span class="num">2</span> * <span class="type">Math</span>.PI * Radius;
}

<span class="kw">public class</span> <span class="type">Rectangle</span> : <span class="type">Shape</span>
{
    <span class="kw">public double</span> Width { <span class="kw">get</span>; <span class="kw">set</span>; }
    <span class="kw">public double</span> Height { <span class="kw">get</span>; <span class="kw">set</span>; }
    <span class="kw">public override double</span> <span class="fn">GetArea</span>() => Width * Height;
    <span class="kw">public override double</span> <span class="fn">GetPerimeter</span>() => <span class="num">2</span> * (Width + Height);
}

<span class="cm">// 使用——多态</span>
<span class="type">Shape</span> s1 = <span class="kw">new</span> <span class="type">Circle</span> { Name = <span class="str">"圆"</span>, Radius = <span class="num">5</span> };
<span class="type">Shape</span> s2 = <span class="kw">new</span> <span class="type">Rectangle</span> { Name = <span class="str">"矩形"</span>, Width = <span class="num">4</span>, Height = <span class="num">6</span> };
s1.PrintInfo();  <span class="cm">// 圆: 面积=78.54, 周长=31.42</span>
s2.PrintInfo();  <span class="cm">// 矩形: 面积=24, 周长=20</span></code></pre>
<div class="highlight"><strong>重要：</strong>抽象类不能实例化，但可以有构造函数（供子类调用）。抽象方法必须在子类中被 override 实现。抽象类是实现"模板方法模式"的理想工具。</div>
<div class="tip"><strong>实践建议：</strong>使用场景：当你需要一个"不完整"的基类——它定义了框架但不提供完整实现时，使用抽象类。如果只需要行为契约而不需要共享代码，优先考虑接口。</div>`},
  {id:'core-19', title:'多态——接口', tags:["interface", "行为规范", "多继承"], content:`<h3>什么是接口？</h3>
<p>接口（Interface）定义了一组行为规范——它只声明"能做什么"，不关心"怎么做"。一个类可以实现多个接口，弥补了 C# 单继承的限制。</p>
<pre><code><span class="cm">// 定义接口——以 I 开头命名</span>
<span class="kw">public interface</span> <span class="type">IFlyable</span>
{
    <span class="cm">// 接口成员默认是 public abstract</span>
    <span class="kw">void</span> <span class="fn">Fly</span>();
    <span class="kw">int</span> MaxHeight { <span class="kw">get</span>; <span class="kw">set</span>; }
}

<span class="kw">public interface</span> <span class="type">ISwimable</span>
{
    <span class="kw">void</span> <span class="fn">Swim</span>();
}

<span class="cm">// 一个类可以实现多个接口</span>
<span class="kw">public class</span> <span class="type">Duck</span> : <span class="type">IFlyable</span>, <span class="type">ISwimable</span>
{
    <span class="kw">public int</span> MaxHeight { <span class="kw">get</span>; <span class="kw">set</span>; } = <span class="num">1000</span>;
    <span class="kw">public void</span> <span class="fn">Fly</span>() => <span class="type">Console</span>.WriteLine(<span class="str">"鸭子在天上飞"</span>);
    <span class="kw">public void</span> <span class="fn">Swim</span>() => <span class="type">Console</span>.WriteLine(<span class="str">"鸭子在水里游"</span>);
}

<span class="cm">// 接口引用——多态</span>
<span class="type">IFlyable</span> flyer = <span class="kw">new</span> <span class="type">Duck</span>();
flyer.Fly();    <span class="cm">// 鸭子在天上飞</span>
<span class="type">ISwimable</span> swimmer = <span class="kw">new</span> <span class="type">Duck</span>();
swimmer.Swim();  <span class="cm">// 鸭子在水里游</span></code></pre>
<h3>接口 vs 抽象类</h3>
<table><tr><th>特性</th><th>接口</th><th>抽象类</th></tr><tr><td>实例化</td><td>不能</td><td>不能</td></tr><tr><td>构造函数</td><td>不能有</td><td>可以有</td></tr><tr><td>字段</td><td>不能有</td><td>可以有</td></tr><tr><td>实现方法</td><td>C# 8.0+ 可有默认实现</td><td>可以有</td></tr><tr><td>多继承</td><td>可以（实现多个接口）</td><td>不能（单继承）</td></tr><tr><td>访问修饰符</td><td>成员默认 public</td><td>可以定义各种修饰符</td></tr><tr><td>设计意图</td><td>"能做什么"——行为契约</td><td>"是什么"——模板/框架</td></tr></table>
<div class="highlight"><strong>重要：</strong>接口是"能做什么"的契约，抽象类是"是什么"的模板。接口解决横向行为共享，抽象类解决纵向代码复用。命名惯例：接口以 I 开头。</div>
<div class="tip"><strong>实践建议：</strong>当一个类既继承基类又实现接口时，基类放在前面：<code>class Dog : Animal, IRunnable</code>。优先使用接口使设计更灵活。</div>`},
  {id:'core-20', title:'多态——密封方法', tags:["sealed override", "禁止重写"], content:`<h3>密封方法（Sealed Override）</h3>
<p>sealed 关键字除了可以修饰类（禁止继承），还可以修饰 override 方法，阻止后续的子类再次重写该方法。</p>
<pre><code><span class="kw">public class</span> <span class="type">Animal</span> { <span class="kw">public virtual void</span> <span class="fn">Speak</span>() { } }

<span class="kw">public class</span> <span class="type">Dog</span> : <span class="type">Animal</span>
{
    <span class="cm">// sealed override：重写后锁定，禁止后续子类再重写</span>
    <span class="kw">public sealed override void</span> <span class="fn">Speak</span>()
    {
        <span class="type">Console</span>.WriteLine(<span class="str">"汪汪汪（锁定版本）"</span>);
    }
}

<span class="kw">public class</span> <span class="type">Husky</span> : <span class="type">Dog</span>
{
    <span class="cm">// 编译错误！不能重写 sealed 方法</span>
    <span class="cm">// public override void Speak() { }  // CS0239 Error</span>

    <span class="cm">// 可以用 new 隐藏绕过（但不推荐，不支持多态）</span>
    <span class="kw">public new void</span> <span class="fn">Speak</span>()
        => <span class="type">Console</span>.WriteLine(<span class="str">"哈士奇的特殊嚎叫"</span>);
}</code></pre>
<h3>sealed 的使用场景</h3>
<ul><li>保护关键逻辑——某个方法的实现在当前层级已经完美，不希望被进一步修改</li><li>性能优化——JIT 编译器可以对 sealed 方法进行内联优化（devirtualization）</li><li>安全考虑——防止恶意子类通过重写来破坏安全逻辑</li><li>设计完成——在框架中锁定某个层级的行为</li></ul>
<div class="tip"><strong>实践建议：</strong>sealed 是一把"锁"——一旦锁上，后续子类就无法重写该方法。使用前确认这个方法的实现真的已经"最终完成"。不建议单纯为了性能加 sealed。</div>`},
  {id:'core-21', title:'面向对象——命名空间', tags:["namespace", "using", "组织代码"], content:`<h3>什么是命名空间？</h3>
<p>命名空间（Namespace）用于组织代码，避免类名冲突。它就像文件系统中的文件夹——不同文件夹下可以有同名文件。</p>
<pre><code><span class="cm">// 定义命名空间</span>
<span class="kw">namespace</span> MyApp.Models
{
    <span class="kw">public class</span> <span class="type">User</span>
    {
        <span class="kw">public int</span> Id { <span class="kw">get</span>; <span class="kw">set</span>; }
        <span class="kw">public string</span> Name { <span class="kw">get</span>; <span class="kw">set</span>; }
    }
}

<span class="kw">namespace</span> MyApp.Services
{
    <span class="kw">public class</span> <span class="type">UserService</span>
    {
        <span class="cm">// 使用完整限定名</span>
        <span class="kw">public</span> MyApp.Models.<span class="type">User</span> <span class="fn">GetUser</span>(<span class="kw">int</span> id)
        {
            <span class="kw">return new</span> MyApp.Models.<span class="type">User</span> { Id = id, Name = <span class="str">"张三"</span> };
        }
    }
}</code></pre>
<h3>using 指令</h3>
<pre><code><span class="cm">// 引用命名空间，避免写完整限定名</span>
<span class="kw">using</span> MyApp.Models;
<span class="kw">using</span> System;
<span class="kw">using static</span> System.Math;  <span class="cm">// C# 6+ 静态导入，可直接用 Sqrt()</span>

<span class="kw">namespace</span> MyApp
{
    <span class="kw">class</span> <span class="type">Program</span>
    {
        <span class="kw">static void</span> <span class="fn">Main</span>()
        {
            <span class="type">User</span> user = <span class="kw">new</span> <span class="type">User</span> { Name = <span class="str">"李四"</span> };
            <span class="kw">double</span> r = Sqrt(<span class="num">25</span>);  <span class="cm">// 直接使用Math.Sqrt</span>
            <span class="type">Console</span>.WriteLine(<span class="str">"$"{user.Name}, {r}""</span>);
        }
    }
}</code></pre>
<h3>C# 10+ 文件范围命名空间</h3>
<pre><code><span class="cm">// 简洁写法——整个文件一个命名空间</span>
<span class="kw">namespace</span> MyApp.Features.Authentication;

<span class="kw">public class</span> <span class="type">AuthService</span> { /* ... */ }</code></pre>
<div class="tip"><strong>实践建议：</strong>命名空间命名惯例：Company.Product.Module（如 Microsoft.EntityFrameworkCore）。每个项目一个根命名空间，按文件夹结构组织子命名空间。避免过深的嵌套（一般不超过3-4层）。</div>`},
  {id:'core-22', title:'面向对象——万物之父中的方法', tags:["ToString", "Equals", "GetType", "浅拷贝"], content:`<h3>Object 中的核心方法</h3>
<p>System.Object 是所有类型的最终基类，它提供了几个核心虚方法，子类可以重写以定制行为。</p>
<table><tr><th>方法</th><th>说明</th><th>建议</th></tr><tr><td><code>ToString()</code></td><td>返回对象的字符串表示</td><td>建议重写，方便调试</td></tr><tr><td><code>Equals(object)</code></td><td>判断两个对象是否相等</td><td>按需重写</td></tr><tr><td><code>GetHashCode()</code></td><td>返回哈希码</td><td>重写Equals必须同步重写</td></tr><tr><td><code>GetType()</code></td><td>返回对象的运行时类型</td><td>非虚方法，不能重写</td></tr><tr><td><code>MemberwiseClone()</code></td><td>创建浅表副本（protected）</td><td>按需使用</td></tr></table>
<pre><code><span class="kw">public class</span> <span class="type">Person</span>
{
    <span class="kw">public string</span> Name { <span class="kw">get</span>; <span class="kw">set</span>; }
    <span class="kw">public int</span> Age { <span class="kw">get</span>; <span class="kw">set</span>; }

    <span class="cm">// 重写 ToString——方便调试和日志输出</span>
    <span class="kw">public override string</span> <span class="fn">ToString</span>()
        => <span class="str">"$"Person[Name={Name}, Age={Age}]""</span>;

    <span class="cm">// 重写 Equals——定义"值相等"的含义</span>
    <span class="kw">public override bool</span> <span class="fn">Equals</span>(<span class="kw">object</span> obj)
    {
        <span class="kw">if</span> (obj <span class="kw">is not</span> <span class="type">Person</span> other) <span class="kw">return false</span>;
        <span class="kw">return</span> Name == other.Name && Age == other.Age;
    }

    <span class="cm">// 重写 Equals 必须同步重写 GetHashCode</span>
    <span class="kw">public override int</span> <span class="fn">GetHashCode</span>()
        => <span class="type">HashCode</span>.Combine(Name, Age);
}

<span class="type">Person</span> p1 = <span class="kw">new</span> <span class="type">Person</span> { Name = <span class="str">"张三"</span>, Age = <span class="num">25</span> };
<span class="type">Person</span> p2 = <span class="kw">new</span> <span class="type">Person</span> { Name = <span class="str">"张三"</span>, Age = <span class="num">25</span> };
<span class="kw">bool</span> eq = p1.Equals(p2);  <span class="cm">// true（基于值的比较）</span>
<span class="type">Console</span>.WriteLine(p1);      <span class="cm">// Person[Name=张三, Age=25]</span></code></pre>
<div class="highlight"><strong>重要：</strong>重写 Equals 时必须同步重写 GetHashCode()——两个相等的对象必须返回相同的哈希码。此外，建议同时实现 <code>IEquatable&lt;T&gt;</code> 接口以获得更好的泛型集合性能。</div>
<div class="tip"><strong>实践建议：</strong>ToString() 建议总是重写——调试时非常有用。GetType() 在反射和类型判断中常用。MemberwiseClone() 创建的是浅拷贝——引用类型字段只复制引用，不复制对象本身。</div>`},
  {id:'core-23', title:'面向对象——string', tags:["字符串操作", "IndexOf", "Split", "Replace"], content:`<h3>String 类概述</h3>
<p>string 是 C# 中最常用的引用类型之一，但具有值类型的某些特性。string 是密封类（sealed），不可变（immutable）——一旦创建，内容不可修改，所有"修改"操作都返回新字符串。</p>
<h3>字符串不可变性</h3>
<pre><code><span class="kw">string</span> s1 = <span class="str">"Hello"</span>;
<span class="kw">string</span> s2 = s1.Replace(<span class="str">"H"</span>, <span class="str">"J"</span>);
<span class="cm">// s1 仍然是 "Hello"（没变！）</span>
<span class="cm">// s2 = "Jello"（新字符串）</span>
<span class="cm">// 每次操作都产生新对象——频繁拼接要注意性能</span></code></pre>
<h3>常用方法</h3>
<pre><code><span class="kw">string</span> text = <span class="str">"Hello CSharp World"</span>;

<span class="cm">// 索引和查找</span>
<span class="kw">int</span> i1 = text.IndexOf(<span class="str">"C"</span>);      <span class="cm">// 6</span>
<span class="kw">int</span> i2 = text.LastIndexOf(<span class="str">"o"</span>);   <span class="cm">// 16</span>
<span class="kw">bool</span> b1 = text.Contains(<span class="str">"Sharp"</span>);  <span class="cm">// true</span>
<span class="kw">bool</span> b2 = text.StartsWith(<span class="str">"Hel"</span>);  <span class="cm">// true</span>

<span class="cm">// 提取</span>
<span class="kw">string</span> sub = text.Substring(<span class="num">6</span>, <span class="num">5</span>);  <span class="cm">// "CShar"</span>

<span class="cm">// 分割与合并</span>
<span class="kw">string</span>[] parts = text.Split(<span class="str">" "</span>);            <span class="cm">// ["Hello","CSharp","World"]</span>
<span class="kw">string</span> joined = <span class="kw">string</span>.Join(<span class="str">", "</span>, parts); <span class="cm">// "Hello, CSharp, World"</span>

<span class="cm">// 替换与修剪</span>
<span class="kw">string</span> r1 = text.Replace(<span class="str">"World"</span>, <span class="str">"C#"</span>); <span class="cm">// "Hello CSharp C#"</span>
<span class="kw">string</span> t1 = <span class="str">"  abc  "</span>.Trim();          <span class="cm">// "abc"</span>

<span class="cm">// 大小写与判空</span>
<span class="kw">string</span> u = text.ToUpper();                           <span class="cm">// "HELLO CSHARP WORLD"</span>
<span class="kw">bool</span> e1 = <span class="kw">string</span>.IsNullOrEmpty(s);             <span class="cm">// null 或 ""</span>
<span class="kw">bool</span> e2 = <span class="kw">string</span>.IsNullOrWhiteSpace(s);        <span class="cm">// null、"" 或纯空白</span></code></pre>
<h3>字符串格式化（三种方式）</h3>
<pre><code><span class="kw">string</span> name = <span class="str">"张三"</span>; <span class="kw">int</span> age = <span class="num">25</span>;

<span class="cm">// 方式1：$ 插值（最推荐）</span>
<span class="kw">string</span> s1 = <span class="str">"$"我叫{name}，明年{age + 1}岁""</span>;

<span class="cm">// 方式2：String.Format</span>
<span class="kw">string</span> s2 = <span class="kw">string</span>.Format(<span class="str">""我叫{0}，明年{1}岁""</span>, name, age + <span class="num">1</span>);

<span class="cm">// 方式3：+ 拼接（少量时可用）</span>
<span class="kw">string</span> s3 = <span class="str">"我叫""</span> + name + <span class="str">""，明年""</span> + (age + <span class="num">1</span>) + <span class="str">"岁""</span>;</code></pre>
<div class="tip"><strong>实践建议：</strong>大量字符串拼接请使用 StringBuilder，循环中的 += 会产生大量临时对象。字符串比较使用 StringComparison.Ordinal 或 OrdinalIgnoreCase 以获得一致的行为。</div>`},
  {id:'core-24', title:'面向对象——StringBuilder', tags:["可变字符串", "性能优化", "Capacity"], content:`<h3>为什么需要 StringBuilder？</h3>
<p>string 是不可变的，每次修改都产生新对象。在大量拼接场景下（如循环中构建 SQL、生成报表），频繁创建临时字符串会严重影响性能。StringBuilder 通过内部维护一个可变的字符缓冲区来解决这个问题。</p>
<pre><code><span class="cm">// 性能对比：string vs StringBuilder</span>
<span class="cm">// string += （差——每次创建新对象，产生10000个临时字符串）</span>
<span class="kw">string</span> result1 = <span class="str">""</span>;
<span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i < <span class="num">10000</span>; i++)
    result1 += <span class="str">"a"</span>;

<span class="cm">// StringBuilder（好——一个缓冲区搞定，只产生一个最终字符串）</span>
<span class="kw">var</span> sb = <span class="kw">new</span> <span class="type">StringBuilder</span>();
<span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i < <span class="num">10000</span>; i++)
    sb.Append(<span class="str">"a"</span>);
<span class="kw">string</span> result2 = sb.ToString();</code></pre>
<h3>常用方法</h3>
<pre><code><span class="kw">var</span> sb = <span class="kw">new</span> <span class="type">StringBuilder</span>();

sb.Append(<span class="str">"Hello"</span>);
sb.AppendLine();                          <span class="cm">// 追加换行</span>
sb.AppendFormat(<span class="str">""{0} + {1} = {2}""</span>, <span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>);

sb.Insert(<span class="num">0</span>, <span class="str">"[开始] "</span>);             <span class="cm">// 在指定位置插入</span>
sb.Replace(<span class="str">"Hello"</span>, <span class="str">"Hi"</span>);            <span class="cm">// 替换</span>
sb.Remove(<span class="num">0</span>, <span class="num">3</span>);                   <span class="cm">// 从位置0开始删除3个字符</span>

<span class="cm">// 容量管理</span>
<span class="kw">int</span> cap = sb.Capacity;          <span class="cm">// 当前容量</span>
<span class="kw">int</span> len = sb.Length;            <span class="cm">// 当前字符数</span>
sb.Capacity = <span class="num">1000</span>;               <span class="cm">// 预设容量，避免频繁扩容</span>

<span class="kw">string</span> result = sb.ToString();   <span class="cm">// 转换为 string</span></code></pre>
<h3>链式调用（Fluent API）</h3>
<pre><code><span class="kw">var</span> sb = <span class="kw">new</span> <span class="type">StringBuilder</span>()
    .Append(<span class="str">"姓名："</span>)
    .AppendLine(<span class="str">"张三"</span>)
    .Append(<span class="str">"年龄："</span>)
    .Append(<span class="num">25</span>)
    .AppendLine()
    .AppendFormat(<span class="str">""日期：{0:yyyy-MM-dd}""</span>, <span class="type">DateTime</span>.Now);</code></pre>
<div class="tip"><strong>实践建议：</strong>预估字符串长度时，可以在构造时指定初始容量：<code>new StringBuilder(1000)</code>，避免内部自动扩容带来的开销。小规模拼接（3-5次）直接用 + 或 $"" 即可，不用刻意使用 StringBuilder。</div>`},
  {id:'core-25', title:'面向对象——结构体和类的区别', tags:["值vs引用", "栈vs堆", "选择"], content:`<h3>结构体（struct）vs 类（class）</h3>
<p>struct 和 class 是 C# 中定义类型的两种主要方式。它们最核心的区别在于：struct 是值类型，class 是引用类型。</p>
<table><tr><th>对比维度</th><th>结构体（struct）</th><th>类（class）</th></tr><tr><td>类型分类</td><td>值类型</td><td>引用类型</td></tr><tr><td>存储位置</td><td>栈（通常）/ 作为字段时在堆上</td><td>堆</td></tr><tr><td>赋值行为</td><td>复制整个数据</td><td>复制引用（指向同一对象）</td></tr><tr><td>默认值</td><td>不能为 null（除非 Nullable&lt;T&gt;）</td><td>可以为 null</td></tr><tr><td>继承</td><td>只能实现接口，不能继承</td><td>可以单继承 + 多接口</td></tr><tr><td>无参构造</td><td>C# 10+ 支持</td><td>一直支持</td></tr><tr><td>析构函数</td><td>不支持</td><td>支持</td></tr><tr><td>适用场景</td><td>小、短生命周期、不可变数据</td><td>复杂逻辑、继承、长生命周期</td></tr></table>
<pre><code><span class="cm">// struct — 值类型行为（赋值时复制全部数据）</span>
<span class="kw">public struct</span> <span class="type">Point</span>
{
    <span class="kw">public int</span> X;
    <span class="kw">public int</span> Y;
    <span class="kw">public</span> <span class="fn">Point</span>(<span class="kw">int</span> x, <span class="kw">int</span> y) { X = x; Y = y; }
}

<span class="type">Point</span> p1 = <span class="kw">new</span> <span class="type">Point</span>(<span class="num">1</span>, <span class="num">2</span>);
<span class="type">Point</span> p2 = p1;    <span class="cm">// p2 是 p1 的独立副本</span>
p2.X = <span class="num">10</span>;        <span class="cm">// 修改 p2 不影响 p1</span>
<span class="cm">// Console.WriteLine(p1.X); // 还是 1</span></code></pre>
<pre><code><span class="cm">// class — 引用类型行为（赋值时复制引用）</span>
<span class="kw">public class</span> <span class="type">Person</span>
{
    <span class="kw">public string</span> Name;
    <span class="kw">public</span> <span class="fn">Person</span>(<span class="kw">string</span> name) { Name = name; }
}

<span class="type">Person</span> r1 = <span class="kw">new</span> <span class="type">Person</span>(<span class="str">"张三"</span>);
<span class="type">Person</span> r2 = r1;   <span class="cm">// r2 和 r1 指向同一个对象！</span>
r2.Name = <span class="str">"李四"</span>;    <span class="cm">// 通过 r2 修改会影响 r1</span>
<span class="cm">// Console.WriteLine(r1.Name); // "李四" ——被改了！</span></code></pre>
<h3>选择指南</h3>
<ul><li>数据量小（通常 &lt; 16 字节）→ struct</li><li>逻辑简单，主要是数据容器 → struct</li><li>需要继承和多态 → class</li><li>表示"值"语义（坐标、颜色、复数、金额）→ struct</li><li>表示"实体"（人、订单、数据库记录）→ class</li><li>不确定时 → 默认用 class</li></ul>
<div class="tip"><strong>实践建议：</strong>struct 适合表示"值"，class 适合表示"实体"。自 C# 10 起，推荐使用 <code>record struct</code> 来定义不可变的值类型，<code>record</code> / <code>record class</code> 用于引用类型的不可变数据。</div>`},
  {id:'core-26', title:'面向对象——抽象类和接口的区别', tags:["对比", "选择标准"], content:`<h3>抽象类 vs 接口 —— 完整对比</h3>
<p>这是面向对象面试中最常见的问题之一。两者的核心差异在于设计意图：抽象类回答"是什么"，接口回答"能做什么"。</p>
<table><tr><th>对比维度</th><th>抽象类</th><th>接口</th></tr><tr><td>关键字</td><td><code>abstract class</code></td><td><code>interface</code></td></tr><tr><td>实例化</td><td>不能</td><td>不能</td></tr><tr><td>构造函数</td><td>可以有</td><td>不能有</td></tr><tr><td>字段</td><td>可以有</td><td>不能有（只有属性和方法）</td></tr><tr><td>方法实现</td><td>可以包含已实现的方法</td><td>C# 8.0+ 可以有默认实现</td></tr><tr><td>多继承</td><td>不支持（单继承）</td><td>支持（实现多个接口）</td></tr><tr><td>设计意图</td><td>"是什么"——代码复用/框架模板</td><td>"能做什么"——行为契约</td></tr></table>
<h3>代码示例对比</h3>
<pre><code><span class="cm">// 抽象类：共享代码 + 定义模板</span>
<span class="kw">public abstract class</span> <span class="type">LoggerBase</span>
{
    <span class="cm">// 共享字段——所有子类复用</span>
    <span class="kw">protected string</span> logFormat = <span class="str">"yyyy-MM-dd HH:mm:ss"</span>;

    <span class="cm">// 已实现的方法——所有子类共享</span>
    <span class="kw">protected string</span> <span class="fn">FormatMessage</span>(<span class="kw">string</span> msg)
        => <span class="str">"$"{DateTime.Now.ToString(logFormat)} {msg}""</span>;

    <span class="cm">// 抽象方法——子类必须实现（定义模板）</span>
    <span class="kw">public abstract void</span> <span class="fn">WriteLog</span>(<span class="kw">string</span> message);
}

<span class="cm">// 接口：只定义行为契约（没有共享代码）</span>
<span class="kw">public interface</span> <span class="type">ILoggable</span>
{
    <span class="kw">void</span> <span class="fn">Log</span>(<span class="kw">string</span> message);
    <span class="kw">string</span> LogLevel { <span class="kw">get</span>; }
}</code></pre>
<h3>如何选择？</h3>
<table><tr><th>场景</th><th>推荐</th><th>原因</th></tr><tr><td>需要共享代码/字段</td><td>抽象类</td><td>接口不能包含字段和（旧版）实现</td></tr><tr><td>需要多继承</td><td>接口</td><td>C# 不支持类的多继承</td></tr><tr><td>"is-a" 关系（狗是动物）</td><td>抽象类</td><td>表示分类体系</td></tr><tr><td>"can-do" 关系（鸟能飞）</td><td>接口</td><td>表示跨类型的能力</td></tr><tr><td>不相关的类共享行为</td><td>接口</td><td>鸟和飞机都会飞，但它们不是同类</td></tr><tr><td>版本频繁演进</td><td>抽象类</td><td>添加方法不会破坏已有子类</td></tr></table>
<div class="tip"><strong>实践建议：</strong>经验法则：优先使用接口（更灵活），当有共享代码需要复用时，将接口升级为抽象类。一个常见的 .NET 模式是：接口 + 抽象基类（提供默认实现）+ 具体类，如 <code>IList&lt;T&gt;</code> + <code>Collection&lt;T&gt;</code> + <code>List&lt;T&gt;</code>。</div>`}
]},

{id:'advanced', title:'四、C# 进阶教学', desc:'掌握集合、泛型、委托事件、多线程、反射、排序算法等高级主题', badge:'进阶', lessons:[
  {id:'adv-1', title:'ArrayList', tags:['集合','object数组','装箱拆箱'], content:`
<h4>ArrayList 的本质</h4>
<p>ArrayList 是 C# 封装好的类，本质是一个 <strong>object 类型的数组</strong>，可以存储任意类型。由于使用 object（万物之父）存储，存在<strong>装箱拆箱</strong>的性能开销，尽量少用。</p>

<h4>增删查改</h4>
<div class="code-block"><div class="code-header"><span class="code-lang">C#</span><button class="code-copy" onclick="copyCode(this)">复制</button></div><pre><span class="cm">// 需要 using System.Collections;</span>
<span class="type">ArrayList</span> arr = <span class="kw">new</span> <span class="type">ArrayList</span>();

<span class="cm">// 增</span>
arr.Add(<span class="num">1</span>); arr.Add(<span class="str">"hello"</span>); arr.Add(<span class="kw">true</span>);
arr.AddRange(anotherList);  <span class="cm">// 批量添加</span>
